name: setup-sieve
description: >
  Install gale's pinned sieve (pulseengine's shared CI path classifier, see
  sieve.toml) from its GitHub release, check the archive's sha256 and the
  binary's own version, and put it first on PATH. sieve is not in the varve
  layer gale pins (covalent 2026.11.7 is frozen for v0.11.0), so the pin lives
  here. `cargo xtask check sieve-pin` compares everything from `runs:` on with
  a canonical text held in the gate (only the version and the two sha256
  values may differ), and fails when a job runs sieve without this action or
  the "Pinned sieve is the one on PATH" step after it.
  The sha256 values are the release's SHA256SUMS.txt entries, which were
  verified with cosign against the sieve release workflow's identity before
  they were copied here (docs/ci/sieve.md says how to redo that for a bump).

runs:
  using: composite
  steps:
    - name: Install sieve 0.4.2 (pinned by sha256)
      shell: bash
      env:
        SIEVE_VERSION: "0.4.2"
        SIEVE_SHA256_X86_64: "51ef59f5cf8b542d142c073446d5773147a5806c84be56c5c4e30783e6cd6647"
        SIEVE_SHA256_AARCH64: "509f6da904afdae5dc16be75c02a75a90a4b65f13f6529d15b61f0f621d62911"
        PREFIX: ${{ runner.temp }}
      run: |
        set -euo pipefail
        os="$(uname -s)"
        arch="$(uname -m)"
        case "$os/$arch" in
          Linux/x86_64) target=x86_64-unknown-linux-musl; sha="$SIEVE_SHA256_X86_64" ;;
          Linux/aarch64|Linux/arm64) target=aarch64-unknown-linux-musl; sha="$SIEVE_SHA256_AARCH64" ;;
          *) echo "::error::no pinned sieve $SIEVE_VERSION for $os/$arch"; exit 1 ;;
        esac
        dir="$PREFIX/sieve-$SIEVE_VERSION"
        tgz="$PREFIX/sieve-$SIEVE_VERSION-$target.tar.gz"
        url="https://github.com/pulseengine/sieve/releases/download/v$SIEVE_VERSION/sieve-v$SIEVE_VERSION-$target.tar.gz"
        mkdir -p "$dir"
        curl -sSfL --retry 3 --retry-delay 5 -o "$tgz" "$url"
        echo "$sha  $tgz" | sha256sum -c -
        tar xzf "$tgz" -C "$dir"
        rm -f "$tgz"
        # The version the binary reports, by absolute path. This proves the
        # asset; what PATH resolves is proved by the step each job runs next
        # (the GITHUB_PATH line below only reaches later steps).
        got="$("$dir/sieve" --version)"
        first="${got%%$'\n'*}"
        echo "$first"
        if [ "$first" != "sieve $SIEVE_VERSION" ]; then
          echo "::error::installed sieve reports '$first', not 'sieve $SIEVE_VERSION'"
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "SIEVE_PINNED_DIR=$dir" >> "$GITHUB_ENV"
        echo "SIEVE_PINNED_VERSION=$SIEVE_VERSION" >> "$GITHUB_ENV"
