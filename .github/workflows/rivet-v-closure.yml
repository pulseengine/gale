# Traceability-completeness gate (v0.6.0 / D3).
#
# The release-completeness gate asks "does every approved/implemented artifact have its
# V closed?" — a question that is only answerable if requirement statuses track their
# verification artifacts. They drifted: 16 requirements carried a `verified` VER-* while
# still reading `implemented`/`proposed` themselves (the verified driver suite, gpio,
# timer, the syscall seam, I-ISO, tri-track). The gate misreported them as not-done — it
# erred safe, but it lied, and nothing stopped it recurring. This gate is that stop.
name: rivet V-closure

on:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "tools/check-v-closure.py"
      - ".github/workflows/rivet-v-closure.yml"
  pull_request:
    branches: [main]
    # NO `paths:` FILTER — this gate must be REQUIRABLE (gale#294).
    #
    # A filtered workflow does not run when a PR touches nothing it cares about,
    # so GitHub never creates its check, and a required context that never
    # reports blocks the PR forever. This workflow carries verification claims,
    # which makes it one of the ones most worth requiring — so the filter moves
    # off the trigger and into the job as a step-level early exit (pattern from
    # gale#319). The job always runs and always reports; when nothing relevant
    # changed it exits in seconds without building anything.
    paths:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # The path filter that used to live on the trigger. Kept here so the gate
    # below still REPORTS its check on every PR (gale#294) while doing no work
    # when nothing relevant changed.
    name: "V-closure needed?"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: q
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^artifacts/|^tools/check-v-closure\.py$|^\.github/workflows/rivet-v-closure\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "artifacts or the checker changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no relevant path changed — reporting without running"
          fi

  v-closure:
    name: "no requirement lags its closed V"
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Traceability-completeness gate
        if: needs.guard.outputs.run == 'true'
        run: python3 tools/check-v-closure.py
