# Traceability-completeness gate (v0.6.0 / D3).
#
# The release-completeness gate asks "does every approved/implemented artifact have its
# V closed?" — a question that is only answerable if requirement statuses track their
# verification artifacts. They drifted: 16 requirements carried a `verified` VER-* while
# still reading `implemented`/`proposed` themselves (the verified driver suite, gpio,
# timer, the syscall seam, I-ISO, tri-track). The gate misreported them as not-done — it
# erred safe, but it lied, and nothing stopped it recurring. This gate is that stop.
name: rivet V-closure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NO `paths:` FILTER on any trigger — this workflow hosts required contexts
  # (gale#294; sieve's rule for every workflow that does). Whether the gate has
  # work to do is decided per PR by sieve (class `v_closure` in sieve.toml) in
  # the "V-closure needed?" job; the gate job skips only through sieve's
  # classifier `if:`, and still reports its check when it does.
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (sieve check-workflows fails a PR that drops this). sieve runs
  # everything on merge_group.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # Hosts sieve's classification for this workflow (it replaced a path regex
    # here). Its name stays because "V-closure needed?" is a required context
    # on main (.github/required-contexts.txt); renaming it is an org-admin change.
    name: "V-closure needed?"
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      v_closure: ${{ steps.sieve.outputs.v_closure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sieve
      - name: Pinned sieve is the one on PATH
        run: |
          set -euo pipefail
          got="$(command -v sieve || true)"
          if [ "$got" != "$SIEVE_PINNED_DIR/sieve" ]; then
            echo "::error::sieve on PATH is '${got:-<none>}', not the pinned $SIEVE_PINNED_DIR/sieve"
            exit 1
          fi
      - id: sieve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sieve classify --config sieve.toml --base "$BASE_SHA" --event "$EVENT_NAME" --format github-output

  v-closure:
    name: "no requirement lags its closed V"
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result != 'success' || needs.guard.outputs.v_closure != 'false') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Traceability-completeness gate
        run: python3 tools/check-v-closure.py
