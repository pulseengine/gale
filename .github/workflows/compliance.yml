name: Compliance report

# Publishes gale-<tag>-compliance-report.tar.gz to each GitHub Release so
# pulseengine.eu's fetch-reports surfaces gale's rivet traceability/compliance
# evidence on the Reports page. Mirrors pulseengine/synth's compliance.yml.
#
# Decoupled from release.yml on purpose: triggers on release publish, is
# additive, and cannot affect the release flow if it fails.
#
# NOTE: rivet-version pins the rivet binary used to validate/export gale's
# artifacts. v0.28.0: keeps configurable release-status readiness (`release.require:
# coverage`, rivet #612) and adds validate cross-repo UnknownPrefix scoping (#649),
# ASPICE swe1-verification reachability (#652), schema-drift warning (#679), and
# RUSTSEC bumps (quick-xml, crossbeam-epoch). `rivet validate` is PASS (331 warnings,
# byte-for-byte same as 0.23.0) and `rivet release status` verdicts unchanged on
# gale's artifacts under 0.25.0 (verified 2026-07-10). Bump in lockstep if a future
# schema needs a newer rivet.

on:
  # `release: published` alone does NOT fire here. release.yml creates the
  # release with GITHUB_TOKEN, and GitHub does not start workflow runs from
  # GITHUB_TOKEN-raised events — so this workflow ran once, for v0.4.0, and
  # v0.5.0/v0.6.0/v0.7.0 all published with no compliance report (gale#333).
  #
  # The tag push IS a human action (checked: v0.4.0..v0.7.0 all tagged by a
  # person, and release.yml itself triggers on `push: tags` and has run for
  # every one of them). So triggering on the same push restores the report
  # without touching release.yml — which matters, because the header above
  # says this workflow is decoupled on purpose and must not be able to affect
  # the release flow. Adding a dispatch step to release.yml would have coupled
  # them; this does not.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)generate the report for (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  compliance:
    name: Generate compliance report
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # push:tags sets neither inputs.tag nor event.release.tag_name;
          # GITHUB_REF_NAME is the tag on that event.
          TAG="${INPUT_TAG:-${REL_TAG:-$GITHUB_REF_NAME}}"
          case "$TAG" in v*) ;; *) echo "::error::tag '$TAG' must start with v"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Release readiness burn-down (rivet release status)
        # Burn-down of the artifacts scoped to `release: <tag>` (rivet #516).
        #
        # READ THE VERDICT NARROWLY. gale sets `release.require: coverage` in
        # rivet.yaml, which counts an artifact release-ready when its validate
        # coverage rules pass -- i.e. when a `verifies` link EXISTS -- regardless
        # of the state of the artifact on the other end of that link. rivet says
        # so itself: `release status --help` notes this "is NOT the same as
        # 'every verification level present'".
        #
        # So "Cuttable" here means the V is STRUCTURALLY closed, not that the
        # verification was performed. As of gale#342 that is not academic:
        # v0.7.1 and v0.7.2 both report Cuttable with zero verified artifacts,
        # greened by VER-* artifacts that are themselves `proposed`.
        #
        # (An earlier version of this comment claimed the verdict was MEANINGFUL
        # because "the V is closed", and called it pending rivet#612. rivet#612
        # closed 2026-07-03 -- by documenting that the semantics are weaker than
        # that claim. gale#342 tracks whether to keep `require: coverage`.)
        #
        # Not `exit 1`-gated because this workflow runs POST-publish; the pre-cut
        # gate is `rivet release status` + `rivet validate` run before tagging.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          # No `|| true` on acquisition: a failed download used to leave $RV empty
          # and the step still passed, writing an empty burn-down that looked like
          # a clean one. Pinned to the same rivet the compliance action below uses.
          gh release download v0.35.0 --repo pulseengine/rivet \
            -p '*x86_64-unknown-linux-gnu*' -D "$d"
          tar xzf "$d"/*x86_64-unknown-linux-gnu*.tar.gz -C "$d"
          # No pipe: `find | head -1` under `set -e -o pipefail` aborts when head
          # closes the pipe and find takes SIGPIPE (141). -print -quit stops at
          # the first match with no second process to signal.
          RV=$(find "$d" -name rivet -type f -print -quit)
          test -n "$RV" || { echo "::error::rivet binary not found after download"; exit 1; }
          chmod +x "$RV"
          "$RV" --version
          {
            echo "## Release readiness — \`$TAG\` (rivet release status)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The verdict itself stays advisory (see above), so this one keeps its
          # `|| true` -- deliberately, and it is the only one left in this step.
          "$RV" release status "$TAG" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          {
            echo '```'
            echo "_Advisory. With \`require: coverage\` a \"Cuttable\" verdict means every"
            echo "artifact has a verifying LINK, not that the verification was performed —"
            echo "see gale#342. Blocking gate = \`rivet validate\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate compliance report
        id: report
        uses: pulseengine/rivet/.github/actions/compliance@v0.35.0
        with:
          theme: dark
          rivet-version: v0.28.0
          include-data-formats: true
          report-label: ${{ steps.tag.outputs.tag }}
          archive: 'true'
          archive-name: gale-${{ steps.tag.outputs.tag }}-compliance-report

      - name: Upload report to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PATH: ${{ steps.report.outputs.archive-path }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${ARCHIVE_PATH:-}" ] || [ ! -f "$ARCHIVE_PATH" ]; then
            echo "::error::compliance action produced no archive-path"; exit 1
          fi
          gh release upload "$TAG" "$ARCHIVE_PATH" --clobber
          echo "::notice title=Compliance report::uploaded $(basename "$ARCHIVE_PATH")"
