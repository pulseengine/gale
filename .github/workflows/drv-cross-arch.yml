# Cross-architecture seam gate for the thin-seam drivers (gale#307 follow-up).
#
# The property: a driver "crosses" only if its lowered object's UNDEFINED symbol
# set is EXACTLY the set of names its wasm imports. Not "> 0", which a leaked
# symbol satisfies as well as a real seam symbol, and which fails a correct
# driver that imports nothing (hm-thin). Not "== 0" either, which is the
# synth#871 truncation shape. Equality.
#
# On that rule: ARM holds for all 13 drivers. RISC-V holds for NONE of them --
# synth's RV32 selector declines a function it cannot select, emits the call
# site anyway, and ships the unlinkable object with exit 0 (synth#1102). The
# RISC-V leg is therefore carried as an explicit known-defect ledger inside
# check-cross-arch.py, which FAILS if a driver's status changes in either
# direction, so the ledger shrinks to empty rather than outliving the bug.
#
# An earlier version of this file claimed "on the pinned toolchain every driver
# crosses and the gate exits 0". That was the `> 0` rule reading a dangling
# `synth_func_N` as a seam symbol. The script still refuses to run unpinned.
name: driver cross-arch seam

# NO `paths:` FILTER — deliberately. This gate must be REQUIRABLE (gale#294).
#
# A path-filtered workflow does not run when a PR touches nothing it cares about,
# and GitHub never creates its check. A required context that never reports blocks
# the PR forever, so a filtered gate cannot be added to
# `required_status_checks.contexts` — it would trade an empty gate for a
# deadlocked one. 10 of gale's 17 PR-triggered workflows are in that state, and
# they are the safety-relevant ones (formal-verification, rivet-v-closure, both
# driver gates), which is why #294 has not been a one-line fix.
#
# The path filter is therefore moved OFF the trigger and INTO the job, as an
# early exit. The job always runs and always reports; when no relevant path
# changed it exits 0 in seconds without installing a toolchain. Cost is one cheap
# runner slot per PR; the expensive matrix still only runs when it must.
#
# Note the shape: the skip is a STEP-level early exit inside the reporting job,
# not a job-level `if:` that would render the job "skipped". That avoids relying
# on how branch protection treats a skipped check — the context reports a real
# success either way.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # KEEP IN SYNC WITH varve.toml. This workflow downloads its own synth/loom
  # rather than resolving them through varve, so the pin exists twice and can
  # drift. It just did: the gate passes --embedder-data-init/--embedder-global-init,
  # which synth 0.58.0 does not have, so leaving this at 0.58.0 while varve.toml
  # moved to layer 2026.09.0 would fail the gate with "unexpected argument".
  # Matching layer 2026.09.0.
  SYNTH_VERSION: "0.60.0"
  LOOM_VERSION: "1.4.1"

jobs:
  cross-arch:
    # ubuntu-24.04, NOT 22.04. synth's published Linux binaries need GLIBC 2.39;
    # 22.04 ships 2.35, and the binary dies with
    #   libc.so.6: version `GLIBC_2.39' not found
    # which under `set -o pipefail` killed this gate at its own version check,
    # producing NO output at all. gustos-dissolve.yml — the other synth-using
    # workflow — is already on 24.04; this one copied 22.04 from a workflow that
    # does not use synth.
    name: "seam survives lowering on ARM and RISC-V (all thin drivers)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the guard diffs against the merge base

      - name: Does this change touch the driver seam?
        id: guard
        # The path filter that used to live on the trigger. Same globs, evaluated
        # here so the job still REPORTS when they do not match (gale#294).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push to main — always run"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          if printf '%s\n' "$changed" | grep -qE \
              '^benches/gust/drivers/[^/]+-thin/|^benches/gust/drivers/wit/|^benches/gust/drivers/build-cross-arch\.sh$|^benches/gust/drivers/check-cross-arch\.py$|^\.github/workflows/drv-cross-arch\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "driver seam touched — running the gate"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no driver-seam path changed — gate vacuously satisfied, exiting 0"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned synth + loom
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pe-toolchain/bin" && cd "$HOME/pe-toolchain"
          fetch() {
            local repo="$1" ver="$2" bin="$3"
            local tar="${repo}-v${ver}-x86_64-unknown-linux-gnu.tar.gz"
            gh release download "v${ver}" --repo "pulseengine/${repo}" \
              -p "$tar" -p SHA256SUMS.txt --clobber -D "$repo-$ver"
            ( cd "$repo-$ver" && sha256sum -c --ignore-missing SHA256SUMS.txt 2>/dev/null \
              | grep -q "$tar: OK" || { echo "::error::$repo $ver checksum FAILED"; exit 1; } )
            tar xzf "$repo-$ver/$tar" -C "$repo-$ver"
            install -m755 "$(find "$repo-$ver" -name "$bin" -type f | head -1)" "$HOME/pe-toolchain/bin/$bin"
          }
          fetch synth "$SYNTH_VERSION" synth
          fetch loom  "$LOOM_VERSION"  loom
          echo "$HOME/pe-toolchain/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        if: steps.guard.outputs.run == 'true'
        # check-cross-arch.py derives each driver's EXPECTED undefined set from
        # the wasm's import section, so it needs wasm-tools -- the old shell gate
        # only ran nm and did not. Pinned to the same version drv-components.yml
        # uses, so the two gates read imports through identical tooling.
        run: cargo install wasm-tools --version 1.245.1 --locked

      - name: Install binutils (nm)
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi

      # Negative control FIRST: an unpinned toolchain must be REFUSED, not
      # silently answered. That refusal is the whole reason this gate is
      # trustworthy — the property it checks is toolchain-sensitive.
      - name: Negative control — an unpinned/old synth must be refused
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd benches/gust/drivers
          if SYNTH=/usr/bin/false bash build-cross-arch.sh >/dev/null 2>&1; then
            echo "::error::the pin guard did not bite — gate would answer from an unknown toolchain"
            exit 1
          fi
          echo "pin guard bites"

      # Print what the gate is about to use BEFORE running it. The first CI
      # attempt failed with no output at all — not even the script's own
      # "gate toolchain:" line — which made it undiagnosable from the log. A
      # gate that dies silently in setup is the same problem as a check that
      # passes silently: there is nothing to read.
      - name: Toolchain diagnostics
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "HOME=$HOME"
          ls -la "$HOME/pe-toolchain/bin" || echo "  (bin dir missing)"
          for t in synth loom; do
            b="$HOME/pe-toolchain/bin/$t"
            if [ -x "$b" ]; then echo "  $t: $("$b" --version 2>&1 | head -1)"
            else echo "  $t: NOT EXECUTABLE at $b"; fi
          done
          for t in arm-none-eabi-nm arm-none-eabi-size nm; do
            command -v "$t" >/dev/null && echo "  $t: $(command -v $t)" || echo "  $t: MISSING"
          done

      - name: Negative control — the gate's own rule must reject a leaked symbol
        if: steps.guard.outputs.run == 'true'
        run: |
          cd benches/gust/drivers
          python3 check-cross-arch.py --self-test

      - name: Cross-arch seam gate
        if: steps.guard.outputs.run == 'true'
        run: |
          cd benches/gust/drivers
          SYNTH="$HOME/pe-toolchain/bin/synth" \
            NM=arm-none-eabi-nm python3 check-cross-arch.py
