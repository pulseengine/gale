# Cross-architecture seam gate for the thin-seam drivers (gale#307 follow-up).
#
# The property: a driver "crosses" only if its lowered object's UNDEFINED symbol
# set is EXACTLY the set of names its wasm imports. Not "> 0", which a leaked
# symbol satisfies as well as a real seam symbol, and which fails a correct
# driver that imports nothing (hm-thin). Not "== 0" either, which is the
# synth#871 truncation shape. Equality.
#
# On that rule (synth 0.89.0, 15 drivers): ARM holds for 15 of 15; RISC-V for
# 12 of 15. The other 3 sit on a capped, expiring known-defect ledger inside
# check-cross-arch.py (rules R1-R6, CROSS-ARCH.md): it FAILS if a driver's status
# changes in either direction, if an entry expires or lacks a tracker/owner,
# if the ledger size and its cap disagree, or if it covers half the subjects or
# more. Every emitted RV32 object is also scanned from its bytes for A-extension
# instructions (esp32c3 is RV32IMC). A driver that fails to build fails the gate,
# and an object must define every exported function and carry code.
# ARMv6-M is reported as an advisory step (no synth target yet).
#
# An earlier version of this file claimed "on the pinned toolchain every driver
# crosses and the gate exits 0". That was the `> 0` rule reading a dangling
# `synth_func_N` as a seam symbol. The script still refuses to run unpinned.
name: driver cross-arch seam

# NO `paths:` FILTER — deliberately. This gate must be REQUIRABLE (gale#294).
#
# A path-filtered workflow does not run when a PR touches nothing it cares about,
# and GitHub never creates its check. A required context that never reports blocks
# the PR forever, so a filtered gate cannot be added to
# `required_status_checks.contexts` — it would trade an empty gate for a
# deadlocked one.
#
# Whether the gate has work to do is decided by sieve (class `cross_arch` in
# sieve.toml: every thin driver's Cargo graph, its wit_bindgen paths and the
# gate's two scripts) in the `classify` job. The gate job skips only through
# sieve's classifier `if:`, and a skipped job still reports its check. It used
# to be a step-level early exit inside this job, a shape `sieve check-workflows`
# refuses: a step-level skip reports the job green having checked nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (sieve check-workflows fails a PR that drops this). sieve runs
  # everything on merge_group.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Moves with varve.toml: pin-agreement checks it against the wasm-tools the pinned layer ships.
  WASM_TOOLS_VERSION: "1.263.0"
  # KEEP IN SYNC WITH varve.toml. This workflow downloads its own synth/loom
  # rather than resolving them through varve, so the pin exists twice and can
  # drift. It just did: the gate passes --embedder-data-init/--embedder-global-init,
  # which synth 0.58.0 does not have, so leaving this at 0.58.0 while varve.toml
  # moved to a newer layer would fail the gate with "unexpected argument".
  #
  # Drifted AGAIN on the 2026.09.1 bump: varve.toml resolved synth 0.61.0 while this
  # still said 0.60.0. The comment above predicted exactly this and it still happened,
  # which says the warning is not the control — the two pins want a gate, not a note.
  # Drifted a THIRD time on the 2026.10.1 bump (synth 0.65.0 -> 0.78.0). The comment
  # above said "the two pins want a gate, not a note", and it was right: three
  # warnings prevented nothing. There is now a gate —
  # `cargo xtask check pin-agreement` compares every hardcoded *_VERSION against
  # what varve.toml's layer actually ships, and fails on disagreement. This value
  # still moves with the layer; the difference is that forgetting is now loud.
  # Moved WITH the 2026.10.30 bump (synth 0.78.0 -> 0.88.0) — the gate caught
  # nothing because this was updated in the same commit as the pin.
  SYNTH_VERSION: "0.90.0"
  LOOM_VERSION: "1.5.1"

jobs:
  classify:
    # sieve (pinned by .github/actions/setup-sieve): does this change touch the
    # driver seam? Any event but pull_request, and a failed, cancelled or silent
    # classifier, runs the gate.
    name: "classify changes (sieve)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cross_arch: ${{ steps.sieve.outputs.cross_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # sieve diffs against the PR base
      - uses: ./.github/actions/setup-sieve
      - name: Pinned sieve is the one on PATH
        run: |
          set -euo pipefail
          got="$(command -v sieve || true)"
          if [ "$got" != "$SIEVE_PINNED_DIR/sieve" ]; then
            echo "::error::sieve on PATH is '${got:-<none>}', not the pinned $SIEVE_PINNED_DIR/sieve"
            exit 1
          fi
      - id: sieve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sieve classify --config sieve.toml --base "$BASE_SHA" --event "$EVENT_NAME" --format github-output --record "$RUNNER_TEMP/sieve-verdict.json"
      # The verdict of record: the JSON this classify call wrote before its
      # outputs (sieve exits 2 and writes no output if it cannot). On a pull
      # request it is the verdict that skipped jobs; push and merge_group record
      # run_all. docs/ci/sieve.md has the observe follow-up that reads it.
      - name: Upload the verdict of record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sieve-verdict-drv-cross-arch-classify-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sieve-verdict.json
          if-no-files-found: error
          retention-days: 90

  cross-arch:
    # ubuntu-24.04, NOT 22.04. synth's published Linux binaries need GLIBC 2.39;
    # 22.04 ships 2.35, and the binary dies with
    #   libc.so.6: version `GLIBC_2.39' not found
    # which under `set -o pipefail` killed this gate at its own version check,
    # producing NO output at all. gustos-dissolve.yml — the other synth-using
    # workflow — is already on 24.04; this one copied 22.04 from a workflow that
    # does not use synth.
    name: "seam survives lowering on ARM and RISC-V (all thin drivers)"
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.cross_arch != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Install pinned synth + loom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pe-toolchain/bin" && cd "$HOME/pe-toolchain"
          fetch() {
            local repo="$1" ver="$2" bin="$3"
            local tar="${repo}-v${ver}-x86_64-unknown-linux-gnu.tar.gz"
            gh release download "v${ver}" --repo "pulseengine/${repo}" \
              -p "$tar" -p SHA256SUMS.txt --clobber -D "$repo-$ver"
            ( cd "$repo-$ver" && sha256sum -c --ignore-missing SHA256SUMS.txt 2>/dev/null \
              | grep -q "$tar: OK" || { echo "::error::$repo $ver checksum FAILED"; exit 1; } )
            tar xzf "$repo-$ver/$tar" -C "$repo-$ver"
            install -m755 "$(find "$repo-$ver" -name "$bin" -type f | head -1)" "$HOME/pe-toolchain/bin/$bin"
          }
          fetch synth "$SYNTH_VERSION" synth
          fetch loom  "$LOOM_VERSION"  loom
          echo "$HOME/pe-toolchain/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        # check-cross-arch.py derives each driver's EXPECTED undefined set from
        # the wasm's import section, so it needs wasm-tools -- the old shell gate
        # only ran nm and did not. Pinned to the same version drv-components.yml
        # uses, so the two gates read imports through identical tooling.
        run: |
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked --root "${CARGO_HOME:-$HOME/.cargo}/gale-tools/wasm-tools-$WASM_TOOLS_VERSION"
          echo "${CARGO_HOME:-$HOME/.cargo}/gale-tools/wasm-tools-$WASM_TOOLS_VERSION"/bin >> "$GITHUB_PATH"

      - name: Install binutils (nm) + clang (assembles the self-test's planted RV32 objects)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi clang
          clang --version | head -1

      # Negative control FIRST: an unpinned toolchain must be REFUSED, not
      # silently answered. That refusal is the whole reason this gate is
      # trustworthy — the property it checks is toolchain-sensitive.
      - name: Negative control — an unpinned/old synth must be refused
        run: |
          set -euo pipefail
          cd drivers
          if SYNTH=/usr/bin/false bash build-cross-arch.sh >/dev/null 2>&1; then
            echo "::error::the pin guard did not bite — gate would answer from an unknown toolchain"
            exit 1
          fi
          echo "pin guard bites"

      # Print what the gate is about to use BEFORE running it. The first CI
      # attempt failed with no output at all — not even the script's own
      # "gate toolchain:" line — which made it undiagnosable from the log. A
      # gate that dies silently in setup is the same problem as a check that
      # passes silently: there is nothing to read.
      - name: Toolchain diagnostics
        run: |
          echo "HOME=$HOME"
          ls -la "$HOME/pe-toolchain/bin" || echo "  (bin dir missing)"
          for t in synth loom; do
            b="$HOME/pe-toolchain/bin/$t"
            if [ -x "$b" ]; then echo "  $t: $("$b" --version 2>&1 | head -1)"
            else echo "  $t: NOT EXECUTABLE at $b"; fi
          done
          for t in arm-none-eabi-nm arm-none-eabi-size nm; do
            command -v "$t" >/dev/null && echo "  $t: $(command -v $t)" || echo "  $t: MISSING"
          done

      # The self-test runs the gate's REAL functions (imports, func_exports,
      # undefined, defined, assess, a_ext_scan, build_wasm, verdict,
      # ledger_findings) on planted inputs. Those inputs are:
      #   - leaked, truncated, missing, corrupt and empty objects on ARM and RV32
      #   - A-extension instructions in RV32 objects (as a mnemonic, as .word,
      #     and behind a stray .half)
      #   - a crate with a syntax error
      #   - planted rows for every exit code
      #   - ledgers that break every R1-R6 clause and boundary
      # Every control must fire, or the step exits 1. Its date is pinned.
      - name: Negative control — planted bad inputs must fail the gate's own code
        run: |
          cd drivers
          RV_CC=clang python3 check-cross-arch.py --self-test

      - name: Cross-arch seam gate
        run: |
          cd drivers
          SYNTH="$HOME/pe-toolchain/bin/synth" \
            NM=arm-none-eabi-nm python3 check-cross-arch.py

      # ARMv6-M (Cortex-M0/M0+) policy: ADVISORY. synth has no ARMv6-M target, so
      # there is nothing to lower. This step reports that on every run as a
      # ::warning:: annotation and never fails the job (continue-on-error, and it
      # exits 0), so it neither blocks every PR nor disappears. It is a STEP in the
      # required job, not a job of its own, so it adds no context to
      # .github/required-contexts.txt. When synth gains the target, the warning
      # says so and the leg should be promoted to a gated one (CROSS-ARCH.md).
      - name: ARMv6-M leg (advisory — not a required verdict)
        if: always()
        continue-on-error: true
        run: |
          cd drivers
          SYNTH="$HOME/pe-toolchain/bin/synth" python3 check-cross-arch.py --armv6m-advisory
