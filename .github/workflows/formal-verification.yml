# Formal verification CI — Verus (SMT/Z3) + Kani (BMC) + Rocq (theorem proving)
#
# Verus: runs via Bazel. rules_verus downloads the Verus binary automatically.
#   Nix is installed because rules_rocq_rust (in MODULE.bazel) requires
#   nix-build for toolchain resolution, even when only running Verus.
#
# Kani: runs via cargo kani. Two invocations — main crate (87 harnesses)
#   and FFI crate (98 harnesses), 185 total.
#
# Rocq: compiles 149 theorems across 9 proof files.
#   Uses Bazel (rules_rocq_rust) to translate plain/*.rs to Rocq via
#   coq-of-rust, then checks all proofs. Nix provides the Rocq toolchain.

name: Formal Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plain/**'
      - 'ffi/**'
      - 'tests/**'
      - 'proofs/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      # this workflow must test its own changes, or a PR that edits the gate
      # merges without ever running it (gale#288 nearly did exactly that)
      - '.github/workflows/formal-verification.yml'
  pull_request:
    branches: [main]
    # NO `paths:` FILTER — this gate must be REQUIRABLE (gale#294).
    #
    # A filtered workflow does not run when a PR touches nothing it cares about,
    # so GitHub never creates its check, and a required context that never
    # reports blocks the PR forever. This workflow carries verification claims,
    # which makes it one of the ones most worth requiring — so the filter moves
    # off the trigger and into the job as a step-level early exit (pattern from
    # gale#319). The job always runs and always reports; when nothing relevant
    # changed it exits in seconds without building anything.
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # Cheap always-run job that decides whether the proofs need to run at all.
    # The path filter that used to live on the trigger lives here instead, so
    # every verification job below still REPORTS its check (gale#294) while the
    # expensive Nix / Rust / Kani installs are skipped when nothing relevant
    # changed. Same globs as the old filter, plus BUILD/MODULE which were on the
    # push filter but not the pull_request one.
    name: "proofs needed?"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: q
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "not a PR — run"; exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^src/|^plain/|^ffi/|^tests/|^proofs/|^BUILD\.bazel$|^MODULE\.bazel$|^\.github/workflows/formal-verification\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "proof-relevant paths changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no proof-relevant path changed — reporting without building"
          fi

  verus:
    name: Verus SMT (39 modules)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run Verus verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test //:verus_test --test_output=errors
        timeout-minutes: 30

  kani:
    name: Kani BMC (185 harnesses)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        if: needs.guard.outputs.run == 'true'

      - name: Install Kani
        if: needs.guard.outputs.run == 'true'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Kani model harnesses (main crate)
        if: needs.guard.outputs.run == 'true'
        run: cargo kani --tests
        timeout-minutes: 45

      - name: Run Kani FFI harnesses
        if: needs.guard.outputs.run == 'true'
        run: cargo kani --tests --all-features
        working-directory: ffi
        timeout-minutes: 45

  rocq:
    name: Rocq Proofs (14 files)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rocq proof verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test \
            //proofs:sem_proofs_test \
            //proofs:mutex_proofs_test \
            //proofs:condvar_proofs_test \
            //proofs:msgq_proofs_test \
            //proofs:stack_proofs_test \
            //proofs:pipe_proofs_test \
            //proofs:timer_proofs_test \
            //proofs:event_proofs_test \
            //proofs:mem_slab_proofs_test \
            //proofs:heap_proofs_test \
            //proofs:poll_proofs_test \
            //proofs:sched_proofs_test \
            //proofs:thread_lifecycle_proofs_test \
            //proofs:executor_proofs_test \
            --test_output=errors
        timeout-minutes: 45

  lean:
    name: Lean Proofs
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      # These targets existed in proofs/lean/BUILD.bazel but no workflow ever
      # invoked them (gale#286), so "0 sorry" was a grep result rather than a
      # verification result. Measured before adding: 8.7s for all seven with a
      # warm mathlib, ~258s cold — and the cold time is almost entirely the
      # one-time download of 7869 prebuilt mathlib files from the upstream
      # Azure cache, not elaboration (critical path 13.89s).
      - name: Run Lean proof verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test //proofs/lean:all --test_output=errors
        timeout-minutes: 45
