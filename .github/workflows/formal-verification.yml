# Formal verification CI — Verus (SMT/Z3) + Kani (BMC) + Rocq (theorem proving)
#
# Verus: runs via Bazel. rules_verus downloads the Verus binary automatically.
#   Nix is installed because rules_rocq_rust (in MODULE.bazel) requires
#   nix-build for toolchain resolution, even when only running Verus.
#
# Kani: runs via cargo kani. Two invocations -- main crate (112 harnesses
#   compiled: 87 in tests/ + 25 in plain/src; the 25 Verus originals in src/
#   are never built) and FFI crate (258), 370 total. The job name still says
#   185: it is a required context (.github/required-contexts.txt), so renaming
#   it is the owner's call.
#   kani-drivers runs `cargo kani` in each of the 14 driver crates (101
#   harnesses; none was run by CI before). Figures measured 2026-11-20 by
#   `cargo xtask check kani-coverage`, which prints them and gates that every
#   harness crate is run by some invocation that can fail; the figures in this
#   comment are not gated.
#
# Rocq: 13 proof files (the job name says 14; it is a required context).
#   74 Admitted in 3 of them, as `cargo xtask check trust-ledger` prints
#   (rocq:Admitted); 164 `Qed.`/`Defined.` terminators in 10 of them, a grep
#   count (`grep -oE '\b(Qed|Defined)\.' proofs/*.v`, 2026-11-22) that no
#   gate prints. Neither figure is gated here.
#   Uses Bazel (rules_rocq_rust) to translate plain/*.rs to Rocq via
#   coq-of-rust, then checks all proofs. Nix provides the Rocq toolchain.

name: Formal Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plain/**'
      - 'ffi/**'
      - 'tests/**'
      - 'proofs/**'
      # kani-drivers (below) runs on push too: a drivers-only push to main must
      # trigger it, or 'runs on push' (kani-coverage's path-guard note) is false.
      - 'drivers/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      # this workflow must test its own changes, or a PR that edits the gate
      # merges without ever running it (gale#288 nearly did exactly that)
      - '.github/workflows/formal-verification.yml'
  pull_request:
    branches: [main]
    # NO `paths:` FILTER — this gate must be REQUIRABLE (gale#294).
    #
    # A filtered workflow does not run when a PR touches nothing it cares about,
    # so GitHub never creates its check, and a required context that never
    # reports blocks the PR forever. This workflow carries verification claims,
    # which makes it one of the ones most worth requiring — so the filter moves
    # off the trigger and into the job as a step-level early exit (pattern from
    # gale#319). The job always runs and always reports; when nothing relevant
    # changed it exits in seconds without building anything.
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (tools/check-required-contexts.py fails a PR that drops this).
  # `proofs needed?` diffs against merge_group.base_sha in the queue;
  # the proof jobs report either way (step-level skip).
  merge_group:
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # Cheap always-run job that decides whether the proofs need to run at all.
    # The path filter that used to live on the trigger lives here instead, so
    # every verification job below still REPORTS its check (gale#294) while the
    # expensive Nix / Rust / Kani installs are skipped when nothing relevant
    # changed. Same globs as the old filter, plus BUILD/MODULE which were on the
    # push filter but not the pull_request one.
    name: "proofs needed?"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      run: ${{ steps.q.outputs.run }}
      drivers: ${{ steps.q.outputs.drivers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: q
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "drivers=true" >> "$GITHUB_OUTPUT"; echo "not a PR — run"; exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"...HEAD)"
          # The driver crates' Kani harnesses (kani-drivers below) have their own
          # filter: a driver change does not rebuild the kernel proofs, and a
          # kernel change does not re-run the 14 driver crates.
          if printf '%s\n' "$changed" | grep -qE '^drivers/|^\.github/workflows/formal-verification\.yml$'; then
            echo "drivers=true" >> "$GITHUB_OUTPUT"; echo "driver paths changed"
          else
            echo "drivers=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^src/|^plain/|^ffi/|^tests/|^proofs/|^BUILD\.bazel$|^MODULE\.bazel$|^\.github/workflows/formal-verification\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "proof-relevant paths changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no proof-relevant path changed — reporting without building"
          fi

  verus:
    name: Verus SMT (39 modules)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0

      - name: Run Verus verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test //:verus_test --test_output=errors
        timeout-minutes: 30

  kani:
    name: Kani BMC (185 harnesses)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # installs 1.100.0 (nightly-branch SHA; cargo-kani installs its own toolchain)
        if: needs.guard.outputs.run == 'true'
        with:
          toolchain: 1.100.0

      - name: Install Kani
        if: needs.guard.outputs.run == 'true'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Run Kani model harnesses (main crate)
        if: needs.guard.outputs.run == 'true'
        run: cargo kani --tests
        timeout-minutes: 45

      - name: Run Kani FFI harnesses
        if: needs.guard.outputs.run == 'true'
        run: cargo kani --tests --all-features
        working-directory: ffi
        timeout-minutes: 45

  # Found 2026-11-19: the job above and nightly's kani-extended ran `cargo kani`
  # at the root and in ffi/ only, so the harnesses in drivers/* were checked by
  # nothing. One step per crate, not a loop or a matrix: each crate reports on
  # its own line, and a step cannot swallow another's failure.
  # `cargo xtask check kani-coverage` (kill-criteria.yml) fails if a crate with
  # a #[kani::proof] harness is not run by an invocation like these. NOT a
  # required context (that is the owner's call).
  kani-drivers:
    name: Kani BMC (driver crates)
    needs: guard
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # installs 1.100.0 (nightly-branch SHA; cargo-kani installs its own toolchain)
        if: needs.guard.outputs.drivers == 'true'
        with:
          toolchain: 1.100.0

      - name: Install Kani
        if: needs.guard.outputs.drivers == 'true'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Kani drivers/adc-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/adc-thin
        timeout-minutes: 30

      - name: Kani drivers/can-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/can-thin
        timeout-minutes: 30

      - name: Kani drivers/dac-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/dac-thin
        timeout-minutes: 30

      - name: Kani drivers/dma-own
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/dma-own
        timeout-minutes: 30

      - name: Kani drivers/gpio-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/gpio-thin
        timeout-minutes: 30

      - name: Kani drivers/i2c-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/i2c-thin
        timeout-minutes: 30

      - name: Kani drivers/i2c-v2-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/i2c-v2-thin
        timeout-minutes: 30

      - name: Kani drivers/os-time-math
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/os-time-math
        timeout-minutes: 30

      - name: Kani drivers/pwm-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/pwm-thin
        timeout-minutes: 30

      - name: Kani drivers/sen66-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/sen66-thin
        timeout-minutes: 30

      - name: Kani drivers/spi-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/spi-thin
        timeout-minutes: 30

      - name: Kani drivers/timer-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/timer-thin
        timeout-minutes: 30

      - name: Kani drivers/uart-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/uart-thin
        timeout-minutes: 30

      - name: Kani drivers/wdg-thin
        if: needs.guard.outputs.drivers == 'true'
        run: cargo kani
        working-directory: drivers/wdg-thin
        timeout-minutes: 30

  rocq:
    name: Rocq Proofs (14 files)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0

      - name: Run Rocq proof verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test \
            //proofs:sem_proofs_test \
            //proofs:mutex_proofs_test \
            //proofs:condvar_proofs_test \
            //proofs:msgq_proofs_test \
            //proofs:stack_proofs_test \
            //proofs:pipe_proofs_test \
            //proofs:timer_proofs_test \
            //proofs:event_proofs_test \
            //proofs:mem_slab_proofs_test \
            //proofs:poll_proofs_test \
            //proofs:sched_proofs_test \
            //proofs:thread_lifecycle_proofs_test \
            //proofs:executor_proofs_test \
            --test_output=errors
        timeout-minutes: 45

  lean:
    name: Lean Proofs
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        if: needs.guard.outputs.run == 'true'

      - name: Install Rust toolchain
        if: needs.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0

      # These targets existed in proofs/lean/BUILD.bazel but no workflow ever
      # invoked them (gale#286), so "0 sorry" was a grep result rather than a
      # verification result. Measured before adding: 8.7s for all seven with a
      # warm mathlib, ~258s cold — and the cold time is almost entirely the
      # one-time download of 7869 prebuilt mathlib files from the upstream
      # Azure cache, not elaboration (critical path 13.89s).
      - name: Run Lean proof verification
        if: needs.guard.outputs.run == 'true'
        run: |
          bazel test //proofs/lean:all --test_output=errors
        timeout-minutes: 45
