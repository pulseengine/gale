# Formal verification CI — Verus (SMT/Z3) + Kani (BMC) + Rocq (theorem proving)
#
# Verus: runs via Bazel. rules_verus downloads the Verus binary automatically.
#   Nix is installed because rules_rocq_rust (in MODULE.bazel) requires
#   nix-build for toolchain resolution, even when only running Verus.
#
# Kani: runs via cargo kani. Two invocations — main crate (87 harnesses)
#   and FFI crate (98 harnesses), 185 total.
#
# Rocq: compiles 149 theorems across 9 proof files.
#   Uses Bazel (rules_rocq_rust) to translate plain/*.rs to Rocq via
#   coq-of-rust, then checks all proofs. Nix provides the Rocq toolchain.

name: Formal Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plain/**'
      - 'ffi/**'
      - 'tests/**'
      - 'proofs/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      # this workflow must test its own changes, or a PR that edits the gate
      # merges without ever running it (gale#288 nearly did exactly that)
      - '.github/workflows/formal-verification.yml'
  pull_request:
    branches: [main]
    # NO `paths:` FILTER — this gate must be REQUIRABLE (gale#294).
    #
    # A filtered workflow does not run when a PR touches nothing it cares about,
    # so GitHub never creates its check, and a required context that never
    # reports blocks the PR forever. This workflow carries verification claims,
    # which makes it one of the ones most worth requiring — so the filter moves
    # off the trigger and into the `proofs needed?` classifier job; the proof
    # jobs skip by a job-level `if:` on its output, which still reports their
    # checks (skipped counts as success) without occupying a runner.
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (tools/check-required-contexts.py fails a PR that drops this).
  # In the queue the classifier selects everything (merge_group is not a
  # pull_request event), so every proof runs before main moves.
  merge_group:
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    # Cheap always-run job that decides whether the proofs need to run at all:
    # the change classifier (tools/ci/classify-changes.py; FAILS OPEN). It reads
    # the proof jobs' inputs from the build graph -- the Bazel snapshot of
    # deps(//:verus_test, //proofs:*, //proofs/lean:all) plus the cargo graph
    # Kani builds (root + ffi). The four proof jobs skip by a job-level `if:`,
    # which still REPORTS their required contexts (skipped counts as success)
    # without taking a hosted runner (gale#294). This job is itself required
    # and has no `if:`, so it always reports. Push, merge_group, schedule, an
    # empty or failed diff, or a path no job claims: proofs=true.
    name: "proofs needed?"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","light"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    outputs:
      proofs: ${{ steps.classify.outputs.proofs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # tomllib needs python >= 3.11. If this step fails, this required job is
      # red (loud), and every proof job runs (`needs.guard.result != 'success'`).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/classify-changes.py

  verus:
    name: Verus SMT (39 modules)
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result != 'success' || needs.guard.outputs.proofs != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Verus verification
        run: |
          bazel test //:verus_test --test_output=errors
        timeout-minutes: 30

  kani:
    name: Kani BMC (185 harnesses)
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result != 'success' || needs.guard.outputs.proofs != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Kani model harnesses (main crate)
        run: cargo kani --tests
        timeout-minutes: 45

      - name: Run Kani FFI harnesses
        run: cargo kani --tests --all-features
        working-directory: ffi
        timeout-minutes: 45

  rocq:
    name: Rocq Proofs (14 files)
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result != 'success' || needs.guard.outputs.proofs != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rocq proof verification
        run: |
          bazel test \
            //proofs:sem_proofs_test \
            //proofs:mutex_proofs_test \
            //proofs:condvar_proofs_test \
            //proofs:msgq_proofs_test \
            //proofs:stack_proofs_test \
            //proofs:pipe_proofs_test \
            //proofs:timer_proofs_test \
            //proofs:event_proofs_test \
            //proofs:mem_slab_proofs_test \
            //proofs:poll_proofs_test \
            //proofs:sched_proofs_test \
            //proofs:thread_lifecycle_proofs_test \
            //proofs:executor_proofs_test \
            --test_output=errors
        timeout-minutes: 45

  lean:
    name: Lean Proofs
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result != 'success' || needs.guard.outputs.proofs != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # These targets existed in proofs/lean/BUILD.bazel but no workflow ever
      # invoked them (gale#286), so "0 sorry" was a grep result rather than a
      # verification result. Measured before adding: 8.7s for all seven with a
      # warm mathlib, ~258s cold — and the cold time is almost entirely the
      # one-time download of 7869 prebuilt mathlib files from the upstream
      # Azure cache, not elaboration (critical path 13.89s).
      - name: Run Lean proof verification
        run: |
          bazel test //proofs/lean:all --test_output=errors
        timeout-minutes: 45
