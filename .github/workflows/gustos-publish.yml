# Build, verify, sign + publish gale's gust:os provider components
# (DD-OS-DELIVERY-001, gale#223/#224).
#
# gust's OS-as-wasm-component-model made distributable: each gust:os provider is a
# wasm COMPONENT that exports a gust:os capability interface and imports only
# gust:hal. The `verify` job gates that invariant on every PR (export gust:os,
# import only gust:hal — no leaking scheduler/env/heap). On a release tag the
# `publish` job additionally cosign-signs (keyless OIDC) and pushes to ghcr, so ANY
# downstream that imports gust:os pulls the same signed component and fuses it for its
# target. Discoverability via wasm.directory is a separate, ONE-TIME step per package:
# that site is a meta-registry whose entries are TOML pointers at an OCI registry, not
# a push target, so a package is listed by filing its registry-entry issue once — not
# on every release.
#
# First demonstrator: the time provider (exports gust:os/time, residual = gust:hal).
# The full fused gale-nano runtime component is gale#224.
name: gustos publish

on:
  push:
    branches: [main]
    paths:
      - "benches/gust/drivers/*-provider/**"
      - "benches/gust/drivers/wit-os/**"
      - "benches/gust/drivers/build-gustos-components.sh"
      - "benches/gust/drivers/build-fused-gustos.sh"
      - "benches/gust/drivers/run-gustos-hostrun.sh"
      - "benches/gust/drivers/gustos-hostrun/**"
      - ".github/workflows/gustos-publish.yml"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "benches/gust/drivers/*-provider/**"
      - "benches/gust/drivers/wit-os/**"
      - "benches/gust/drivers/build-gustos-components.sh"
      - "benches/gust/drivers/build-fused-gustos.sh"
      - "benches/gust/drivers/run-gustos-hostrun.sh"
      - "benches/gust/drivers/gustos-hostrun/**"
      - ".github/workflows/gustos-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "component version tag (e.g. 0.5.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: "gust:os component invariant (export gust:os, import only gust:hal)"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-tools + wac
        run: |
          cargo install wasm-tools --version 1.245.1 --locked
          cargo install wac-cli --version 0.10.1 --locked
      - name: Build + verify the gust:os provider components
        run: bash benches/gust/drivers/build-gustos-components.sh
      - name: Syntax-check the driver shell gates
        # A gate with a syntax error is not a gate. A bash syntax error reached main in
        # build-fused-gustos.sh because this workflow's path filter did not cover that
        # file; the filter is fixed above and this check makes the class cheap to catch.
        run: |
          rc=0
          for f in benches/gust/drivers/*.sh benches/gust/silicon/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; rc=1; }
          done
          exit $rc
      - name: Compose + verify the fused gust:os component (gale#224)
        run: bash benches/gust/drivers/build-fused-gustos.sh
      - name: EXECUTE the composite + negative controls (REQ-OS-COMPOSITE-EXEC-001)
        # E1 of the v0.7.0 ladder. Runs the fused component on a host engine and
        # observes a handle crossing spawn -> timer -> exec, then re-runs the harness
        # against a deliberately two-scheduler composite which it MUST refute. Exit 4
        # means a negative control passed, i.e. the harness stopped being a gate.
        run: |
          set +e
          bash benches/gust/drivers/run-gustos-hostrun.sh | tee /tmp/e1.log
          rc=${PIPESTATUS[0]}
          set -e
          # Exit codes are meaningful (see the script header): 0 = claims held;
          # 1 = REFUTED; 2 = could not instantiate; 3 = claims held but a WIT
          # return-contract deviation was observed; 4 = a negative control did not
          # fail, i.e. the harness stopped being a gate.
          case "$rc" in
            0) echo "E1: claims held, no deviations" ;;
            3) # 3 deviations are KNOWN and tracked (timer.sleep returns success for an
               # out-of-range or already-done handle, so the arm is silently lost).
               # Pin the count so a FOURTH one fails this gate instead of hiding here.
               n=$(sed -n 's/.*HELD under execution; \([0-9]*\) WIT return-contract deviation.*/\1/p' /tmp/e1.log | head -1)
               if [ "$n" = "3" ]; then
                 echo "E1: claims held; $n known WIT deviations (tracked, count pinned)"
               else
                 echo "::error::E1 deviation count changed: expected 3, got '$n' — a new contract deviation appeared"
                 exit 1
               fi ;;
            *) echo "::error::E1 harness exit $rc — see log above"; exit 1 ;;
          esac

  publish:
    name: "sign + publish gust:os components (OCI + wasm.directory)"
    # Only on a release tag or an explicit dispatch — never on PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write     # ghcr OCI push
      id-token: write     # cosign keyless OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-tools + wkg
        run: |
          cargo install wasm-tools --version 1.245.1 --locked
          cargo install wac-cli --version 0.10.1 --locked
          cargo install wkg --locked
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'
      - name: Build + verify components
        run: |
          bash benches/gust/drivers/build-gustos-components.sh
          bash benches/gust/drivers/build-fused-gustos.sh
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${REF#refs/tags/v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Publish signed to ghcr OCI + wasm.directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          # wkg authenticates per-push from these; there is no `wkg oci login`.
          WKG_OCI_USERNAME: ${{ github.repository_owner }}
          WKG_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pushed=""
          # wkg takes WKG_OCI_* from the env; cosign does NOT — it reads the docker
          # config. Removing the old (invalid) `wkg oci login` removed the only thing
          # giving cosign credentials, so signing failed UNAUTHORIZED after the push had
          # already succeeded, leaving an unsigned artifact in the registry.
          cosign login ghcr.io -u "$OWNER" -p "$GH_TOKEN"
          for comp in benches/gust/drivers/gustos-components/*.component.wasm; do
            base="$(basename "$comp" .component.wasm)"     # time-provider
            if [ "$base" = "fused-gustos" ]; then
              # The deliverable of DD-OS-DELIVERY-001: the whole gust:os world in one
              # component. It is not a provider, so it does not take the -provider strip.
              pkg="gale-nano"
            else
              pkg="gale-nano-${base%-provider}"             # gale-nano-time
            fi
            ref="ghcr.io/${OWNER}/${pkg}:${VERSION}"
            echo "== $pkg → $ref =="
            wkg oci push "$ref" "$comp"
            pushed="$pushed $ref"
            if ! cosign sign --yes "$ref"; then
              echo "::error::signing FAILED for $ref — it is PUBLISHED BUT UNSIGNED."
              echo "::error::pushed so far this run:$pushed"
              echo "::error::an unsigned artifact in the registry is worse than none;"
              echo "::error::re-run once signing works — the same digest gets signed in place."
              exit 1
            fi
            echo "::notice::published + signed $ref"
          done
          # wasm.directory is a META-registry: its entries are TOML pointers at an OCI
          # registry (see registry/pulseengine.toml -> ghcr.io/pulseengine), NOT a push
          # target. Listing a package there is a ONE-TIME registry-entry issue against
          # yoshuawuyts/wasm.directory, which opens a PR adding the entry — not a
          # per-release step. The earlier `wkg publish --registry wasm.directory` here
          # could only ever fail into a warning while the job stayed green, which would
          # have let the release notes claim a publication that never happened.

