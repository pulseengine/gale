# temper's behavioural gate probe (temper docs/gate-probe.md, temper#86/#87).
# Runs gale's change detector -- sieve, through tools/ci/sieve-gate-probe.sh --
# on the control paths declared in .github/gate-probe.json: every declared
# output must be true for the controls and false for the negative controls, or
# the job fails. Report-only today; making it required is a later, per-repo
# step with the owner's approval.
#
# Held to the rule it checks: no path or branch filter, no `if:`, no
# continue-on-error, no pull_request_target, the action pinned to a full temper
# sha. Control paths live only in .github/gate-probe.json, never here.
name: gate-probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate-probe:
    # The probe runs the PR head's own detector, so a fork PR would execute
    # untrusted code. Fork PRs go to a GitHub-hosted runner, the same routing
    # gale's other self-hosted jobs use; the job still runs (not skipped).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sieve
      - name: Pinned sieve is the one on PATH
        run: |
          set -euo pipefail
          got="$(command -v sieve || true)"
          if [ "$got" != "$SIEVE_PINNED_DIR/sieve" ]; then
            echo "::error::sieve on PATH is '${got:-<none>}', not the pinned $SIEVE_PINNED_DIR/sieve"
            exit 1
          fi
      - uses: pulseengine/temper/.github/actions/gate-probe@03a53ca7dc3ac604252abcb70b267cd9f8ef623e
