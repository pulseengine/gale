# Supply-chain gate: cargo-deny over advisories, bans, licenses and sources.
# Org standard (2026-11): every Rust repo runs this and it fails the PR.
# deny.toml at the repo root carries the agreed license allowlist and any
# reasoned advisory ignores. Scope: the root workspace's Cargo.lock.
name: Supply Chain (cargo-deny)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # A failed install fails the job here, rather than surfacing later as
      # "command not found" (the `cargo install ... || true` it replaces).
      - name: Install cargo-deny
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources
