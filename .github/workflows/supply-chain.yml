# Supply-chain gate: cargo-deny over advisories, bans, licenses and sources.
# Org standard (2026-11): every Rust repo runs this and it fails the PR.
# deny.toml at the repo root carries the agreed license allowlist and any
# reasoned advisory ignores. Scope: the root workspace's Cargo.lock.
name: Supply Chain (cargo-deny)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # A failed install fails the job here, rather than surfacing later as
      # "command not found" (the `cargo install ... || true` it replaces).
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources
