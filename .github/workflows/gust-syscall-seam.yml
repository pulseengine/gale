# gust:os syscall-seam drift gate (gale#214).
#
# The gust:os providers implement WIT Guest traits generated from
# benches/gust/drivers/wit-os/gust-os.wit. A WIT method added without its Guest
# impl fails to compile (E0046) — but no workflow built these crates, so #202
# added time.resolution() to the WIT without the time-provider impl and shipped
# GREEN, silently breaking the gust_os_tl/ts dissolve until #213 caught it by
# hand. This gate builds every provider/app crate for wasm32 so that drift fails
# RED. Cargo-only; the compile is the oracle (wit-bindgen generates the trait).
name: gust syscall seam

on:
  push:
    branches: [main]
    paths:
      - "benches/gust/drivers/wit-os/**"
      - "benches/gust/drivers/app-*/**"
      - "benches/gust/drivers/*-provider/**"
      - "benches/gust/drivers/check-providers.sh"
      - "tools/xtask/**"
      - ".github/workflows/gust-syscall-seam.yml"
  pull_request:
    branches: [main]
    paths:
      - "benches/gust/drivers/wit-os/**"
      - "benches/gust/drivers/app-*/**"
      - "benches/gust/drivers/*-provider/**"
      - "benches/gust/drivers/check-providers.sh"
      - "tools/xtask/**"
      - ".github/workflows/gust-syscall-seam.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syscall-seam-drift:
    name: "gust:os provider drift gate (WIT ↔ Guest impl)"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build every gust:os provider/app crate for wasm32 (WIT drift gate)
        id: sh_gate
        continue-on-error: true
        run: bash benches/gust/drivers/check-providers.sh

      # SHADOW PERIOD (gale#368). Both run; verdicts must agree before the shell
      # one is retired. See gust-targets.yml for the rationale.
      - name: Negative control — the ported gate's discovery must bite
        run: cargo xtask check providers --self-test

      - name: gust:os providers still compile against the WIT (xtask)
        id: rs_gate
        continue-on-error: true
        run: cargo xtask check providers

      - name: The two gates must agree
        run: |
          set -euo pipefail
          s='${{ steps.sh_gate.outcome }}'
          r='${{ steps.rs_gate.outcome }}'
          echo "shell=$s  xtask=$r"
          if [ "$s" != "$r" ]; then
            echo "::error::shell and xtask gates disagree (shell=$s xtask=$r) — do not retire the shell gate"
            exit 1
          fi
          [ "$s" = "success" ] || { echo "::error::both gates report failure"; exit 1; }
          echo "gates agree: $s"
