# gust on Renode — the dissolved-artifact cycle-class gate (hermetic, Bazel).
#
# Runs the self-contained os/gust/renode-test module (own MODULE.bazel +
# git_override on pulseengine/renode-bazel-rules) across three Cortex-M3 device
# classes. rules_renode downloads its own hermetic Renode portable (linux) and
# .NET — no system deps. This is the CI runner that makes the gust Renode
# targets' "first green is in CI" real (no workflow ran them before).
#
# Complements renode-tests.yml (Zephyr+Gale sem robots on M4F/M33/R5) and
# zephyr-tests.yml (qemu M3 functional) with the DISSOLVED-artifact, real-M3-
# model, deterministic-instruction-count dimension.

name: gust Renode (dissolved)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (tools/check-required-contexts.py fails a PR that drops this).
  # Skips on docs-only changes via `changes`.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # sieve (sieve.toml, pinned by .github/actions/setup-sieve) decides which
    # heavy jobs this change needs. The jobs below read its `code` output (false
    # only on a docs-only change) through the classifier `if:` form, so a skipped
    # job still REPORTS its required context; a workflow `paths:` would not
    # (gale#294). Any event but pull_request (push, merge_group, schedule) and a
    # failed, cancelled or silent classifier run them all.
    name: "classify changes (sieve)"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      code: ${{ steps.sieve.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sieve
      - name: Pinned sieve is the one on PATH
        run: |
          set -euo pipefail
          got="$(command -v sieve || true)"
          if [ "$got" != "$SIEVE_PINNED_DIR/sieve" ]; then
            echo "::error::sieve on PATH is '${got:-<none>}', not the pinned $SIEVE_PINNED_DIR/sieve"
            exit 1
          fi
      - id: sieve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sieve classify --config sieve.toml --base "$BASE_SHA" --event "$EVENT_NAME" --format github-output --record "$RUNNER_TEMP/sieve-verdict.json"
      # The verdict of record: the JSON this classify call wrote before its
      # outputs (sieve exits 2 and writes no output if it cannot). On a pull
      # request it is the verdict that skipped jobs; push and merge_group record
      # run_all. docs/ci/sieve.md has the observe follow-up that reads it.
      - name: Upload the verdict of record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sieve-verdict-gust-renode-changes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sieve-verdict.json
          if-no-files-found: error
          retention-days: 90

  gust-renode:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    name: "gust dissolved on Renode (M3: kernel 8K / control 64K / F100)"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: os/gust/renode-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cache the Bazel repo cache (the hermetic Renode portable + .NET, ~hundreds
      # of MB, and the rules_renode/rules_python fetches) keyed on the module deps.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: gust-renode-bazel-${{ hashFiles('os/gust/renode-test/MODULE.bazel') }}
          restore-keys: gust-renode-bazel-

      # The images are built from the current source, not committed: on
      # 2026-11-11 only 1 of 17 committed ELFs matched what main builds, so the
      # gates were running binaries the source no longer produced.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0
          targets: thumbv7m-none-eabi

      # From the repo root: under os/gust/, .cargo/config.toml sets the build target
      # to thumbv7m and would build xtask itself for the microcontroller.
      - name: Build the Renode images from source
        working-directory: .
        run: cargo xtask renode-elfs

      # ubuntu-22.04 ships bazelisk as `bazel`; it reads the root .bazelversion (9.1.0).
      - name: Run the M3 device-class + driver Renode tests
        run: |
          bazel test \
            //:gust-renode \
            //:gust-control-renode \
            //:gust-f100-renode \
            //:gust-uart-renode \
            //:gust-gpio-renode \
            //:gust-timer-renode \
            //:gust-spi-renode \
            //:gust-wdg-renode \
            //:gust-adc-renode \
            //:gust-dac-renode \
            //:gust-pwm-renode \
            //:gust-i2c-renode \
            //:gust-iso-renode \
            //:gust-can-renode \
            //:gust-dma-renode \
            //:gust-breadth-renode \
            //:gust-switch-2core-renode \
            --test_output=all

      - name: Upload Renode test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gust-renode-testlogs
          path: os/gust/renode-test/bazel-testlogs/
          retention-days: 7
