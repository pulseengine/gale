# Deploy the "gust in the browser" demo to GitHub Pages on merge to main.
#
# Builds the SAME kiln-async kernel as benches/gust to wasm32 and publishes
# benches/gust/browser/web/ (index.html + the freshly-built gust.wasm). The
# browser crate depends on pulseengine/kiln via a public git dep, so this builds
# hermetically in CI. Served at https://<org>.github.io/gale/.
#
# Pages source must be "GitHub Actions" — actions/configure-pages enables it on
# first run (needs the pages: write permission below).
name: Deploy gust browser demo (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'benches/gust/browser/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight Pages publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build gust browser wasm
        run: |
          set -euo pipefail
          cd benches/gust/browser
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/gust_browser.wasm web/gust.wasm
          echo "built web/gust.wasm ($(wc -c < web/gust.wasm) bytes)"
          # Ship the demonstrator: the meld-fused composition core (run-demo()=53).
          # Checked in at wasm-kernel/fused.wasm because regenerating it needs the
          # dissolve toolchain forks (see build-fused.sh); the SAME module dissolves
          # to wasm-kernel/fused.o and boots on Cortex-M3.
          cp ../wasm-kernel/fused.wasm web/fused.wasm
          echo "shipped web/fused.wasm ($(wc -c < web/fused.wasm) bytes)"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: benches/gust/browser/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
