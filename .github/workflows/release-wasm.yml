# Manual wasm-module build (workflow_dispatch only).
#
# Release-time wasm building + attaching + signing is now owned by release.yml
# (the standardised creator: builds the same modules via build-wasm-dist.sh,
# then ships them under a cosign-signed SHA256SUMS + SLSA provenance + SBOM).
# This workflow is kept for on-demand rebuilds outside a release — it uploads
# the dist as a run artifact, it does NOT touch any GitHub Release. The
# release: published trigger was removed so it no longer double-builds /
# double-attaches alongside release.yml.
name: Release wasm modules (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm-dist:
    name: "wasm dist (sem + mutex + msgq, cortex-m4f)"
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.0
      options: --user root --volume /mnt:/mnt
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust + wasm32 target
        run: |
          # RETRY, POSIX-sh SAFE (gale#289).
          #
          # Two defects here. (1) Unretried: one transient fetch killed the job.
          # (2) `curl … | sh` reports SH's status, so a failed download feeds sh
          # empty stdin, sh exits 0, and the step PASSES with rustup never
          # installed — surfacing later as an unrelated-looking build error.
          #
          # The pipe is REMOVED rather than wrapped in `set -o pipefail`. These
          # jobs run in containers, and GitHub picks `sh -e {0}` when the image
          # has no bash — dash rejects pipefail outright:
          #     set: Illegal option -o pipefail
          # Downloading to a file and running it needs no pipefail, works under
          # both sh and bash, and removes the truncation ambiguity entirely:
          # curl -f fails on HTTP errors, and the installer runs as a plain
          # command whose status `set -e` already honours.
          _ok=0
          for _a in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              _ok=1; break
            fi
            echo "::warning::rustup download attempt ${_a}/3 failed; retrying" >&2
            sleep $((_a * 15))
          done
          [ "$_ok" = 1 ] || { echo "::error::rustup download failed after 3 attempts" >&2; exit 1; }
          sh /tmp/rustup-init.sh -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add wasm32-unknown-unknown

      - name: Install pinned loom + synth
        run: |
          . /root/.cargo/env
          # Pinned versions — bump deliberately; the manifest records them.
          # Keep in lockstep with release.yml (synth v0.11.50: #359/#372 +
          # #382/#378/#381 additive hardening; all three modules build clean).
          cargo install loom-cli --git https://github.com/pulseengine/loom --tag v1.2.0 --locked
          cargo install synth-cli --git https://github.com/pulseengine/synth --tag v0.52.0 --locked

      - name: Install arm toolchain (objcopy for the import renames)
        run: |
          pip3 install west
          west sdk install -t arm-zephyr-eabi || true
          echo "$HOME/zephyr-sdk/arm-zephyr-eabi/bin" >> "$GITHUB_PATH" || true

      - name: Build distribution
        run: |
          . /root/.cargo/env
          export TC=arm-zephyr-eabi
          scripts/build-wasm-dist.sh dist "${GITHUB_REF_NAME}"

      # TODO(sigil): sign gale-wasm-manifest-<ver>.json once the sigil
      # release/signing flow is wired; until then the sha256 manifest is
      # attached unsigned and the release notes must say so.

      - name: Upload artifact (dispatch runs)
        uses: actions/upload-artifact@v7
        with:
          name: gale-wasm-dist
          path: dist/
