# gust target-model gate — the AADL board/SoC/device model + its generated
# artifacts must stay in sync. The generated tree (benches/gust/targets/generated/)
# is committed; this gate re-runs the generator from the committed spar-items
# fixture and fails if the committed tree drifts, plus runs the generator's unit
# tests (golden emit + the keystone parity against the hand-written firmware
# constants). Cargo-only, no spar needed in CI — `spar` refreshes the fixture
# locally (see benches/gust/targets/regen.sh); the fixture is the committed
# spar-output contract.

name: gust target model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gust-targets:
    name: "gust target model (generator + drift gate)"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Generator unit tests (golden emit + keystone parity)
        run: cargo test --manifest-path tools/gust-target-gen/Cargo.toml

      - name: Regenerate generated/ from the committed fixture
        run: bash benches/gust/targets/regen.sh

      - name: Drift gate — committed generated/ must match the generator output
        run: |
          if ! git diff --exit-code -- benches/gust/targets/generated/; then
            echo "::error::benches/gust/targets/generated/ is stale — run benches/gust/targets/regen.sh and commit the result."
            exit 1
          fi

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.245.1 --locked

      # SHADOW PERIOD (gale#368). The gates are moving to one compiled language.
      # A port is not retired on review: the failure mode of this migration is
      # replacing a gate with one that is green because it cannot distinguish --
      # the exact defect class the sweep exists to remove. So both run, and their
      # verdicts must agree, for at least one merge cycle before the shell goes.
      - name: Negative control — the ported gate must reject a planted bad world
        run: cargo xtask check wit-resolve --self-test

      - name: WIT worlds resolve against the gust:hal seam (shell, retiring)
        id: shell_gate
        continue-on-error: true
        run: bash benches/gust/targets/check-wit-resolve.sh

      - name: WIT worlds resolve against the gust:hal seam (xtask)
        id: rust_gate
        continue-on-error: true
        run: cargo xtask check wit-resolve

      - name: The two gates must agree
        run: |
          set -euo pipefail
          s='${{ steps.shell_gate.outcome }}'
          r='${{ steps.rust_gate.outcome }}'
          echo "shell=$s  xtask=$r"
          if [ "$s" != "$r" ]; then
            echo "::error::shell and xtask gates disagree (shell=$s xtask=$r) — do not retire the shell gate"
            exit 1
          fi
          # Agreement alone is not enough: agreeing on "success" is the only
          # outcome that lets the job pass. Two gates that agree the property is
          # BROKEN must still fail the job.
          [ "$s" = "success" ] || { echo "::error::both gates report failure"; exit 1; }
          echo "gates agree: $s"
