# gust target-model gate — the AADL board/SoC/device model + its generated
# artifacts must stay in sync. The generated tree (targets/generated/) is
# committed; this gate lays down the PINNED spar (varve), regenerates the
# spar-items JSON from targets/*.aadl and the generated tree from that JSON
# (targets/regen.sh), and fails if either committed copy drifts. It also
# cross-checks every modelled peripheral base against the pinned reference
# tables (cargo xtask check target-reference) and runs the generator's unit
# tests (golden emit + the keystone parity against the hand-written firmware
# constants).
#
# It used to be cargo-only and regenerated from the COMMITTED spar-items JSON
# without spar, so a model edit that never reached that JSON (the G031 IWDG
# base moved 0x40003000 -> 0x40004000) passed regen, drift and all 21 tests.

name: gust target model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: this workflow emits required contexts, so it must
  # run on merge_group or a queued PR waits on checks nothing reports
  # (tools/check-required-contexts.py fails a PR that drops this).
  # Runs in the queue as on a PR.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Moves with varve.toml: pin-agreement checks it against the wasm-tools the pinned layer ships.
  WASM_TOOLS_VERSION: "1.263.0"

jobs:
  gust-targets:
    name: "gust target model (generator + drift gate)"
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # installs 1.100.0 (stable-branch SHA)
        with:
          toolchain: 1.100.0

      # Same install as kill-criteria.yml's aadl-parse job: varve itself, then the
      # layer varve.toml pins. regen.sh and the target-reference gate resolve spar
      # ONLY through `varve which spar` (no PATH fallback), so a missing pin is a
      # red step here, never a silent regeneration from the committed JSON.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 2 \
               -o /tmp/varve-install.sh \
               https://raw.githubusercontent.com/pulseengine/varve/main/install.sh
          sh /tmp/varve-install.sh
          echo "$HOME/.varve/bin" >> "$GITHUB_PATH"

      - name: Lay down the pinned layer and resolve spar
        run: |
          set -euo pipefail
          varve install
          SPAR="$(varve which spar)"
          test -x "$SPAR" || { echo "::error::varve which spar gave '$SPAR', not an executable"; exit 1; }
          "$SPAR" --version

      - name: Regenerate the spar-items JSON and generated/ from targets/*.aadl (pinned spar)
        run: bash targets/regen.sh

      - name: Drift gate — committed spar-items JSON and generated/ must match the models
        run: |
          if ! git diff --exit-code -- targets/generated/ tools/gust-target-gen/tests/golden/f100.items.json; then
            echo "::error::targets/generated/ or the committed spar-items JSON is stale against targets/*.aadl — run targets/regen.sh and commit the result."
            exit 1
          fi

      # After regen, so the golden/parity tests read the JSON the models produce.
      - name: Generator unit tests (golden emit + keystone parity)
        run: cargo test --locked --manifest-path tools/gust-target-gen/Cargo.toml

      - name: Negative control — target-reference rejects a shifted base, a missing peripheral, a missing table
        run: cargo xtask check target-reference --self-test

      - name: Every modelled peripheral base equals the pinned reference table
        run: cargo xtask check target-reference

      - name: Install wasm-tools
        run: cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked

      # SHADOW PERIOD (gale#368). The gates are moving to one compiled language.
      # A port is not retired on review: the failure mode of this migration is
      # replacing a gate with one that is green because it cannot distinguish --
      # the exact defect class the sweep exists to remove. So both run, and their
      # verdicts must agree, for at least one merge cycle before the shell goes.
      - name: Negative control — the ported gate must reject a planted bad world
        run: cargo xtask check wit-resolve --self-test

      - name: WIT worlds resolve against the gust:hal seam (shell, retiring)
        id: shell_gate
        continue-on-error: true
        run: bash targets/check-wit-resolve.sh

      - name: WIT worlds resolve against the gust:hal seam (xtask)
        id: rust_gate
        continue-on-error: true
        run: cargo xtask check wit-resolve

      - name: The two gates must agree
        run: |
          set -euo pipefail
          s='${{ steps.shell_gate.outcome }}'
          r='${{ steps.rust_gate.outcome }}'
          echo "shell=$s  xtask=$r"
          if [ "$s" != "$r" ]; then
            echo "::error::shell and xtask gates disagree (shell=$s xtask=$r) — do not retire the shell gate"
            exit 1
          fi
          # Agreement alone is not enough: agreeing on "success" is the only
          # outcome that lets the job pass. Two gates that agree the property is
          # BROKEN must still fail the job.
          [ "$s" = "success" ] || { echo "::error::both gates report failure"; exit 1; }
          echo "gates agree: $s"
