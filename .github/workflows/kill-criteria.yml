# The two kill-criteria that existed as code and were fired by nothing (gale#324).
#
# Both were written the expensive way round — someone worked out what to assert and
# wrote the assertion — and then were never wired, so neither could fail. This
# workflow fires them.
#
# NO `paths:` FILTER, deliberately: these must be REQUIRABLE (gale#294). A filtered
# workflow does not run when a PR touches nothing it cares about, GitHub never
# creates its check, and a required context that never reports blocks the PR
# forever. Both jobs here are seconds of pure Python, so there is nothing to
# path-gate away.
#
# Each job runs its NEGATIVE CONTROL FIRST and separately, so a green result means
# "the gate can distinguish", not merely "the gate ran".
name: verification kill-criteria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wcet-evt:
    name: "VER-OS-WCET-001 kill-criterion can still fail"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The real gate consumes a semihosting capture from STM32F100 silicon, which
      # CI has no access to. What CI CAN verify — and what actually matters for the
      # artifact's claim — is that the criterion still DISCRIMINATES: an over-bound
      # capture must go red. The script ships both synthetic captures for this.
      - name: Negative control — an over-bound capture MUST be rejected
        run: |
          cd benches/gust/drivers
          python3 check-wcet-evt.py --emit-sample-capture fail > /tmp/wcet-fail.txt
          if python3 check-wcet-evt.py /tmp/wcet-fail.txt; then
            echo "::error::over-bound capture was ACCEPTED — the kill-criterion is vacuous"
            exit 1
          fi
          echo "ok: over-bound capture rejected (exit non-zero), as required"

      - name: A conforming capture must be accepted
        run: |
          cd benches/gust/drivers
          python3 check-wcet-evt.py --emit-sample-capture pass > /tmp/wcet-pass.txt
          python3 check-wcet-evt.py /tmp/wcet-pass.txt

  proof-completeness:
    name: "a Rocq proof that is merely STATED cannot pass as proven"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `coqc` succeeds on a file whose every theorem ends in `Admitted.` — an
      # admit is a deferral, not an error. So the "Rocq Proofs (14 files)" job is
      # green whether a theorem is proven or merely stated. Prove this check can
      # tell the difference before trusting its green.
      - name: Negative control — an admitted proof must be distinguishable
        run: python3 tools/check-proof-completeness.py --self-test

      - name: Census every proof file against the ledger
        run: python3 tools/check-proof-completeness.py

  retry-loops:
    name: "no CI retry loop can swallow its own failure"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # This gate exists BECAUSE a silent failure got through: `west sdk install`
      # failed three times, its step exited 0, and the NEXT step failed looking
      # for a toolchain that was never installed. Prove the check bites before
      # trusting the green.
      - name: Negative control — the unfailable form must be caught
        run: python3 tools/check-retry-loops.py --self-test

      - name: Sweep every workflow
        run: python3 tools/check-retry-loops.py

  data-overlap:
    name: "fused data segments are disjoint (gale#266)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.245.1 --locked

      # This gate exists BECAUSE a silent failure got through: meld exits 0 and
      # prints "Fusion complete!" while three components' .rodata stack on the same
      # address. Prove it still bites before trusting the green.
      - name: Negative control — overlapping segments MUST be rejected
        run: |
          cd benches/gust/drivers
          printf '%s' '(module (memory 1) (data (i32.const 0) "AAAAAAAA") (data (i32.const 4) "BBBBBBBB"))' > /tmp/overlap.wat
          wasm-tools parse /tmp/overlap.wat -o /tmp/overlap.wasm
          if python3 check-data-overlap.py /tmp/overlap.wasm; then
            echo "::error::overlapping data segments were ACCEPTED — the gate is vacuous"
            exit 1
          fi
          echo "ok: overlap rejected, as required"

      - name: The committed fused core must be disjoint
        id: py_gate
        continue-on-error: true
        run: |
          cd benches/gust/drivers
          python3 check-data-overlap.py measurements/wcet-fixture/gustos.loom.wasm

      # SHADOW PERIOD (gale#368). Both gates run; their verdicts must agree
      # before the Python one is retired. See gust-targets.yml for the rationale.
      - name: Negative control — the ported gate must reject the same overlap
        run: |
          cargo xtask check data-overlap --self-test
          if cargo xtask check data-overlap --module /tmp/overlap.wasm; then
            echo "::error::xtask ACCEPTED overlapping segments — the port is vacuous"
            exit 1
          fi
          echo "ok: xtask rejects the overlap too"

      - name: The committed fused core must be disjoint (xtask)
        id: rs_gate
        continue-on-error: true
        run: cargo xtask check data-overlap

      - name: The two gates must agree
        run: |
          set -euo pipefail
          s='${{ steps.py_gate.outcome }}'
          r='${{ steps.rs_gate.outcome }}'
          echo "python=$s  xtask=$r"
          if [ "$s" != "$r" ]; then
            echo "::error::python and xtask gates disagree (python=$s xtask=$r) — do not retire the python gate"
            exit 1
          fi
          [ "$s" = "success" ] || { echo "::error::both gates report failure"; exit 1; }
          echo "gates agree: $s"

  object-freshness:
    name: "committed objects are not older than their sources"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the gate compares git commit dates

      # Four objects went stale for 5-7 weeks unnoticed (gale#334). First
      # misdiagnosed as toolchain drift; the rustc bisect ruled that out. The
      # actual cause is that nothing rebuilds a committed object when its
      # sources change. This is that check.
      - name: Negative control — the ledger must bite in both directions
        run: |
          cd benches/gust/drivers
          python3 check-object-freshness.py --self-test

      - name: Committed objects are not older than their sources
        run: |
          cd benches/gust/drivers
          python3 check-object-freshness.py

  # gale#294 put 19 contexts on main; gale#340 was one of them quietly acquiring
  # the shape where it can never report. Nothing was watching that invariant --
  # it had been checked once, by hand, with a script that could not see the very
  # failure mode that had occurred. This is that check, made mechanical.
  required-contexts:
    name: "every required context can actually report"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Negative control -- the gate catches each way a check stops arriving
        run: python3 tools/check-required-contexts.py --self-test

      # Whether the default GITHUB_TOKEN can read branch protection decides how
      # much this gate covers, so ASK rather than assume. If it can, the check
      # also confirms the committed list still matches what main actually
      # requires; if it cannot, the run says so in as many words instead of
      # passing as though it had checked.
      - name: Can this token read branch protection?
        id: prot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" > /tmp/protection.json 2>/tmp/protection.err; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
            echo "GITHUB_TOKEN CAN read branch protection -- list/protection drift is checked."
          else
            echo "readable=false" >> "$GITHUB_OUTPUT"
            rm -f /tmp/protection.json
            echo "GITHUB_TOKEN CANNOT read branch protection. Reported, not assumed:"
            cat /tmp/protection.err
          fi

      - name: Every required context maps to a job that reports on every PR
        run: |
          if [ "${{ steps.prot.outputs.readable }}" = "true" ]; then
            python3 tools/check-required-contexts.py --protection /tmp/protection.json
          else
            python3 tools/check-required-contexts.py
          fi

  # VER-DRV-GRAPH-001 (gale#345): the graph half of the old REQ-DRV-COMPONENT-001.
  # Its per-driver half is gated by drv-components.yml; this asserts the property
  # that one deliberately does not cover -- that no core module of a committed
  # composed/fused wasm imports from `env`.
  graph-env:
    name: "no raw env import survives in the composed graph"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.245.1 --locked

      - name: Negative control -- a raw env import must be caught
        run: python3 benches/gust/drivers/check-graph-env.py --self-test

      - name: No core module of the composed graph imports env
        id: py_gate
        continue-on-error: true
        run: python3 benches/gust/drivers/check-graph-env.py

      # SHADOW PERIOD (gale#368). Both gates run; their verdicts must agree
      # before the Python one is retired. See gust-targets.yml for the rationale.
      #
      # These two DO diverge on one input, deliberately: with a listed composed
      # artifact deleted, the Python prints "SKIP (not present)" and PASSES,
      # while xtask REFUSES. That is the defect the port fixes, not a shadow
      # failure -- on the committed tree both pass, which is what is asserted.
      - name: Negative control — the ported gate must catch a raw env import
        run: cargo xtask check graph-env --self-test

      - name: No core module of the composed graph imports env (xtask)
        id: rs_gate
        continue-on-error: true
        run: cargo xtask check graph-env

      - name: The two gates must agree
        run: |
          set -euo pipefail
          s='${{ steps.py_gate.outcome }}'
          r='${{ steps.rs_gate.outcome }}'
          echo "python=$s  xtask=$r"
          if [ "$s" != "$r" ]; then
            echo "::error::python and xtask gates disagree (python=$s xtask=$r) — do not retire the python gate"
            exit 1
          fi
          [ "$s" = "success" ] || { echo "::error::both gates report failure"; exit 1; }
          echo "gates agree: $s"

  # REQ-OS-MPU-001's kill-criterion, executed. VER-OS-ISO-001 recorded this oracle
  # as evidence but noted "local qemu, not yet CI-gated" -- so the only MPU
  # ENFORCEMENT evidence gale had ran on someone's laptop. The neighbouring Renode
  # iso gate (gust_iso.robot) executes the region programmer's computation and the
  # seam order; it asserts no fault at all. This is the enforcement half.
  mpu-enforcement:
    name: "a denied write really faults (REQ-OS-MPU-001 kill-criterion)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install thumbv7m target and qemu
        run: |
          set -euo pipefail
          rustup target add thumbv7m-none-eabi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | head -1

      # Control FIRST. The oracle claims the write faults BECAUSE the region table
      # does not grant it; that is only evidence if granting it removes the fault.
      # `grant-hole` adds region 3 over exactly the denied range, still through the
      # verified switch_to_partition, so the probe MUST fail.
      - name: Negative control -- granting the hole must make the probe FAIL
        working-directory: benches/gust
        run: |
          set -uo pipefail
          if cargo run --release --features grant-hole --bin gust_iso_fault_probe; then
            echo "::error::control PASSED with the hole granted -- the oracle is vacuous"
            exit 1
          fi
          echo "control failed as required: the denial is caused by the region table"

      - name: A write outside the granted region takes a real MemManage fault
        working-directory: benches/gust
        run: cargo run --release --bin gust_iso_fault_probe

      # REQ-OS-UNPRIV-001, as a LEDGER WITH TEETH rather than a prose note.
      # VER-OS-ISO-001 says in words that gale has fault-containment and not
      # security-containment: the tenant runs privileged and the PPB is not
      # MPU-checked. This asserts that state, so closing the gap cannot pass
      # silently -- when tenant code runs unprivileged the MPU_CTRL write will
      # fault, this step will FAIL, and the failure is the signal to update the
      # scope note and the probe together. Same shape as dma-own's raw-env
      # assertion in check-driver-components.py.
      #
      # A GREEN step here means the gap is still OPEN. That reads backwards on
      # purpose; the probe's header explains why.
      - name: "Ledger: a privileged tenant can still disable its own MPU (gap open)"
        working-directory: benches/gust
        run: cargo run --release --bin gust_iso_unpriv_probe

      # The other half: does the FIX work? Establishing that CONTROL.nPRIV=1 blocks
      # the PPB escape de-risks REQ-OS-UNPRIV-001 before gust's architecture adopts
      # it -- and it means the ledger step above is measuring an open gap with a
      # known remedy rather than an open question.
      #
      # Which fault fires is measured, not assumed: this core raises MemManage,
      # where the ARMv7-M rules for System Control Space access had me expecting
      # BusFault. The probe handles MemManage, BusFault and HardFault and names the
      # one it got, so a different core reports the difference instead of looking
      # like "no fault happened".
      - name: "Mechanism: dropping to unprivileged blocks the same escape"
        working-directory: benches/gust
        run: cargo run --release --features drop-priv --bin gust_iso_unpriv_probe

  # T4 (REQ-OS-WCET-001): synth's own per-function static WCET bounds. emit-wcet.sh has
  # existed since the sidecar landed (synth#778) and was invoked by NOTHING — it was one
  # of the seven builders gale#324 catalogued and I set aside as "less alarming". It is
  # not a builder: it is the static half of a verification track, and an ungated one.
  #
  # It gates three things itself: the sidecar's bounds, that the .o is byte-identical
  # with and without --emit-wcet (the sidecar must be additive), and that every function
  # it cannot bound DECLINES LOUDLY rather than being omitted.
  wcet-sidecar:
    name: "T4: synth emits sound per-function WCET bounds (REQ-OS-WCET-001)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the pinned toolchain
        # --retry: every network install in this repo retries (#320/#321). The
        # download is to a FILE, never `curl | sh` -- a pipe there hides the
        # fetch's exit status behind the shell's, which is how a failed install
        # became a confusing later error.
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 2 \
               -o /tmp/varve-install.sh \
               https://raw.githubusercontent.com/pulseengine/varve/main/install.sh
          sh /tmp/varve-install.sh
          echo "$HOME/.varve/bin" >> "$GITHUB_PATH"

      - name: Lay down and verify the pinned layer
        # Installing the varve BINARY is not installing the LAYER. Without this
        # `varve which synth` fails, the script falls back to PATH, finds no
        # synth, and dies on a missing binary instead of on a verdict.
        run: |
          set -euo pipefail
          varve install
          varve which synth
          varve which loom

      - name: Negative control — an unresolvable synth must be refused
        # The gate is toolchain-sensitive, so its refusal is what makes a green
        # meaningful. Same control drv-cross-arch.yml runs on its own gate.
        working-directory: benches/gust/drivers
        run: |
          if SYNTH=/usr/bin/false bash emit-wcet.sh >/dev/null 2>&1; then
            echo "::error::emit-wcet answered from a broken toolchain"
            exit 1
          fi
          echo "refusal bites"

      - name: Emit and gate the WCET sidecars
        working-directory: benches/gust/drivers
        run: bash emit-wcet.sh
