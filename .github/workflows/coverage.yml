# Code coverage for Gale — Rust (cargo-llvm-cov) + Zephyr C (twister + gcov)
#
# Generates LCOV reports and uploads to Codecov.
# Rust coverage covers the verified kernel models + FFI crate.
# Zephyr coverage covers the C shims running on QEMU targets.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Rust source coverage (cargo-llvm-cov) ─────────────────────────
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (LCOV + HTML)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
          cargo llvm-cov --workspace --html --output-dir coverage-rust

      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov-rust.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: coverage-rust/
          retention-days: 14

  # ── Zephyr C coverage (twister + gcov on QEMU) ───────────────────
  zephyr-coverage:
    name: Zephyr C Coverage
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.0
      options: --user root --volume /mnt:/mnt
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/.docker
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Gale
        uses: actions/checkout@v7
        with:
          path: gale

      - name: Install Rust + ARM target
        run: |
          apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
          # RETRY, POSIX-sh SAFE (gale#289).
          #
          # Two defects here. (1) Unretried: one transient fetch killed the job.
          # (2) `curl … | sh` reports SH's status, so a failed download feeds sh
          # empty stdin, sh exits 0, and the step PASSES with rustup never
          # installed — surfacing later as an unrelated-looking build error.
          #
          # The pipe is REMOVED rather than wrapped in `set -o pipefail`. These
          # jobs run in containers, and GitHub picks `sh -e {0}` when the image
          # has no bash — dash rejects pipefail outright:
          #     set: Illegal option -o pipefail
          # Downloading to a file and running it needs no pipefail, works under
          # both sh and bash, and removes the truncation ambiguity entirely:
          # curl -f fails on HTTP errors, and the installer runs as a plain
          # command whose status `set -e` already honours.
          _ok=0
          for _a in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              _ok=1; break
            fi
            echo "::warning::rustup download attempt ${_a}/3 failed; retrying" >&2
            sleep $((_a * 15))
          done
          [ "$_ok" = 1 ] || { echo "::error::rustup download failed after 3 attempts" >&2; exit 1; }
          sh /tmp/rustup-init.sh -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add thumbv7m-none-eabi

      - name: Initialize west workspace
        run: |
          pip3 install west gcovr
          echo "host-root before reclaim:"; df -h / | tail -1
          rm -rf /opt/toolchains/zephyr-sdk-* 2>/dev/null || true   # reclaim ~14GB image SDK
          echo "host-root after reclaim:"; df -h / | tail -1
          ZEPHYR_FORK_REV="$(grep -v '^#' "${GITHUB_WORKSPACE}/gale/.github/zephyr-fork-pin" | tr -d '[:space:]')"
          [ -n "$ZEPHYR_FORK_REV" ] || { echo "::error::empty .github/zephyr-fork-pin" >&2; exit 1; }
          # west init --mr runs `git clone --branch <rev>`, which does not take a SHA, so the
          # manifest repo is cloned on the branch and then moved to the PINNED revision
          # before `west update` reads it. HEAD is asserted: a silent miss here would build
          # an unpinned Zephyr and look identical in the log.
          west init -m https://github.com/pulseengine/zephyr.git --mr gale/sem-replacement zephyr-workspace
          git -C zephyr-workspace/zephyr fetch --depth 1 origin "$ZEPHYR_FORK_REV"
          git -C zephyr-workspace/zephyr checkout --detach FETCH_HEAD
          [ "$(git -C zephyr-workspace/zephyr rev-parse HEAD)" = "$ZEPHYR_FORK_REV" ] || { echo "::error::zephyr fork not at pinned $ZEPHYR_FORK_REV" >&2; exit 1; }
          cd zephyr-workspace
          # west update fetches ~60 third-party modules; a single transient TLS failure
          # on any one of them kills the whole step (seen on openthread, percepio,
          # uoscore-uedhoc, liblc3 — a different project each time, while its neighbours
          # clone fine from the same host). west update is resumable, so retry.
          n=0; until west update --narrow -o=--depth=1; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::west update failed after 3 attempts" >&2; exit 1; fi; sleep $((15*n)); done
          n=0; until west sdk install -t arm-zephyr-eabi --personal-access-token "${GITHUB_TOKEN}"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::west sdk install failed after 3 attempts" >&2; exit 1; fi; sleep $((5*n)); done

      - name: Run twister with coverage
        run: |
          . /root/.cargo/env
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/zephyr-workspace/zephyr"
          export GALE_ROOT="${GITHUB_WORKSPACE}/gale"
          cd zephyr-workspace
          # Run kernel tests on qemu_cortex_m3 with coverage enabled
          "${ZEPHYR_BASE}/scripts/twister" \
            --platform qemu_cortex_m3 \
            --tag kernel \
            --enable-coverage \
            --coverage-tool lcov \
            --outdir "${GITHUB_WORKSPACE}/twister-out" \
            --enable-slow \
            -v || TWISTER_RC=$?
          # Twister exits 1 on ANY failed suite, ledgered or not, so letting set -e act
          # on it killed this step before the ledger below was ever consulted (#394's
          # first ledgered run: red on kernel.timer.starve, the one ledgered failure).
          # The exit is carried into the assertion, not discarded: non-zero with no
          # failed suite in twister.json means twister itself broke, and that fails.
          export TWISTER_RC="${TWISTER_RC:-0}"
          echo "twister exit: ${TWISTER_RC}"

          # THE GATE. `|| true` used to be here, and this REQUIRED context has been
          # green since 2026-03-22 while running ZERO kernel tests:
          # `--coverage-tool gcovr --coverage-formats lcov` is rejected by twister
          # ("Unsupported coverage report formats:'lcov' for gcovr"), so it exited in
          # under a second, `|| true` ate the status, Codecov's upload failed under
          # fail_ci_if_error:false, and the artifact step warned "No files were found"
          # and succeeded. Four independent swallows in a row, each defensible alone.
          #
          # The step is named "Upload LCOV to Codecov" while the tool was gcovr; the
          # tool now matches the intent. The result is ASSERTED rather than inferred
          # from an exit code, because the exit code is exactly what was thrown away.
          if [ ! -s "${GITHUB_WORKSPACE}/twister-out/twister.json" ]; then
            echo "::error::twister produced no twister.json — it did not run"
            exit 1
          fi
          python3 - <<'PYEOF'
          import json, os, sys
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "twister-out", "twister.json")
          d = json.load(open(p))
          tt = d.get("testsuites", [])
          # KNOWN-FAILING LEDGER, by suite name. Deliberately narrow: exactly these
          # suites may fail, and the gate FAILS if one of them starts passing, so the
          # ledger cannot silently outlive its reason.
          #
          # kernel.timer.starve — first seen when this gate actually ran tests
          # (#394). Assertion: tests/kernel/timer/starve/src/main.c:68
          # "(now_diff > 0 is false) / Time went backwards by 0: was 0.000" — two
          # consecutive uptime reads returned the same value. NOT a gale defect:
          # this twister run compiles no gale code at all (0 mentions of
          # ZEPHYR_EXTRA_MODULES, gale_overlay, GALE_KERNEL, gale_timeout or
          # libgale_ffi in the build log), so it is upstream Zephyr's own timer on
          # the fork's v4.4.0 base. QEMU without icount returning an unchanged
          # clock across a tight loop is the SUSPECTED mechanism, not a proven one.
          KNOWN_FAILING = {"kernel.timer.starve"}
          failed_names = {t.get("name") for t in tt if t.get("status") in ("failed", "error")}
          # "now passes" means status == passed. It used to be "present and not failed",
          # so a ledgered suite that was merely FILTERED or skipped read as fixed.
          fixed = sorted(n for n in KNOWN_FAILING
                         if any(t.get("name") == n and t.get("status") == "passed" for t in tt))
          if fixed:
              sys.exit(f"::error::ledgered failure(s) now PASS — prune KNOWN_FAILING: {fixed}")
          bad = [t for t in tt if t.get("status") in ("failed", "error")
                 and t.get("name") not in KNOWN_FAILING]
          # "not run" = built but not executed; counting it as executed made the
          # summary read "150 executed" when twister itself reported 147.
          ran = [t for t in tt if t.get("status") not in (None, "filtered", "skipped", "not run")]
          print(f"twister: {len(tt)} suite(s), {len(ran)} executed, {len(bad)} failed/errored")
          if not ran:
              sys.exit("::error::twister executed 0 suites — a green here would mean nothing")
          rc = int(os.environ.get("TWISTER_RC", "0"))
          if rc != 0 and not failed_names:
              sys.exit(f"::error::twister exited {rc} with no failed suite recorded — twister broke, not a test")
          if bad:
              for t in bad[:10]:
                  print(f"  FAILED {t.get('name')}: {t.get('status')}")
              sys.exit(f"::error::{len(bad)} twister suite(s) failed")
          PYEOF

      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          directory: twister-out/coverage/
          flags: zephyr
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload twister results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twister-results
          path: |
            twister-out/twister.json
            twister-out/coverage/
          retention-days: 14
  zephyr-coverage-gale:
    name: Zephyr C Coverage (gale-enabled)
    # MEASUREMENT LEG (gale#395). Identical to zephyr-coverage except gale's
    # module + overlay are injected. Not a required context: its purpose
    # is to be compared, and it will likely surface failures gale's
    # replacements cause under the wider kernel test selection.
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.0
      options: --user root --volume /mnt:/mnt
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/.docker
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Gale
        uses: actions/checkout@v7
        with:
          path: gale

      - name: Install Rust + ARM target
        run: |
          apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
          # RETRY, POSIX-sh SAFE (gale#289).
          #
          # Two defects here. (1) Unretried: one transient fetch killed the job.
          # (2) `curl … | sh` reports SH's status, so a failed download feeds sh
          # empty stdin, sh exits 0, and the step PASSES with rustup never
          # installed — surfacing later as an unrelated-looking build error.
          #
          # The pipe is REMOVED rather than wrapped in `set -o pipefail`. These
          # jobs run in containers, and GitHub picks `sh -e {0}` when the image
          # has no bash — dash rejects pipefail outright:
          #     set: Illegal option -o pipefail
          # Downloading to a file and running it needs no pipefail, works under
          # both sh and bash, and removes the truncation ambiguity entirely:
          # curl -f fails on HTTP errors, and the installer runs as a plain
          # command whose status `set -e` already honours.
          _ok=0
          for _a in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              _ok=1; break
            fi
            echo "::warning::rustup download attempt ${_a}/3 failed; retrying" >&2
            sleep $((_a * 15))
          done
          [ "$_ok" = 1 ] || { echo "::error::rustup download failed after 3 attempts" >&2; exit 1; }
          sh /tmp/rustup-init.sh -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add thumbv7m-none-eabi

      - name: Initialize west workspace
        run: |
          pip3 install west gcovr
          echo "host-root before reclaim:"; df -h / | tail -1
          rm -rf /opt/toolchains/zephyr-sdk-* 2>/dev/null || true   # reclaim ~14GB image SDK
          echo "host-root after reclaim:"; df -h / | tail -1
          ZEPHYR_FORK_REV="$(grep -v '^#' "${GITHUB_WORKSPACE}/gale/.github/zephyr-fork-pin" | tr -d '[:space:]')"
          [ -n "$ZEPHYR_FORK_REV" ] || { echo "::error::empty .github/zephyr-fork-pin" >&2; exit 1; }
          # west init --mr runs `git clone --branch <rev>`, which does not take a SHA, so the
          # manifest repo is cloned on the branch and then moved to the PINNED revision
          # before `west update` reads it. HEAD is asserted: a silent miss here would build
          # an unpinned Zephyr and look identical in the log.
          west init -m https://github.com/pulseengine/zephyr.git --mr gale/sem-replacement zephyr-workspace
          git -C zephyr-workspace/zephyr fetch --depth 1 origin "$ZEPHYR_FORK_REV"
          git -C zephyr-workspace/zephyr checkout --detach FETCH_HEAD
          [ "$(git -C zephyr-workspace/zephyr rev-parse HEAD)" = "$ZEPHYR_FORK_REV" ] || { echo "::error::zephyr fork not at pinned $ZEPHYR_FORK_REV" >&2; exit 1; }
          cd zephyr-workspace
          # west update fetches ~60 third-party modules; a single transient TLS failure
          # on any one of them kills the whole step (seen on openthread, percepio,
          # uoscore-uedhoc, liblc3 — a different project each time, while its neighbours
          # clone fine from the same host). west update is resumable, so retry.
          n=0; until west update --narrow -o=--depth=1; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::west update failed after 3 attempts" >&2; exit 1; fi; sleep $((15*n)); done
          n=0; until west sdk install -t arm-zephyr-eabi --personal-access-token "${GITHUB_TOKEN}"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::west sdk install failed after 3 attempts" >&2; exit 1; fi; sleep $((5*n)); done

      - name: Run twister with coverage
        run: |
          . /root/.cargo/env
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/zephyr-workspace/zephyr"
          export GALE_ROOT="${GITHUB_WORKSPACE}/gale"
          cd zephyr-workspace
          # GALE'S CONFIG GOES IN AS -DCONFIG_* ENTRIES, NOT AS OVERLAY_CONFIG. The first
          # version passed -x=OVERLAY_CONFIG=gale_overlay.conf, and twister silently
          # replaced it: cmake_assemble_args (twisterlib/runner.py) appends -x entries
          # FIRST and its own -DOVERLAY_CONFIG=<build>/twister/testsuite_extra.conf LAST,
          # and the last -D wins. The run built 205 configs with CONFIG_GALE_KERNEL_SEM=y
          # in NONE of them — a second upstream run, caught by the .config check below.
          # The entries are read from gale_overlay.conf so the two cannot drift.
          set --
          for c in $(grep -E '^CONFIG_[A-Z0-9_]+=' "${GALE_ROOT}/zephyr/gale_overlay.conf"); do
            set -- "$@" "-x=${c}"
          done
          if [ "$#" -eq 0 ]; then
            echo "::error::no CONFIG_ lines read from gale_overlay.conf — this leg would build upstream"
            exit 1
          fi
          echo "gale config entries passed to twister: $#"
          "${ZEPHYR_BASE}/scripts/twister" \
            --platform qemu_cortex_m3 \
            --tag kernel \
            --enable-coverage \
            --coverage-tool lcov \
            -x=ZEPHYR_EXTRA_MODULES="${GALE_ROOT}" \
            "$@" \
            --outdir "${GITHUB_WORKSPACE}/twister-out-gale" \
            --enable-slow \
            -v || TWISTER_RC=$?
          export TWISTER_RC="${TWISTER_RC:-0}"
          echo "twister exit: ${TWISTER_RC}"

          # THIS LEG MEASURES; IT DOES NOT JUDGE. Failures here are the data the
          # coverage-delta job compares against the upstream leg, so no per-suite
          # ledger lives here. What this step DOES refuse is a measurement that is not
          # one: no twister.json, zero executed, a twister that broke, or a build that
          # never compiled gale in. The last is checked in each built .config, not by
          # grepping the log — the log carries this file's own comments, and a string
          # match there once "confirmed" an injection that had not been applied.
          if [ ! -s "${GITHUB_WORKSPACE}/twister-out-gale/twister.json" ]; then
            echo "::error::twister produced no twister.json — it did not run"
            exit 1
          fi
          python3 - <<'PYEOF'
          import glob, json, os, sys
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "twister-out-gale")
          tt = json.load(open(os.path.join(out, "twister.json"))).get("testsuites", [])
          ran = [t for t in tt if t.get("status") not in (None, "filtered", "skipped", "not run")]
          failed = [t for t in tt if t.get("status") in ("failed", "error")]
          print(f"twister (gale): {len(tt)} suite(s), {len(ran)} executed, {len(failed)} failed/errored")
          if not ran:
              sys.exit("::error::gale leg executed 0 suites — nothing to compare")
          rc = int(os.environ.get("TWISTER_RC", "0"))
          if rc != 0 and not failed:
              sys.exit(f"::error::twister exited {rc} with no failed suite recorded — twister broke, not a test")
          configs = glob.glob(os.path.join(out, "**", "zephyr", ".config"), recursive=True)
          with_gale = [c for c in configs if "CONFIG_GALE_KERNEL_SEM=y" in open(c, errors="replace").read()]
          print(f"built configs: {len(configs)}, with CONFIG_GALE_KERNEL_SEM=y: {len(with_gale)}")
          if not with_gale:
              sys.exit("::error::no build in the gale leg has CONFIG_GALE_KERNEL_SEM=y — gale was not compiled in; this would be a second upstream run")
          PYEOF

      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          directory: twister-out-gale/coverage/
          flags: zephyr
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload twister results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twister-results-gale
          path: |
            twister-out-gale/twister.json
            twister-out-gale/coverage/
          retention-days: 14

  coverage-delta:
    name: "Upstream vs gale — kernel test delta (gale#395)"
    needs: [zephyr-coverage, zephyr-coverage-gale]
    # always(): the delta is most valuable exactly when one leg went red.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch both legs' results
        uses: actions/download-artifact@v8
        with:
          pattern: twister-results*
          path: results

      - name: Negative control — the delta must refuse an input that executed nothing
        run: |
          set -euo pipefail
          mkdir -p /tmp/ctl
          echo '{"testsuites":[{"name":"a","status":"filtered"}]}' > /tmp/ctl/empty.json
          echo '{"testsuites":[{"name":"a","status":"passed"}]}'   > /tmp/ctl/ok.json
          if python3 tools/coverage-delta.py /tmp/ctl/ok.json /tmp/ctl/empty.json >/dev/null; then
            echo "::error::delta accepted a run that executed nothing — it would report a vacuous comparison"
            exit 1
          fi
          echo "vacuity guard bites"

      - name: Compare upstream vs gale
        run: |
          set -euo pipefail
          UP=results/twister-results/twister.json
          GA=results/twister-results-gale/twister.json
          # listing only; the verdict is the script's exit status below
          ls -R results
          python3 tools/coverage-delta.py "$UP" "$GA" --summary "$GITHUB_STEP_SUMMARY"
