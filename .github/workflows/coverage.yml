# Code coverage for Gale — Rust (cargo-llvm-cov) + Zephyr C (twister + gcov)
#
# Generates LCOV reports and uploads to Codecov.
# Rust coverage covers the verified kernel models + FFI crate.
# Zephyr coverage covers the C shims running on QEMU targets.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Rust source coverage (cargo-llvm-cov) ─────────────────────────
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (LCOV + HTML)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
          cargo llvm-cov --workspace --html --output-dir coverage-rust

      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov-rust.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: coverage-rust/
          retention-days: 14

  # ── Zephyr C coverage (twister + gcov on QEMU) ───────────────────
  zephyr-coverage:
    name: Zephyr C Coverage
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.0
      options: --user root --volume /mnt:/mnt
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/.docker
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Gale
        uses: actions/checkout@v7
        with:
          path: gale

      - name: Install Rust + ARM target
        run: |
          apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
          # RETRY, POSIX-sh SAFE (gale#289).
          #
          # Two defects here. (1) Unretried: one transient fetch killed the job.
          # (2) `curl … | sh` reports SH's status, so a failed download feeds sh
          # empty stdin, sh exits 0, and the step PASSES with rustup never
          # installed — surfacing later as an unrelated-looking build error.
          #
          # The pipe is REMOVED rather than wrapped in `set -o pipefail`. These
          # jobs run in containers, and GitHub picks `sh -e {0}` when the image
          # has no bash — dash rejects pipefail outright:
          #     set: Illegal option -o pipefail
          # Downloading to a file and running it needs no pipefail, works under
          # both sh and bash, and removes the truncation ambiguity entirely:
          # curl -f fails on HTTP errors, and the installer runs as a plain
          # command whose status `set -e` already honours.
          _ok=0
          for _a in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              _ok=1; break
            fi
            echo "::warning::rustup download attempt ${_a}/3 failed; retrying" >&2
            sleep $((_a * 15))
          done
          [ "$_ok" = 1 ] || { echo "::error::rustup download failed after 3 attempts" >&2; exit 1; }
          sh /tmp/rustup-init.sh -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add thumbv7m-none-eabi

      - name: Initialize west workspace
        run: |
          pip3 install west gcovr
          echo "host-root before reclaim:"; df -h / | tail -1
          rm -rf /opt/toolchains/zephyr-sdk-* 2>/dev/null || true   # reclaim ~14GB image SDK
          echo "host-root after reclaim:"; df -h / | tail -1
          west init -m https://github.com/pulseengine/zephyr.git --mr gale/sem-replacement zephyr-workspace
          cd zephyr-workspace
          # west update fetches ~60 third-party modules; a single transient TLS failure
          # on any one of them kills the whole step (seen on openthread, percepio,
          # uoscore-uedhoc, liblc3 — a different project each time, while its neighbours
          # clone fine from the same host). west update is resumable, so retry.
          for attempt in 1 2 3; do west update --narrow -o=--depth=1 && break || sleep 15; done
          for attempt in 1 2 3; do west sdk install -t arm-zephyr-eabi --personal-access-token "${GITHUB_TOKEN}" && break || sleep 5; done

      - name: Run twister with coverage
        run: |
          . /root/.cargo/env
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/zephyr-workspace/zephyr"
          export GALE_ROOT="${GITHUB_WORKSPACE}/gale"
          cd zephyr-workspace
          # Run kernel tests on qemu_cortex_m3 with coverage enabled
          "${ZEPHYR_BASE}/scripts/twister" \
            --platform qemu_cortex_m3 \
            --tag kernel \
            --enable-coverage \
            --coverage-tool gcovr \
            --coverage-formats lcov \
            --outdir "${GITHUB_WORKSPACE}/twister-out" \
            --enable-slow \
            -v \
            || true

      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          directory: twister-out/coverage/
          flags: zephyr
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload twister results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twister-results
          path: |
            twister-out/twister.json
            twister-out/coverage/
          retention-days: 14
