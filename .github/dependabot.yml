version: 2
# Groups are per update entry, so each group sits under the ecosystem whose
# names it matches; patterns are globs, not regexes. One upstream release
# then arrives as one PR instead of one per package.
# PAUSED 2026-11-21 under the fleet CI hold; restore the previous limits when it lifts.
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # Released in lockstep from one upstream repository; a partial bump
      # does not resolve. Only the root workspace depends on them.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasm-metadata"
          - "wit-component"
          - "wit-parser"
  - package-ecosystem: cargo
    directory: /ffi
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /fuzz
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /tools/verus-strip
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /docs/research/sem-full-rust-poc
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    labels:
      - dependencies
