version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21).
# One entry per ecosystem, its directories in one `directories:` list, so a
# release opens one PR and not one per directory. Every entry runs monthly
# (the 1st, 02:00 UTC), keeps at most 2 PRs open, and waits 7 days after a
# release (cooldown). Lockstep groups come first because Dependabot puts a
# dependency in the FIRST group it matches; then one minor-patch group.
# Majors stay ungrouped, one PR each, so a breaking change is read on its own.
# Security updates ignore the schedule and the limit.
# Patterns are globs, not regexes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /ffi
      - /fuzz
      - /tools/verus-strip
      - /docs/research/sem-full-rust-poc
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # Released in lockstep from one upstream repository; a partial bump
      # does not resolve. Only the root workspace depends on them.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasm-metadata"
          - "wit-component"
          - "wit-parser"
      minor-patch:
        update-types:
          - minor
          - patch
