[workspace]
[package]
name = "gust-switch-thin"
version = "0.1.0"
edition = "2021"
description = "T2 stage 2: the Verus/Kani-verified partition-switch FSM as a dissolvable wasm component. Bodies lifted VERBATIM from plain/src/partition_switch.rs. THREE native atoms (ctx-save, region-swap, ctx-resume) as typed component imports; the non-maskability property is a property of the contract shape and survives the dissolve."
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
