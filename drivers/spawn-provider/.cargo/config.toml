# See drivers/exec-provider/.cargo/config.toml for the full rationale. This crate is
# now STATELESS (no executor, no Tasks table — it imports gust:sched/tasks), so the
# stack-size pin is the load-bearing half: it keeps a subsequent
# --native-pointer-abi dissolve's .bss at the shadow stack instead of the 1 MiB
# wasm-ld default. --allow-undefined is retained as toolchain hygiene, matching every
# other dissolved crate here (rustc >= 1.97 wants it for the wit-bindgen import
# stubs); no raw extern symbol remains in this crate to need it.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--allow-undefined", "-C", "link-arg=-zstack-size=1024"]
