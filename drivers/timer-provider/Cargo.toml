[workspace]
[package]
name = "gust-timer-provider"
version = "0.1.0"
edition = "2021"
description = "gust:os timer provider — backs the gust:os/timer WIT interface (sleep/slept) with the node's ONE verified async executor deadline table (Task 2's set_deadline/slept_status), reached over the gust:sched/tasks import that exec-provider exports. Stateless and clockless: it owns neither the table nor the clock, reads time through gust:os/time (so it has NO gust:hal import), and operates on the app's handle unchanged. sleep(handle, ticks) rejects ticks >= 2^31, else computes the deadline with time.deadline (wrap-safe) and calls set-deadline; slept(handle) delegates to slept-status."
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
