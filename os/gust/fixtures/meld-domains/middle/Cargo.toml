[workspace]
[package]
name = "capfix-middle"
version = "0.1.0"
edition = "2021"
description = "meld#427 fixture: the RE-EXPORTER — the component shape that forces a handle table to exist, so domain-sharing can be observed rather than reasoned about (gale#408)."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
