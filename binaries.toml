# Every committed binary file, and why it exists.
#
# `cargo xtask check binary-ledger` fails when a tracked binary has no entry here, when an
# entry names a file that is gone, or when its consumer no longer contains its needle
# (the string the consumer uses to reach it; default: the file name). A binary nothing
# reads is not committed. Format: [[binary]] tables of `key = "string"` lines only.

[[binary]]
path = "drivers/adc-thin/adc-thin-cm3.o"
kind = "synth-object"
consumer = "os/gust/build.rs"
why = "The adc-thin driver dissolved to ARMv7-M by synth; linked into the gust adc binaries."
regenerate = "drivers/adc-thin/RESULTS.md"

