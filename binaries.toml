# Every committed binary file, and why it exists.
#
# `cargo xtask check binary-ledger` fails when a tracked binary has no entry here, when an
# entry names a file that is gone, or when its consumer no longer contains its needle
# (the string the consumer uses to reach it; default: the file name), or when the file's
# bytes no longer hash to its `sha256`. A binary nothing reads is not committed.
# Format: [[binary]] tables of `key = "string"` lines only.
#
# FRESHNESS (gale#506). `cargo xtask check object-freshness` judges every committed object
# it gates (the driver objects with a crate or a build-*.sh behind them) by CONTENT:
#   sha256         the committed object's bytes (binary-ledger checks this for EVERY entry)
#   inputs_sha256  digest of the object's input files (sources, builder script, WIT seams)
#                  as of this record -- `cargo xtask freshness-record` prints it
#   toolchain      the toolchain pin as of this record, derived from varve.toml and
#                  rust-toolchain.toml. Layer covalent 2026.11.1 resolves to synth 0.89.0
#                  and loom 1.4.1 (`varve which`, 2026-11-18). rustc is a CHANNEL, not a
#                  version pin: a rustc release changes nothing this records.
# The gate fails if the bytes, the inputs or the pin differ from the record. A ledger entry
# cannot excuse any of the three.
#
# KNOWN-STALE: `stale_issue` + `stale_expires` mark an object that is NOT a build of the
# recorded inputs. It is accepted only at exactly the recorded inputs and pin, only until
# `stale_expires` (UTC, inclusive; at most 183 days out), and only with an owning issue.
# All 19 gated objects carry it as of 2026-11-18: each was last committed before an input
# or the pin changed (git dates; e.g. #516 edited every thin driver's source on 2026-11-18,
# and the objects date from 2026-07..09). Bytes were compared against a rebuild for ONE of
# them only (iso-core-fused-cm3.o: 15094 B committed, 15050 B from the pin, gale#438); for
# the other 18, "stale" is date evidence, not a measured byte difference. They are recorded,
# not regenerated: a regenerated object needs silicon re-validation and re-baselined Renode
# fixtures. Clearing one = rebuild it, re-validate, replace its four freshness lines with the
# freshness-record output, and drop its two stale_ lines.

