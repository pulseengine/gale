# Every committed binary file, and why it exists.
#
# `cargo xtask check binary-ledger` fails when a tracked binary has no entry here, when an
# entry names a file that is gone, or when its consumer no longer contains its needle
# (the string the consumer uses to reach it; default: the file name), or when the file's
# bytes no longer hash to its `sha256`. A binary nothing reads is not committed.
# Format: [[binary]] tables of `key = "string"` lines only.
#
# FRESHNESS (gale#506). `cargo xtask check object-freshness` judges every committed object
# it gates (the driver objects with a crate or a build-*.sh behind them) by CONTENT:
#   sha256         the committed object's bytes (binary-ledger checks this for EVERY entry)
#   inputs_sha256  digest of the object's inputs as of this record: its builder script, or
#                  for a crate-adjacent object the synth/loom/meld command lines of its
#                  RESULTS.md; the WIT seams; its crate's build files (incl. a local wit/);
#                  every crate reached through `path =` dependencies, transitively (mpu-thin
#                  reaches the root gale crate, so iso-core and mpu-thin cover src/ and
#                  plain/src/); and every file a `#[path]`/`include!` pulls in from outside
#                  its crate, which must be listed in the gate's PATH_INCLUDES.
#                  `cargo xtask freshness-record` prints it.
#   toolchain      every [toolchain] setting of varve.toml and rust-toolchain.toml as of this
#                  record. Layer covalent 2026.11.7 resolves to synth 0.90.0, meld 0.67.0 and
#                  loom 1.5.1 (gale#438 pin move, 2026-11-20). rustc is an exact release
#                  (1.100.0 since the fleet toolchain pin), so moving it moves this record.
# The gate fails if the bytes, the inputs or the pin differ from the record, or if the bytes
# are not a relocatable ARM ELF. A ledger entry cannot excuse any of these.
#
# KNOWN-STALE: `stale_issue` + `stale_expires` mark an object that is NOT a build of the
# recorded inputs. It is accepted only at exactly the recorded inputs and pin, only until
# `stale_expires` (UTC, inclusive; at most 183 days out), and only with an owning issue.
# The move to covalent 2026.11.7 (2026-11-20) rebuilt 11 of the 19 gated objects on that pin
# and committed them (iso-core-fused, mpu/switch/hm-thin, dma-own, and the i2c/pwm/spi/timer/
# uart/wdg thin drivers), and the 17 Renode targets re-ran on them.
# The rustc move 1.99.1 -> 1.100.0 rebuilt them again: hm/pwm/spi/uart/wdg-thin changed bytes
# (rustc reorders functions in the wasm, so synth numbers its LOCAL func_N symbols differently;
# .text, global symbols and relocation targets are byte-identical), the other six reproduced
# byte-for-byte (switch-thin by its wasm code sections, the rest by full rebuild).
# They carry no stale_ lines and read `recorded-fresh (not rebuilt)`: the gate trusts the
# record and cross-checks it against git dates, it does not rebuild. 8 remain known-stale,
# each with its reason in a comment: breadth and os-{time,tl,ts} (no builder can produce them
# on either pin; #506), and adc/can/dac/gpio-thin (rebuilt but held back by synth#1746).
# Their records were re-taken at the 2026.11.7 pin and the current inputs; the bytes are the
# old ones. Clearing one = rebuild it, re-validate, replace its four freshness lines with the
# freshness-record output, and drop its two stale_ lines.
#
# DEADLINE: the 8 expire 2027-01-31. From 2027-02-01 UTC this required check FAILS EVERY PR
# until they are rebuilt and re-validated on silicon, or the date is re-decided here.
# The gate prints a ::warning:: from 21 days before the earliest expiry.

