# Gale-specific schema extensions for source provenance tracking.
#
# Adds a source-provenance artifact type that pins the exact upstream C files
# being replaced, with checksums and version info.  This is the auditable
# anchor proving "this is exactly what we replaced".

schema:
  name: gale
  version: "0.1.0"
  extends: [common, aspice]
  description: >
    Extensions for formally verified Rust kernel porting.
    Adds source provenance tracking for ASIL-D audit trail.

artifact-types:
  - name: finding
    description: >
      Research finding or gap analysis result that may generate requirements
      or inform design decisions. Not part of the ASPICE V-model — tracked
      separately for audit trail and decision rationale.
    fields:
      - name: source
        type: string
        required: false
        description: Source of the finding (paper, program, analysis)
      - name: relevance
        type: string
        required: false
        allowed-values: [critical, high, medium, low]
        description: Relevance to the project
      - name: action-required
        type: boolean
        required: false
        description: Whether this finding requires action
    link-fields: []

  - name: documentation
    description: >
      Upstream document structure (sections, text blocks) imported from ReqIF.
      Not requirements — kept for context and traceability completeness.
    fields: []
    link-fields: []

  - name: source-provenance
    description: >
      Pins an upstream source file being replaced.  Records the exact file path,
      version, checksum, and the corresponding Gale Rust file that replaces it.
      This is the root of the traceability chain — every requirement ultimately
      traces back to a provenance record proving what original code is replaced.
    fields:
      - name: upstream-project
        type: string
        required: true
        description: Name of the upstream project (e.g. "zephyr")
      - name: upstream-version
        type: string
        required: true
        description: Exact version string of the upstream source
      - name: upstream-file
        type: string
        required: true
        description: Path within the upstream source tree
      - name: upstream-sha256
        type: string
        required: true
        description: SHA-256 checksum of the upstream file
      - name: upstream-lines
        type: number
        required: false
        description: Total line count of the upstream file
      - name: upstream-functions
        type: list<string>
        required: false
        description: Specific C functions being ported from this file
      - name: gale-file
        type: string
        required: true
        description: Corresponding Gale Rust source file
      - name: gale-module
        type: string
        required: false
        description: Rust module path
      - name: scope
        type: string
        required: false
        allowed-values: [full-file, partial-functions, struct-definition]
        description: Whether we port the entire file or specific functions
    link-fields: []

  - name: criticality-assignment
    description: >
      Assigns a criticality level to one architecture element ON one deployment
      target, and is what makes coexistence decidable: two elements COEXIST when
      they carry assignments naming the same target. Without this, "which
      elements share a part" is a question the artifact store cannot answer, and
      a freedom-from-interference argument has nothing to be an argument about.
      (REQ-OS-CRITICALITY-001, gale#423.)
    fields:
      - name: element
        type: string
        required: true
        description: >
          Id of the architecture element this assigns a criticality to
          (normally a sw-arch-component).
      - name: criticality
        type: string
        required: true
        allowed-values: [ASIL-D, ASIL-C, ASIL-B, ASIL-A, QM]
        description: >
          ISO 26262 criticality of the element AS DEPLOYED on this target. QM is
          a real value, not the absence of one — an element with no assignment is
          unclassified, which is a different and worse state.
      - name: target
        type: string
        required: true
        description: >
          The deployment this assignment is about, e.g. a board id from the
          target model. Elements sharing a target coexist and therefore owe each
          other an interference argument.
      - name: decomposed-from
        type: string
        required: false
        description: >
          Set when this criticality was reached by ISO 26262 ASIL decomposition
          rather than assigned directly. Names the requirement whose ASIL was
          decomposed; the independence claim the decomposition rests on belongs
          in that requirement, not here.
    link-fields: []

  - name: ffi-argument
    description: >
      The freedom-from-interference argument for ONE ordered pair of coexisting
      elements, across all three ISO 26262 interference classes (Part 6 Annex D,
      Part 9 Clause 6). Ordered because interference is not symmetric: that a QM
      element cannot disturb an ASIL-D one is the claim that matters, and the
      converse is usually uninteresting.

      Each class records a DISPOSITION rather than a yes/no, because "prevented"
      and "detected and handled" are different arguments with different evidence,
      and "accepted" is a legitimate answer that must be visible rather than
      implied by silence.
    fields:
      - name: from-element
        type: string
        required: true
        description: The potentially-interfering element (usually the lower criticality).
      - name: to-element
        type: string
        required: true
        description: The element that must be protected.
      - name: target
        type: string
        required: true
        description: The deployment both elements are assigned to.
      - name: spatial
        type: string
        required: true
        allowed-values: [prevented-by-construction, detected-and-handled, accepted-with-rationale, open]
        description: Memory interference — one element corrupting another's state.
      - name: temporal
        type: string
        required: true
        allowed-values: [prevented-by-construction, detected-and-handled, accepted-with-rationale, open]
        description: Execution-time interference — starvation, blocking, budget overrun.
      - name: information
        type: string
        required: true
        allowed-values: [prevented-by-construction, detected-and-handled, accepted-with-rationale, open]
        description: >
          Exchange of information — corruption, loss, repetition, insertion,
          resequencing, delay, blocking, masquerade across a channel the two
          elements deliberately share.
      - name: construction
        type: string
        required: false
        description: >
          Required in substance wherever a class is prevented-by-construction:
          NAME the construction (the canonical-ABI copy, the per-instance handle
          table, an MPU region marked UNPRIV_NONE, a static port topology).
          "Prevented by construction" without a named construction is an
          assertion, and the mechanism it appeals to usually prevents something
          adjacent to the failure mode rather than the failure mode itself.
    link-fields: []

link-types:
  - name: informs
    inverse: informed-by
    description: >
      A finding or analysis informs a requirement or design decision.
      Non-normative link for rationale traceability.

  - name: generates
    inverse: generated-by
    description: >
      A finding generates a derived requirement. Indicates the requirement
      was created as a result of the finding.

  - name: related-to
    inverse: related-to
    description: >
      General association between artifacts. Used when the relationship
      is informational rather than structural.

  - name: replaces
    inverse: replaced-by
    description: >
      Gale artifact replaces the upstream source identified by the target
      provenance record.  This is the fundamental porting relationship.

  - name: function-maps-to
    inverse: function-mapped-from
    description: >
      A detailed design element maps to a specific C function in the
      upstream source.  Used for line-level traceability.

  - name: allocated-from
    inverse: allocated-to
    description: >
      Architecture component is allocated from a requirement.
      Inverse of allocated-to — used on the architecture side to point
      back to the requirement(s) that drove the component's creation.

  - name: satisfied-by
    inverse: satisfies
    description: >
      Upstream or system requirement is satisfied by a lower-level artifact.
      Inverse of satisfies — used on the requirement side to record which
      SW requirements or design elements fulfil it.

  - name: enables
    inverse: enabled-by
    description: >
      An architecture component or platform enables a requirement or capability.
      Used for test targets that enable verification of specific requirements.

  - name: verified-on
    inverse: verification-target-of
    description: >
      A requirement or verification measure is verified on a specific
      architecture target (e.g. a Renode emulation platform).

traceability-rules:
  - name: sw-req-has-provenance
    description: Every SW requirement should trace to a source provenance record
    source-type: sw-req
    required-link: derives-from
    target-types: [source-provenance, system-req]
    severity: warning
