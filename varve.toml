# gale's toolchain pin. See docs/toolchain-pin.md for why, and for the
# reproducibility evidence behind adopting this particular layer.
manifest-version = 1

[toolchain]
realm   = "covalent"
channel = "rolling"
# covalent 2026.11.1 composes pulseengine 2026.10.35 (the previous pin, unchanged:
# meld 0.66.0, synth 0.89.0, loom 1.4.1, rivet 0.41.1, ...) with pulseengine-wasm
# 2026.10.6, which adds wasm-tools 1.263.0. Before this, wasm-tools came from
# `cargo install --version 1.245.1` in 9 CI steps and from whatever was on PATH
# locally, and no gate compared the two. CI's WASM_TOOLS_VERSION now moves with
# this pin, and pin-agreement checks it. 2026.10.35 was the last layer of the
# 2026.10 line; covalent 2026.11.7 (pulseengine 2026.11.14: synth 0.90.0,
# meld 0.67.0) is the next candidate. Every composed digest is verified against
# its realm's root by `varve install`.
layer   = "2026.11.1"
digest  = "sha256:3d7db8f10601a680dde55a0309d2e2ee611aedaecef19e5f474ccf07a414d315"
