# Standalone (not part of the gust workspace) — built ad-hoc for wasm32 + dissolve.
# gust-OS v0.3.0 driver breadth: hardware timer as a verified thin-seam driver.
[workspace]

[package]
name = "gust-timer-thin"
version = "0.1.0"
edition = "2021"
description = "gust:hal thin-seam hardware-timer driver — STM32 timer config + wrap-safe deadline math in verified wasm, importing only the generic mmio capability"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# REQ-DRV-COMPONENT-001: the gust:hal/mmio capability arrives as a WIT-typed
# component import instead of a raw `env` extern. `macros` only — the default
# features pull in `std`.
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
