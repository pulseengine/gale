# Standalone (not part of the gust workspace) — built ad-hoc for wasm32 + dissolve.
[workspace]

[package]
name = "gust-uart-thin"
version = "0.1.0"
edition = "2021"
description = "gust:hal thin-seam UART driver — the entire STM32 USART protocol in verified wasm, importing only the generic mmio/irq capabilities"

[lib]
# cdylib for the wasm32 dissolve target; rlib so Kani can model-check the pure
# decision logic (cargo kani) — the driver's verifiable core, gale-style.
crate-type = ["cdylib", "rlib"]

[dependencies]
# REQ-DRV-COMPONENT-001: the gust:hal/mmio + gust:hal/irq capabilities arrive as
# WIT-typed component imports instead of raw `env` externs. `macros` only — the
# default features pull in `std`.
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
