[workspace]
[package]
name = "gust-hm-thin"
version = "0.1.0"
edition = "2021"
description = "T2 stage 2: the Verus/Kani-verified Health-Monitor value-domain predicates as a dissolvable wasm component. Bodies lifted VERBATIM from plain/src/health_monitor.rs. Zero seams, zero SRAM \u2014 the cheapest proof that the isolation core can move onto the dissolve path (REQ-OS-OBJVERIFY-001)."
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
