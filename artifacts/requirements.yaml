  - id: REQ-CI-SIEVE-002
    type: sw-req
    title: CI runs only the pinned sieve, installed by sha256 values checked with cosign, and the pin agrees with itself
    status: implemented
    description: "sieve is not in the varve layer gale pins (covalent 2026.11.7, frozen for v0.11.0; the layer entry for sieve is pending), so CI installs it from its GitHub release through .github/actions/setup-sieve. SHALL: (1) before a sha256 is copied into the action, the release's SHA256SUMS.txt is verified with `cosign verify-blob --certificate-identity-regexp '^https://github.com/pulseengine/sieve/.github/workflows/release.yml@refs/tags/v.*$' --certificate-oidc-issuer https://token.actions.githubusercontent.com --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt` (docs/ci/sieve.md); (2) the action pins SIEVE_VERSION (an exact X.Y.Z that its step name repeats) and one sha256 per architecture (x86_64 and aarch64 linux-musl, 64 lowercase hex, different from each other), checks the archive with sha256sum -c, checks the binary's own `--version`, and puts it on PATH, with no `if:` or `continue-on-error:`; (3) the action from `runs:` on equals a canonical text held in the gate, line for line after dropping blank and comment-only lines (only the version and the two sha256 values may vary), so a required line that is present but neutralised (`|| true` on the sha256 check, a reassigned sha, `set +e`, a dropped `exit 1`) fails; (4) every workflow job that runs sieve, or temper's gate probe (which runs sieve through tools/ci/sieve-gate-probe.sh), runs the action and, as its very next step, \"Pinned sieve is the one on PATH\", before the first use; (5) no other workflow or action downloads a sieve release; (6) every job running `sieve classify --base` checks out with fetch-depth 0 or at least 2; (7) every classifier job runs exactly `sieve classify --config sieve.toml --base \"$BASE_SHA\" --event \"$EVENT_NAME\" --format github-output --record \"$RUNNER_TEMP/sieve-verdict.json\"`, and its very next step is a SHA-pinned actions/upload-artifact step named sieve-verdict-<workflow>-<job>-${{ github.run_attempt }} with path ${{ runner.temp }}/sieve-verdict.json, if-no-files-found: error and retention-days: 90, whose only allowed `if:` is always() and which has no continue-on-error (so nothing can overwrite the record between the call and the upload); (8) the required job \"every required context can actually report\" keeps the steps `sieve check-workflows --config sieve.toml`, `sieve check-graph --config sieve.toml`, `cargo xtask check sieve-pin --self-test` and `cargo xtask check sieve-pin`, exactly and unguarded. Enforced by `cargo xtask check sieve-pin`, in that required job. What it cannot see: that the pinned sha256 values are the release's real ones (that is step 1, done by hand at each bump), a job reaching sieve by another name, PATH changes inside a script or by a step added between the PATH check and the classify step of a classifier job, the content of a record (sieve writes it; there is no jq validation step), and a classifier job whose second checkout carries the history while the first is shallow (sieve then runs everything, which is safe). Kill criterion: a job runs a sieve that is not the pinned, sha256-checked one, the action's version and sha256 values disagree, or a classifier job stops recording or uploading its verdict."
