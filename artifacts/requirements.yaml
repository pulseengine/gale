  - id: REQ-SUPPLY-LOCKFILE-002
    type: sw-req
    title: Every manifest has a committed lock, every lock is current, and CI builds with it locked
    status: implemented
    description: "Raised by gale#534 (owner, 2026-11-20). Auditing the committed locks (REQ-SUPPLY-LOCKFILE-001) is worth nothing for a manifest that has no lock, or for a build that ignores the lock: none of the 76 lines in .github/workflows that invoke cargo build/test/clippy/check/run/kani/llvm-cov/fuzz/rustc/xtask, and none of the 41 such lines in tracked shell scripts, passed --locked or --frozen, six tracked Cargo.toml had no lock at all, the root MODULE.bazel.lock was ignored by .gitignore (force-added) and no Bazel invocation set --lockfile_mode. SHALL: (1) every Cargo.toml git tracks is covered by a committed Cargo.lock, its own or that of the workspace root that claims it (members globs minus exclude, or package.workspace), and every tracked MODULE.bazel has a committed MODULE.bazel.lock beside it; otherwise the manifest is listed in tools/xtask/lockfile-census.toml with an issue and a reason. An unlisted lock-free manifest, a STALE listing (the manifest gained a lock or is gone), a duplicated, malformed or wildcard listing, a lock with no manifest beside it, and a workspace member's own (ignored) lock each fail. (2) Every committed lock is current: `cargo metadata --locked` (with dependency resolution; --no-deps does not check the lock) succeeds in each Cargo.lock's directory, and `bazel mod deps --lockfile_mode=error` succeeds beside each committed MODULE.bazel.lock. (3) CI builds locked: cargo build/test/clippy/check/run/llvm-cov/rustc invocations in .github/workflows and in the scripts CI runs pass --locked where the crate has a committed lock (the `cargo xtask` alias carries it), and every root-module Bazel invocation runs with --lockfile_mode=error (`common --lockfile_mode=error` in the root .bazelrc, owner decision 2026-11-20, fleet-wide). Because crate_universe reads tools/verus-strip/Cargo.lock, a change to that lock that does not regenerate MODULE.bazel.lock in the same change fails. Where a tool has no such flag (cargo kani, cargo fuzz), (2) is what keeps the build on the audited lock. The gate (`cargo xtask check lockfile-census`, supply-chain.yml) REFUSES when cargo or bazel is missing or no Cargo.toml is tracked. Kill criterion: a manifest without a committed lock or a listed reason merges, or a lock that no longer satisfies its manifest merges."
    tags: [supply-chain, lockfile, ci, gate, gale#534]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: "`cargo xtask check lockfile-census --self-test` passes in supply-chain.yml on every PR; its plants fail on (i) a Cargo.lock whose manifest requires a dependency version the lock lacks, (ii) an unlisted lock-free Cargo.toml, (iii) a listing for a manifest that has a lock and one for a manifest that is gone, (iv) a MODULE.bazel with neither lock nor listing, and (v) a MODULE.bazel.lock missing a declared bazel_dep (real bazel, --lockfile_mode=error); and pass on current locks and on a listed lock-free crate. `cargo xtask check lockfile-census` passes on main."
    links:
      - type: derives-from
        target: SYSREQ-BYOOS-001
      - type: traces-to
        target: REQ-SUPPLY-LOCKFILE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-20T18:00:00Z

