  - id: REQ-CI-SIEVE-001
    type: sw-req
    title: A heavy CI job skips only through sieve's fail-open classifier, and the proof jobs never skip
    status: implemented
    description: "Raised by gale#294 and lane L17 (2026-11-22). gale decided which heavy jobs a PR runs with three hand-written detectors: tools/ci/detect-changes.sh (docs-only, in coverage, gust-renode, llvm-lto and zephyr-tests), a path regex in the required \"V-closure needed?\" job, and a step-level guard inside the drv-cross-arch job; \"proofs needed?\" step-skipped Verus, Kani, Rocq and Lean. SHALL: (1) the decision is made by sieve (pulseengine's shared CI path classifier, v0.4.3 since lane L18, which first pinned 0.4.2; v0.4.0 at the switch) from sieve.toml, whose classes are `code` (false only on a docs-only change), `cross_arch` and `v_closure`; (2) a required job is skipped only by a job-level `if:` of exactly the form `!cancelled() && (needs.<C>.result != 'success' || needs.<C>.outputs.<class> != 'false')`, with <C> the one job running `sieve classify --config sieve.toml --base \"$BASE_SHA\" --event \"$EVENT_NAME\" --format github-output --record \"$RUNNER_TEMP/sieve-verdict.json\"`, so a failed, cancelled or silent classifier runs the job, and a skipped job still reports its context; (3) everything runs on any event but pull_request (push, merge_group, schedule; gating on push stays `--event push`), with no base, on a failed or empty diff, on a path no class claims, and on a change to .github/** (except a scoped leaf-workflow edit, REQ-CI-SIEVE-003), tools/**, bzl/**, sieve.toml, any Cargo.lock (nested ones included), or a toolchain or Bazel file; (4) the proof jobs (Verus SMT, Kani BMC, Rocq Proofs, Lean Proofs, and Kani BMC (driver crates), which L11 added outside the required contexts) and \"proofs needed?\" never skip (owner, 2026-11-20): they are sieve.toml `[workflows] never_skip_jobs`, carry no `if:` beyond always()/!cancelled(), no step-level skip and no skippable `needs:`; (5) no workflow that hosts a required context has a `paths:` filter on any trigger (sieve v0.4.0 gate a refuses `push: paths:` too), and each also triggers on merge_group; (6) the required context names in .github/required-contexts.txt are unchanged (\"proofs needed?\" and \"V-closure needed?\" still report); (7) every job running `sieve classify --base` checks out with fetch-depth 0 or at least 2, so the merge base and head are readable (a shallow checkout silently runs everything); (8) the verdict of record is each classifier job's own `--record` JSON, uploaded by the job's very next step as `sieve-verdict-<workflow>-<job>-<run_attempt>` (90 days, if-no-files-found: error). On a pull request it is the verdict that skipped jobs; push and merge_group records say run_all, which is correct for gating. sieve writes the record before its outputs and exits 2 with no output if it cannot, so a lost record runs every gated job. Misses are counted later by a follow-up (docs/ci/sieve.md), not in L17: it compares a PR's last records with the push run on main after the merge (gale has no merge queue, so that run runs everything); a commit with no PR record is uncompared, never \"no miss\". Enforced by `sieve check-workflows` (gates a-d plus never_skip_jobs), `sieve check-graph` and `cargo xtask check sieve-pin`, all in the required job \"every required context can actually report\". The switch was gated by equivalence: over gale's last 400 first-parent commits to a0e9d47c, sieve selected nothing less than any old detector it replaced. The independent false-skip controls live in pulseengine/plant, not here. Kill criterion: a required job is skipped on a PR by anything other than the classifier form, a proof job is skipped, or a change to a class's input skips that class's job."
    tags: [ci, sieve, gate, gale#294]
    fields:
      priority: must
