    title: A job-body edit to one workflow selects only its jobs' classes, and every other .github/ edit still runs everything
    status: implemented
    description: "Raised by lane L18 (2026-11-22). jig's offline replay of gale's last 80 merged PRs found 75 ran everything, most because any .github/ edit selects every class. SHALL: (1) sieve.toml sets `[workflows] scope_leaf_edits = true` (sieve REQ-030/035/036; pinned sieve v0.4.3, first enabled on v0.4.2), held by `cargo xtask check sieve-pin`; (2) every gating job `if:` is exactly the classifier form `${{ !cancelled() && (needs.<C>.result != 'success' || needs.<C>.outputs.<o> != 'false') }}`, so no job carries a merge_group or other extra term; (3) no step `if:` reads a context other than github or runner, and no `run:`, `env:` or `with:` text contains the word `needs`. The second half was a workaround for sieve#37 (0.4.2 read the bare word as a `needs` read); 0.4.3 reads `needs` only inside `${{ }}` or an `if:` value and no longer requires it, and the reworded comments stay; (4) proofs never skip (REQ-CI-SIEVE-001 (4)), the 24 required context names and .github/required-contexts.txt are unchanged, and every classifier job keeps fetch-depth 0 and its --record upload; (5) a change outside `jobs:`, to a job's `if:`/`needs:`/`outputs:`/`strategy:`/`continue-on-error:` or a step `if:`, to a job running `sieve classify`, to any other .github/ path, and any edit without the merge-base blob runs everything. Known blocker, recorded not hidden, still open under sieve 0.4.3: five Renode workflows call `uses: ./gale/.github/actions/setup-renode` under a `path: gale` checkout. sieve's repository-wide linter scan could not resolve it in 0.4.2. 0.4.3 (sieve#36) resolves `./<p>/` through a plain same-repository `path: <p>` checkout unless a later step rewrites `<p>`, but its rewrite check fires on the bare word `gale` anywhere in a `run:` script (a comment `(gale#289)`, a read-only grep of the zephyr fork pin, the GALE_ROOT builds; measured by deleting steps from a scratch copy), so all five still refuse and on this tree every scoped edit still runs everything (safe; no saving). It ends when sieve's rewrite check counts only write-like commands on the path, or an owner moves those checkouts to the workspace root (docs/ci/sieve.md)."
