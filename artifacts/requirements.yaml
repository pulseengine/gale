der, 0 narrower, exit 0; against the Python reference classify-changes.py (4050000f, with its tools/ci/inputs-bazel.json, Python 3.12), all five heavy-job outputs mapped to code in one run (`--map` is a union in 0.4.0) with cross_arch compared too, 400/400, 371 identical, 29 wider, 0 narrower, exit 0. Earlier, under 0.3.0, the five reference outputs were run one map at a time (wider 40/40/44/33/44, 0 narrower each). A first reference run narrowed cross_arch on 2 commits changing os/gust/Cargo.lock (sieve's nested-lock scoping, sieve REQ-027); sieve.toml keeps every Cargo.lock run-all and the narrowing disappeared. Replaying the last 80 merged PRs found PRs that ran everything only for a path no class claimed: drivers/dma-own (its own workspace, which no class root reached; os/gust/build.rs links only its committed object) is now a `code` Cargo root, and drivers/CROSS-ARCH.md (named by the cross-arch scripts) is claimed by `code`. README.md, docs/safety/verification-honesty.md, docs/architecture/three-modes-two-axes.md and docs/releases/v0.11.0-plan.md stay unclaimed (run everything): nothing reads them, but claiming them in `code` narrowed cross_arch on 4 of 400 commits against the Python reference (measured), and [inert] would narrow `code` against detect-changes.sh and the reference; that choice is the owner's. Paths under gust's pre-rework location are history only; no class root points there. Every job running `sieve classify --base` checks out with fetch-depth 0: in a full clone a normal PR diff classifies with reason null; in a depth-1 clone the same call runs everything with \"git diff failed against <base>\" (measured). Planted on the real tree: a classifier `if:` on the Verus job -> exit 1 (never-skip-if); `paths:` on coverage.yml's pull_request -> exit 1 (paths-filter); `paths:` on rivet-v-closure.yml's push trigger -> exit 1 under 0.4.0 (it was exit 0 under 0.3.0); the old docs-only `if:` form -> exit 1 (if-form); `|| true` on a classify call -> exit 1. The `--record` behaviour was measured on sieve PR #26 (30b587ee, the change released as 0.4.0): the record is valid sieve.classify.v1 with every class and the explain block; an unwritable record path exits 2 and writes no output. temper's gate probe runs sieve on its controls, now one positive and one negative control per class (exit 0; with the cross_arch claim dropped, exit 1). tools/check-required-contexts.py against the live branch protection: PASS, 24 contexts match. Not verified here: the runtime if-no-files-found: error (no Actions runner locally), the observe follow-up (not built), and false-skip controls independent of sieve's own graph (pulseengine/plant)."
