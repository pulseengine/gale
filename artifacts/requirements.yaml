      verification-criteria: "`sieve check-workflows --config sieve.toml` and `sieve check-graph --config sieve.toml` exit 0 in the required job \"every required context can actually report\" on every PR; planted on the real tree, a classifier `if:` on the Verus job, a `paths:` on coverage.yml's pull_request trigger, a `paths:` on rivet-v-closure.yml's push trigger and the old `if:` form without the result term each make check-workflows exit 1; sieve.toml, a workflow, the setup-sieve action, the root and a nested Cargo.lock each classify as run_all; `sieve equivalence` over 400 commits shows 0 narrower against every replaced detector."
