e doc now describes the file instead, and #537 scopes to no class (measured on a scratch commit of the final tree). Equivalence (sieve 0.4.3, scoping on, 400 commits to f0ac6e3e): detect-changes.sh 400/400 compared, 400 identical, 0 narrower, exit 0; Python reference union (code, cross_arch) 400/400, 371 identical, 29 wider, 0 narrower, exit 0 (`--paths` mode, so scoping is not exercised there). Earlier, sieve 0.4.2, git mode, scratch commit objects only. Safety plants on the L18 tree with the five `./gale/` uses simulated resolvable (on the real tree every row runs everything for the blocker reason): (a) a step added to rust-coverage -> [code], cross-arch -> [cross_arch], v-closure -> [v_closure], zephyr-test (matrix) -> [code], the Verus proof job -> no class (proofs run unconditionally); (b) rust-coverage `if:` gaining a term, `needs:` gaining an entry, gaining `outputs:`, and a step `if:` changed -> run_all each; (c) coverage.yml `concurrency` and drv-cross-arch.yml top-level `env` changed -> run_all each; (d) a step added to coverage.yml's and rivet-v-closure.yml's classifier jobs -> run_all each; (e) the plant (a) commit in a depth-1 clone -> run_all (`git diff failed against <base>`), in a depth-2 clone -> [code], in a blob:none clone whose promisor is unreachable -> run_all (`cannot read ... at the merge base`); a shallow or blobless checkout surfaces only as the verdict of record's reason, never as a red check; (f) the same plant with scope_leaf_edits removed or false -> run_all. sieve-pin: 75/75 self-test (L1-L5 plants on the leaf line), real tree PASS, real tree without the line FAIL exit 1. Per-job probe (one step inserted in each of 82 jobs): 0/82 scoped on the real tree, 74/82 with `./gale/` simulated (the 8 left: 6 classifier jobs, gustos-publish's 2 jobs behind its tag/dispatch `if:`). Historical replay of the last 80 merged PRs (jig's method: one classify per PR, today's config and tree, old workflow blobs, no merge_group or push runs): run_all 75 a