  - id: REQ-SUPPLY-TOOLCHAIN-001
    type: sw-req
    title: The repo's toolchain file and every Rust toolchain CI installs by name is an exact release or a dated nightly, on a SHA-pinned action
    status: implemented
    description: "Fleet rule (2026-11): every repo names exact Rust 1.100.0 in rust-toolchain.toml and in every workflow, on a SHA-pinned toolchain action. Before it, rust-toolchain.toml said `channel = \"stable\"`, 24 of the 32 steps using the Rust toolchain install action named no `toolchain:` (taking the action branch's default), the other 8 said `toolchain: stable`, 17 rustup-init installs used `--default-toolchain stable`, the fuzz and sanitizer jobs ran `cargo +nightly` (undated), 12 kill-criteria jobs had no toolchain step at all (cargo resolved the file through rustup's auto-install), and coverage.yml's step carried `# nightly` on a SHA from the action's stable branch -- it had installed stable all along. A floating stable is an input that moves under a fixed pin set: 1.99.0 changed which gust:os providers keep a __stack_pointer global with no commit in this repo (gale#434). SHALL, over .github/workflows/*.y(a)ml, every .github/actions/**/action.y(a)ml and the repository's toolchain files: (a) the root rust-toolchain.toml's `channel` key (exact key, once) is an exact X.Y.Z and it sets no `path`; no legacy `rust-toolchain` file at the root and no rust-toolchain(.toml) anywhere else; (b) every step using the action has exactly one `with: toolchain:` (block or flow map); (c) that value is an exact X.Y.Z or a dated <channel>-YYYY-MM-DD, never bare stable/nightly/beta, X.Y, a variable or an expression; (d) the action ref is a 40-hex commit SHA; (e) a trailing comment on the `uses:` line names exactly the installed toolchain and no other toolchain-like word; (f) an exact release there equals the rust-toolchain.toml channel; (g) in shell (tokenised on separators and quotes, continuations joined, comments dropped) `+<tc>` after cargo/rustc/rustfmt/rustdoc/rustup/cargo-clippy/clippy-driver, every name given to rustup default/run/override set/install/update/toolchain install|add|update, `--toolchain`, `--default-toolchain` and `RUSTUP_TOOLCHAIN=` obey (c), and a rustup-init run without --default-toolchain fails; (h) any YAML `toolchain:` or `RUSTUP_TOOLCHAIN:` key obeys (c); (i) a `rust` container image carries an X.Y.Z tag. The gate (`cargo xtask check toolchain-pin`) runs in supply-chain.yml's `cargo-deny (advisories, bans, licenses, sources)` job, a required context since #539, so a violation blocks the merge. It REFUSES on zero workflows, on a file naming the action on more lines than it parsed steps (anchor, alias, block scalar, flow layout), and on a clean tree with no step using the action. Out of scope (the gate's CANNOT_SEE): scripts a workflow runs, the inside of reusable workflows in other repositories, other install actions beyond their `toolchain:` input, images other than `rust` and runner-preinstalled toolchains, values behind variables or expressions (failed, not resolved), MODULE.bazel's rules_rust toolchain (1.85.0) for Bazel builds, Kani's own nightly (pinned only through `cargo install --locked kani-verifier --version 0.68.0`), and RUSTC_BOOTSTRAP. Kill criterion: a workflow step that installs a floating or unnamed Rust toolchain merges."
    tags: [supply-chain, toolchain, ci, gate]
    fields:
