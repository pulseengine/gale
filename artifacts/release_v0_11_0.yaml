  - id: VER-OS-UNPRIV-001
    type: sw-verification
    title: "Four-arm unprivileged-tenant result: both escapes fault, control A and control B land as specified"
    status: proposed
    release: v0.11.0
    description: "Serves O1 (precondition; gale-local proxy, not the O1 indicator). Bet 1 of the v0.11.0 plan (docs/releases/v0.11.0-plan.md). Oracle, planned and not built: cargo xtask silicon run <board> gust_tenant_unpriv on WB55RG and G474RE (WL55JC1 is a stretch row; if not run it is published as a failure, not omitted). Protected arm: tenant at CONTROL.nPRIV=1, regions programmed; a write to MPU_CTRL and a write to a supervisor-private RAM address must both fault. Control A (no-drop-priv): tenant privileged, regions programmed; both writes land. Control B (no-regions): tenant unprivileged, private region not programmed; the MPU_CTRL write faults and the private-RAM write lands (without this arm an unprogrammed MPU passes the first escape). PASS per escape: the fault handler ran with the expected fault address, CONTROL read back as 1, and privileged code read the target value back unchanged; a fault with a changed value is FAIL. The existing gust_iso_unpriv_probe is kept as the recorded privileged-escape control in the same matrix run. Kill criteria: 1(a) an escape lands in the protected arm and is not fixed by the 2026.12 layer, bet failed and no tag; 1(b) by 2026-11-28 a link-map check shows the two-domain image does not fit the G474's 96 KiB, the claim narrows to WB55 and the G474 row is published as a failure. NOT SHOWN: isolation between two tenants, temporal or information isolation, the absence of other escape paths; F100 has no MPU and G031K8's ARMv6-M PMSA cannot distinguish the modes. That the hardware honours the permission bits is an architectural assumption, discharged per board by these arms only."
    tags: [release, v0.11.0, gust, isolation, mpu, silicon]
    fields:
