  - id: REQ-HONESTY-LEDGER-001
    type: sw-req
    title: The trust ledger counts the assumption spellings it can see, is a required check, and after its baseline may only shrink
    status: proposed
    release: v0.11.0
    description: "Serves O3 (eligibility: makes gale eligible to be counted by an O3 indicator script; O3 stays unmeasured and whether gale counts is the script's decision). Bet 3 of the v0.11.0 plan (docs/releases/v0.11.0-plan.md). SHALL: cargo xtask check trust-ledger is a required context counting, per class: external_body (135 today), assume_specification (2), Rocq Admitted (74), Lean sorry (0), kani::assume (grep baseline 422 lines in 22 files) and #[kani::unwind] (74), against 496 kani::proof lines. It counts SPELLINGS: it cannot see assumptions written as narrowed types, requires clauses or bounded generators, and says so in its output. RATCHET: until the baseline is set the gate is an equality ledger (any change in any class fails unless the same change updates the ledger with the justifying artifact ID); the baseline is set once at the v0.11.0 tag commit, after the unprivileged-tenant seam's growth has landed (at most 1 trusted atom), with the admitted growth recorded; from then on the gate is shrink-only and growth needs an owner-approved ledger entry. The ratchet is the planner's proposal and the owner can overrule it. Kill criteria: 3(a) the stability test cannot pass by 2026-12-03, so the gate stays advisory and is not made required; 3(c) not required by the 2026.12 layer, so dropped from v0.11.0 and carried to v0.12.0 by name."
    tags: [release, v0.11.0, honesty, tcb, ledger, kani, gate]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: cargo xtask check trust-ledger is a required context; its self-test fails on an added kani::assume, a lowered unwind bound, an added Admitted. and an unrecorded removal; the same tree after reformatting and after a comment-only edit gives the same counts; the output prints the forms it cannot see.
    links:
      - type: derives-from
        target: SYSREQ-COV-001
      - type: related-to
        target: REQ-HONESTY-TCB-001
      - type: related-to
        target: REQ-COV-002
      - type: related-to
        target: REQ-OS-TRITRACK-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T22:21:30Z

