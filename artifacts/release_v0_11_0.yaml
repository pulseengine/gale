        target: SYSREQ-BYOOS-001
      - type: related-to
        target: REQ-OS-UNPRIV-001
      - type: related-to
        target: REQ-OS-MPUSHIP-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T22:21:29Z

  - id: REQ-PIN-V0110-001
    type: sw-req
    title: The toolchain pin moves once, passes the four pre-flight checks, and is frozen until the tag
    status: proposed
    release: v0.11.0
    description: "Serves O1 (precondition; gale-local proxy, not the O1 indicator). Item 0 of the v0.11.0 plan (docs/releases/v0.11.0-plan.md), on the critical path and not a bet. gale pins covalent 2026.11.1 (synth 0.89.0, meld 0.66.0, loom 1.4.1). The unprivileged-tenant seam needs synth 0.89.1 or later (synth#1622, closed) and a loom that accepts (pagesize 1) memories (loom#457, open on 2026-11-19; fallback: dissolve the one image without the loom pass and report the size measured both ways). Recorded on synth 0.89.0 and not re-measured: 52 of 56 functions of the two-domain module dissolve (synth#1145 comment, 2026-10-29). SHALL: the pin moves once, the four pre-flight checks pass on the result, and the pin is then frozen until the v0.11.0 tag; a later layer goes to v0.12.0. Deadline: pin PR open by 2026-11-26; if the candidate fails any check on that date, the unprivileged-tenant bet is re-planned that day. Unverified input: the candidate layer was not installed in the planning pass. Which layer to move to is an open owner decision."
    tags: [release, v0.11.0, pin, varve, toolchain]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: "In a scratch varve root on the candidate layer: (1) the two-domain module dissolves with 0 declined functions; (2) every committed object is rebuilt and the object-freshness, data-overlap, graph-env and pin-agreement gates are green; (3) the Renode isolation gate is green on rebuilt fixtures; (4) no composite newly refuses under the synth 0.90 constant-address straddle check. After the move, no pin change before the tag."
    links:
      - type: derives-from
        target: SYSREQ-BYOOS-001
      - type: related-to
        target: REQ-OS-UNPRIV-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T22:21:30Z

  - id: REQ-OS-SYSCALL-SVC-001
    type: sw-req
    title: A tenant reaches gust:os only through one supervisor-call path, adding at most one trusted atom
    status: proposed
    release: v0.11.0
    description: "Serves O1 (precondition; gale-local proxy, not the O1 indicator). Bet 1 of the v0.11.0 plan (docs/releases/v0.11.0-plan.md). An unprivileged tenant SHALL reach the gust:os capabilities only through one supervisor-call path, and that path SHALL add at most 1 trusted atom beyond mpu-write. A trusted atom is counted mechanically, as stated in verification-criteria, so a third party can recount it. Kill criterion 1(c): more than 1 added atom at design review by 2026-12-03 stops the work and re-plans the seam. Main risk: the path is new privileged code that no existing proof covers; Verus and Kani cover the region table and the switch state machine, not this path."
    tags: [release, v0.11.0, gust, os, syscall, svc, tcb, isolation]
    fields:
      priority: must
      req-type: safety
      verification-criteria: "At design review, before code, by 2026-12-03: the count of trusted atoms the seam adds beyond mpu-write is 0 or 1. A trusted atom is an entry in the undefined-symbol set of the fused supervisor object that native privileged code supplies, plus each hand-written privileged function (assembly or unsafe Rust) on the supervisor-call path."
    links:
