  - id: REQ-REL-THESIS-V0110-001
    type: sw-req
    title: One image built from one signed component by digest runs its tenant unprivileged on a board (T1)
    status: proposed
    release: v0.11.0
    description: "Serves O1 (precondition; gale-local proxy, not the O1 indicator). T1, the single item that gates the v0.11.0 thesis (docs/releases/v0.11.0-plan.md): one image, built in the run from one signed component pinned by digest, runs its tenant unprivileged on a physical board; both escapes fault and both control arms show the escape landing. If T1 is not green there is no v0.11.0 tag, whatever else is green. Demonstrator scope: one tenant, tenant-to-supervisor direction only, at most 2 SoCs. No production, multi-tenant or certification claim. Time box: the 2026.12 varve layer. Kill criterion: an escape lands in the protected arm on any board and is not fixed by the 2026.12 layer."
    tags: [release, v0.11.0, thesis, gust, silicon, provenance, isolation]
    fields:
      priority: must
      req-type: functional
      verification-criteria: On WB55RG, one image built in the run from a signature-verified component pinned by digest returns PASS on the protected arm (both escapes fault, target values read back unchanged) and both control arms built from the same digest show the escape landing. A run without the component is REFUSED.
    links:
