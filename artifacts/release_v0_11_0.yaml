  - id: REQ-SILICON-PROVENANCE-001
    type: sw-req
    title: A silicon row that declares a component is built from that signed component by digest, or is refused
    status: proposed
    release: v0.11.0
    description: "Serves O1 (precondition; gale-local proxy, not the O1 indicator). Bet 2 of the v0.11.0 plan (docs/releases/v0.11.0-plan.md). SHALL: cargo xtask silicon run accepts --component <ref>@sha256:<digest>, pulls the published component, verifies its signature against the repository's workflow identity, dissolves and links it with the frozen pin, and flashes the result. A row that declares its component is REFUSED without one. Red today: tools/xtask/src/silicon.rs has 0 matches for cosign, OCI, digest or signature. Targets: 1 required row (T1, WB55RG) plus 4 targeted rows (the fused gust:os composite probe on F100, WL55JC1, WB55RG and G474RE). Kill criterion 2(b): by 2026-12-03 the published component cannot be dissolved for WB55 without edits that are not in the component; the bet is then re-scoped to one board's image and the notes say the many-targets claim is false as stated. NOT SHOWN: nothing on the target checks a signature; verification is on the build host before flashing. meld, loom and synth are trusted, not verified."
    tags: [release, v0.11.0, silicon, provenance, signing, supply-chain]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: "The xtask self-test, run in CI, refuses before flashing: a component with one byte changed; a valid signature from another identity; a declared row with no component. There is no fallback to a committed object."
