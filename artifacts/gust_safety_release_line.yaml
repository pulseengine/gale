  - id: FIND-OS-TIMER-SLEEP-CONTRACT-001
    type: finding
    title: "timer.sleep reports success for handles it cannot arm — the caller is told a wake was armed that will never fire"
    status: resolved
    release: v0.7.0
    tags: [gust, os, timer, contract, defect]
    links:
      - type: derives-from
        target: REQ-OS-COMPOSITE-EXEC-001
    description: >
      OBSERVED under execution (2026-08-06, gale#250), not by inspection. The
      gust:os/timer WIT contract specifies 0xFFFFFFFF for a handle that cannot be
      armed. Three cases return 0 (success) instead:
        timer.sleep(8, 10)          -> 0   (task id out of the 8-slot range)
        timer.sleep(0xDEADBEEF, 10) -> 0   (not a task id at all)
        timer.sleep(0, 10)          -> 0   where exec.state(0) is already done
      Tasks::set_deadline correctly no-ops in each case, so nothing is corrupted —
      the defect is the RETURN VALUE. The arm is silently lost and the caller has
      been told a wake is scheduled that will never fire. On a failsafe path that is
      the difference between a missed deadline that is detected and one that is not.
      SCOPE: this is a PROVIDER defect. gale#250 was an execution experiment over the
      composite and deliberately did not modify providers, so it was reported and not
      fixed. It is recorded here because a defect that lives only in a PR body is a
      defect nobody is tracking.
      CURRENTLY GATED BY COUNT, NOT BY ABSENCE: the CI step in gustos-publish.yml
      accepts the harness's exit 3 only while the deviation count is exactly 3, so a
      FOURTH deviation fails the build. That pins the blast radius; it does not fix
      these three.
      Kill-criterion for the fix: timer.sleep returns 0xFFFFFFFF for an out-of-range
      id, a non-id, and an already-done task, and the harness's deviation count drops
      to 0 — at which point the CI step's pinned count must drop with it.
      RESOLVED 2026-08-25. `timer.sleep` now asks `gust:sched/tasks.state` before
      arming and returns 0xFFFF_FFFF unless the slot is Pending — the same predicate
      `Tasks::set_deadline` applies internally, so no admission decision moved into
      the marshalling layer and NO WIT or verified-core change was needed (`state`
      already existed on the internal seam).
      KILL-CRITERION MET, all three legs:
        out-of-range (8), non-id (0xDEADBEEF), already-Done -> 0xFFFF_FFFF each
          (gust_osfused_probe on qemu lm3s6965evb: osfused-sleep-contract-ok)
        the VALID arm still works — state 0x1->0x2, armed=0, pending at +10,
          elapsed at +100 — which is what blocked an earlier attempt at this fix
        run-gustos-hostrun.sh deviation count 3 -> 0 (exit 3 -> exit 0), and the
          negative control still refutes the two-scheduler composite, so the
          harness is still a live gate
        the CI count-pin in gustos-publish.yml dropped with it: exit 3 is now a
          REGRESSION rather than a tracked state.

