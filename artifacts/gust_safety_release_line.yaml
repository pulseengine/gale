      and exactly one component instance owns the scheduler, checked by import
      routing across the unbundled core modules rather than by a source string.
      Both the residual-import gate and the one-scheduler gate are negative-tested —
      the former in-band on every run against a deliberately unwired composition,
      the latter against the pre-change providers, where it fires on all three
      signals. A gate that has not been observed to fail is not evidence.
      NOT covered here, and NOT to be read as covered: the component has never been
      EXECUTED — no wasm runtime, no dissolve of the composite, no hardware — so
      "one scheduler, one clock" is a structural property, not an observed one; the
      composite is not lowered to native, so its 20741 bytes are a wasm figure and
      imply nothing about code size, SRAM or cycles; and the publish half of
      DD-OS-DELIVERY-001 (cosign-signed OCI + wasm.directory, and a third party
      pulling the artifact and verifying its signature from a clean machine) has not
      happened at the time of writing. That step closes at tag; until an outside
      party can check the signature without us, the delivery claim is unevidenced.
