    type: sw-verification
    title: "RULE-VERIFY (per-rule) + BIN-VERIFY (binary-translation) zero-gap coverage report on the trusted object"
    method: formal-verification
    status: proposed
    release: v0.7.2
    description: >
      Evidence for REQ-OS-OBJVERIFY-001: a coverage report over the
