  # ==========================================================================
  # Track T3 — compositional schedulability (cross-cutting; gates v0.6.0+)
  # ==========================================================================

  - id: REQ-OS-SCHED-001
    type: sw-req
    title: "T3: machine-checked compositional schedulability — inner response time bounded against the outer supply"
    status: proposed
    release: v0.7.2
    description: >
      Cross-cutting track T3. The inner tickless cooperative executor's
      worst-case response time, running under the outer partition's
      periodic-resource supply bound (REQ-OS-SWITCH-001), SHALL be bounded
      by a MACHINE-CHECKED (Lean-verified) analysis, not a measured
      high-water-mark. This SHALL derive the standard periodic-resource
      supply-bound blackout as the inner tasks' effective release jitter,
      feed it into a Lean-verified jittered worst-case-response-time
      recurrence, add the cooperative non-preemptive blocking term for the
      inner executor's run-to-completion polling model, and cap total
      demand against the supply bound function — producing a
      machine-checked inner-response bound that is provably sound at every
      poll/await point, not merely observed sound over a finite set of
      test runs. This is strictly stronger than the DWT-based high-water-
      mark evidence the project has relied on to date.
      DEPENDENCY MAP (2026-08-26): T3 splits into a SUPPLY half and a DEMAND half,
      and only the supply half is actionable today.
      UPSTREAM IS DELIVERED. spar#331 closed COMPLETED and the code is on spar main:
      proofs/Proofs/Scheduling/ArincSupply.lean (0 sorry / 0 admit / 0 axiom) proves
      (a) the cooperative non-preemptive blocking term folds into the release jitter,
      so monotonicity and least-fixed-point convergence transfer to
      rtaStepJitteredBlocking, and (b) lsbf(Pi,Theta,t) = floor(Theta*(t-2*(Pi-Theta))/Pi)
      is monotone, with fallback_sound_of_supply_guarantee giving demand-vs-supply
      soundness CONDITIONAL on a SupplyGuarantee hypothesis.
      SUPPLY HALF -- GALE'S OBLIGATION, NOT SPAR'S, and independent of WCET. spar
      explicitly does NOT prove SupplyGuarantee (forall t, lsbf Pi Theta t <= sbf t);
      it is carried as a hypothesis and named as the partition scheduler's duty. gale
      has the material: MajorFrame in plain/src/partition_switch.rs maps onto the
      periodic resource with Pi = frame_len and Theta = the sum of budgets owned by a
      partition, and frame_inv (already Verus/Kani-proven) states the MAX_WINDOWS=4
      windows tile [0, frame_len) contiguously with no gap, no overlap and every
      budget > 0. Discharging SupplyGuarantee from frame_inv needs NO C_i.
      DEMAND HALF -- BLOCKED ON T4. The recurrence's C_i are exactly synth's
      per-function static WCET bounds: emit-wcet.sh's own header records the split as
      'reason=call -- bound is intra-procedural; composition is spar's job (T3,
      spar#331: WCRT recurrence consumes these as C_i)'. T4 currently bounds 3 of 31
      functions on the E2 composite, and its critical path is scry loop-bound
      inference (13 of 28 declines, 11 cascades behind them) -- routed as scry#144.
      So the demand-bound function cannot be instantiated over the shipped executor
      until T4 advances.
      THIRD BLOCKER, GALE-OWNED (gale#286): this requirement demands a MACHINE-CHECKED
      (Lean-verified) analysis, but NO workflow compiles gale's Lean. proofs/lean/ has
      7 files / 136 theorems / 0 sorry with lean_proof_test targets defined, and
      formal-verification.yml runs only verus, kani and rocq. The VER kill-criterion
      below ('the Lean proof fails to discharge') therefore cannot fire today.
      CORRECTION: an earlier reading of this line called T3 'the one triad item that is
      gale-actionable'. That was too broad -- only the supply half is.
      SUPPLY HALF DISCHARGED, UNCONDITIONALLY (2026-08-26, PR #292 + #295 + #297):
      proofs/lean/PartitionSupply.lean, 17 theorems, 0 sorry / 0 admit / 0 axiom /
      0 native_decide, CI-gated by the lean job on //proofs/lean:all.
        supplyGuarantee (Pi) (u) (s t) (hPi : 0 < Pi) :
          lsbf Pi (thetaEff Pi u) t <= supply Pi u s t
      No utilisation hypothesis: it holds for every Theta <= Pi.
      which IS the hypothesis spar's ArincSupply.lean carries and declines to prove.
      Two halves meet: supply_floor_strong (the static cyclic frame delivers
      floor(t/Pi)*Theta_eff PLUS what the partial frame cannot withhold, from ANY
      start) and lsbf_le_full_frames (those complete frames already dominate lsbf).
      The key step avoids a complete-residue-system bijection: sliding the window one
      tick drops a tick at the front and adds one at the back with the SAME
      frame-relative position, since (s + Pi) % Pi = s % Pi -- so full-frame supply
      cannot depend on phase. That is MajorFrame::check's tiling invariant doing the
      work.
      Theta is thetaEff THROUGHOUT, never the raw window budget.
      The utilisation bound is GONE. It was removed by proving lsbf_le_strong_floor
      (lsbf Pi Th t <= floor(t/Pi)*Th + (t%Pi - (Pi-Th)) for Th <= Pi), which had
      previously been recorded here as a numeric sweep and explicitly NOT as a proof.
      lsbf_le_full_frames remains genuinely FALSE above one half and the file keeps
      its machine-checked counterexample (Pi=5, Th=4, t=4): it killed the ROUTE
      (complete-frames-only), never the conclusion, and the two theorems are kept
      side by side to record exactly that.
      STILL OWED on the supply side, and NOT to be read as done:
        - a side condition Lean cannot discharge: Theta_eff = Theta - k assumes the
          three-atom switch sequence completes within ONE tick -- a WCET obligation on
          trusted native code, outside both BIN-VERIFY and MC/DC.
        - u is an abstract residue predicate; deriving it from a concrete MajorFrame
          table (partition_id/offset/budget) is not done.
      The DEMAND half is untouched and still needs T4's C_i, so this requirement stays
      proposed: VER-OS-SCHED-001 demands the WCRT recurrence instantiated against the
      SHIPPED executor, which this is not.
    tags: [gust, os, track-t3, schedulability, spar, lean, wcet, safety, gale63]
