  - id: REQ-DRV-SILICON-001
    type: sw-req
    title: Componentized drivers are re-observed on silicon against their pre-change baseline
    status: proposed
    description: "Split out of VER-DRV-COMPONENT-001, which conflated a static property with a hardware one. A componentized driver is not done when it composes; it is done when the object built from it has been OBSERVED driving hardware. The first four through the componentization axis (gpio, timer, spi, uart) were chosen for having pre-existing WIT contracts, which turned out to be exactly the four with NO silicon runner, so that migration was validating its output nowhere. Silicon runners exist for wdg (STM32G474 + STM32F100) and adc (F100). Those SHALL be componentized and re-run on hardware, with the observed effect compared against the pre-change baseline in silicon/RESULTS-wdg-*.md. A driver whose only gate is Renode or qemu SHALL say so rather than count as hardware-validated. Kill-criterion: a driver counted as silicon-validated whose only evidence is emulation."
    tags: [gust, driver, silicon, component-model]
