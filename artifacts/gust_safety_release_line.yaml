    title: Whole-graph env sweep over composed and fused objects, negative-tested
    status: implemented
    description: "Planned evidence for the graph clause. Extends check-driver-components.py past the 1:1 lowering it gates today: a sweep over every core module inside the composed and fused artifacts (the 9 currently listed as UNGATED), asserting none imports env, with a negative control that plants a pre-conversion module and MUST fail. Also decides dma-own: either its 3 TCB atoms become a typed WIT interface, or it is declared out of scope by name with the reason recorded. What the gate does today is report dma-own's state as an assertion so a change cannot pass silently, which is a ledger, not verification. LANDED 2026-09-04 (gale#346) as benches/gust/drivers/check-graph-env.py, wired as a job in kill-criteria.yml (unfiltered, so requirable). It sweeps the 5 committed composed/fused wasm artifacts and asserts no core module imports from module env; the census is over git ls-files rather than a filesystem glob, and sweep and census are rooted at the same tree so a new artifact beside the swept ones cannot escape. Negative control checks BOTH directions: a planted (import \"env\" \"mmio_read32\") must be caught AND a planted WIT-typed import must not be flagged, so the gate cannot pass by flagging everything. Result on main at a1b6137: 5 swept, 0 env, PASS — the property already held, so the gate prevents regression rather than fixing anything. Rule reads the import MODULE name, not symbol shape: an earlier sketch keyed on underscore-vs-hyphen, which is only one-way (a hyphen proves WIT-lowering since it cannot occur in a C identifier, but read32/write32/poll are WIT field names with none). STATUS IS implemented, NOT verified, and the missing piece is a decision rather than code: this artifact also undertook to decide dma-own, whose 3 raw env atoms (dma_barrier, dma_irq_poll, dma_program) sit in a 1:1 component that is not part of any composed graph the sweep covers. Whether dma-own is inside 'the graph' is a scope call the symbol table does not make."
    tags: [gust, driver, component-model, gate, graph]
