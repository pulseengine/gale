  # ==========================================================================
  # v0.5.0 — I-ISO core: verified MPU/MMU region-swap (THE KEYSTONE)
  # ==========================================================================

  - id: REQ-OS-ISO-001
    type: sw-req
    title: "I-ISO: the hardware memory-protection boundary is the SOLE isolation root of trust (the keystone)"
    status: verified
    release: v0.5.0
    description: >
      This is the release-line KEYSTONE (invariant I-ISO): the target's
      hardware memory-protection facility (an ARMv7-M/ARMv8-M MPU region
      table, an AArch64 MMU with exception-level separation, or a RISC-V
      PMP), programmed by the verified core on entry to a partition, SHALL
      be the sole isolation root of trust for the two-level partition model.
      The Component-Model / dissolve layer provides ergonomics and
      portability ONLY — it is never the isolation boundary. Concretely: the
      region-table + program_regions_on_switch SHALL be an mmio/scalar-FSM
      sliver (thin-seam discipline, no new TCB shape); the programmed
      regions SHALL be disjoint, SHALL cover exactly the partition granted
      to the entering component, and SHALL deny everything else
      (deny-by-default). Consequence: a synth/meld/loom miscompile can
      corrupt data only WITHIN the partition it targets, never across a
      partition boundary — because the boundary is enforced by hardware the
      compiler does not control. This is the first release in the line to
      deliver ANY isolation/safety evidence; everything shipped before it
      (the inner executor, the ten thin-seam drivers) is functional-only
      evidence (see the plan's two-column ledger). The ARMv7-M MPU
      instantiation lands first; the AArch64 MMU+EL path is scoped but not
      required for this release.
    tags: [gust, os, isolation, mpu, mmu, i-iso, keystone, safety, gale63]
    links:
      - type: derives-from
        target: SYSREQ-BYOOS-001
      - type: related-to
        target: REQ-OS-MPU-001
      - type: related-to
        target: DD-OS-BUILD-001

  - id: VER-OS-ISO-001
    type: sw-verification
    title: "Verus/Kani region-program FSM + fault-injection + the synth#757 containment demo"
    method: formal-verification
    status: verified
    release: v0.5.0
    description: "Multi-part evidence for REQ-OS-ISO-001, all against the same region-program source (src/mpu_switch.rs, Verus 1159 verified / 0 errors + Kani): (1) Verus and Kani proofs over the region-program FSM establishing disjointness (no two programmed regions overlap), totality (every entering partition gets a fully programmed region set before it resumes), and deny-by-default (any address not covered by the entering partition's regions is denied by construction, not by omission) — strengthened by the verified table BUILDER (RegionTable::try_add_region, machine-checked to PRESERVE table_inv on every path, + covers/covers_addr grant predicate; a caller building exclusively through new()+try_add_region cannot construct an isolation-violating table). (2) A qemu fault-injection oracle (benches/gust/src/bin/gust_iso_fault_probe.rs, lm3s6965evb v7-M PMSA MPU pre-verified by mpu_spike.rs): a cross-region write from inside a partition takes a REAL MemManage fault (CFSR=0x00000082 DACCVIOL+MMARVALID) — handler-flag-gated, non-vacuous (granting the hole flips it to FAIL) — rather than silently corrupting a sibling. (3) The flagship acceptance test — the synth#757 containment demo (gust_iso_contain_probe.rs + no-fault control gust_iso_contain_ctl.rs): the EXACT archived synth#757 miscompile (os-tl-buggy.o, one wrong R_ARM_ABS32 relocation) has its stale head-chunk read physically DENIED at MMFAR==0x2000bff8 by the MPU programmed through the verified switch_to_partition, 0 bytes reaching the log sink; the fixed-object control runs clean under the identical map, pinning containment to the miscompiled read. SCOPE: fault-containment (an accidental compiler miscompile), not security-containment (the demo tenant runs privileged and the PPB is not MPU-checked); evidence is local qemu, not yet CI-gated — silicon + CI gating are v0.5.x follow-ons. Kill-criterion: a Kani/Verus harness fails, a crafted cross-region access does NOT fault, or the containment demo's miscompiled read is NOT denied. CI-GATED 2026-09-04 (gale#348): the fault-injection oracle in (2) now runs in kill-criteria.yml on every PR, and its non-vacuity runs with it. The 'granting the hole flips it to FAIL' check this description already claimed was performed BY A MANUAL EDIT, which CI cannot run — so the only MPU ENFORCEMENT evidence gale held ran on a laptop. It is now a cargo feature (grant-hole) adding region 3 over exactly the denied range, still through the verified switch_to_partition rather than by hand, and CI asserts both directions: control ON must FAIL ('write to denied 0x20008000 fell through — MPU not enforcing', exit 1), control OFF must PASS ('inside-write ok, outside-write denied @0x20008000, CFSR=0x00000082 DACCVIOL+MMARVALID', exit 0). Also worth separating: the neighbouring Renode gate gust_iso.robot executes the region programmer's COMPUTATION and the seam order (iso-region-ok, iso-mpu-seam-ok, iso-nointerfere-ok) and asserts NO fault anywhere — it runs cortex-m3 on plain MappedMemory. Computation and enforcement are different claims and gale now gates both. Still local-qemu-class evidence in the sense that matters for scope: silicon remains a v0.5.x follow-on, and the fault-containment vs security-containment boundary above is unchanged. The SCOPE sentence above (fault-containment, not security-containment; privileged tenant, unchecked PPB) is no longer only prose: gust_iso_unpriv_probe.rs demonstrates the escape in CI, and REQ-OS-UNPRIV-001 tracks closing it. That matters because REQ-OS-MULTITENANT-001 asks for mutually-distrusting tenants, which this evidence does not support — a limitation recorded only in a verification artifact's scope note is one a requirement can be written past, and was. RENODE SCOPE CORRECTED 2026-09-04: gale had recorded that Renode holds MPU registers as state but does not enforce them, and routed all enforcement evidence to qemu on that basis. Too broad. Renode DOES enforce the v7-M MPU — the same spike dropped to CONTROL.nPRIV=1 before the denied store returns ENFORCED with CFSR=0x82 DACCVIOL+MMARVALID on cortex-m3 and cortex-m7, on the 2026-09-04 nightly. What Renode does not honour is MPU_CTRL.PRIVDEFENA on the PMSAv7 path: a PRIVILEGED access matching no enabled region is granted the ARMv7-M default map, because the NVIC forwards only bit 0 of MPU_CTRL to the CPU and the v7 background path has no PRIVDEFENA test. The v8-M path forwards the whole word and denies correctly, which is the control isolating the defect. Consequence for gale: an unprivileged tenant CAN be isolation-gated in Renode, so the emulated venue is available for REQ-OS-UNPRIV-001's posture and is not restricted to qemu. The original spike ran privileged and so could not distinguish no-enforcement from PRIVDEFENA-ignored; it asserted the broader claim. A downstream reached the same wrong conclusion independently from the same blind spot (gale#348)."
    tags: [gust, os, isolation, mpu, verus, kani, renode, synth757, verified]
    links:
      - type: verifies
        target: REQ-OS-ISO-001

  # ==========================================================================
  # v0.6.0 — Outer preemptive partition switch (ARINC-653-class backbone)
  # ==========================================================================

  - id: REQ-OS-SWITCH-001
    type: sw-req
    title: "Outer fixed-priority time-partitioned preemptive switch + per-partition region-swap"
    status: verified
    release: v0.6.0
    description: >
      The outer scheduler SHALL provide fixed-priority, time-partitioned,
      preemptive switching across N partitions on an offline-planned major
      frame, combining two independent guarantees: TEMPORAL isolation — a
      non-maskable window-end preemption that inner (partition-local) code
      cannot defer, mask, or extend — and SPATIAL isolation — the
      per-partition MPU/MMU region-swap (REQ-OS-ISO-001) ordered strictly
      before the entering partition's inner scheduler is resumed, so no
      instruction of the new partition ever executes under the old
      partition's memory map. gale contributes the PROOF that this
      particular switch implementation has these properties; it explicitly
      ADOPTS the mechanism from established static-partitioning
      hypervisor/ARINC-653-class patterns rather than inventing a novel
      scheduling algorithm — the load-bearing claim of this requirement is
      verification, not novelty. Scope for this release includes
      multi-partition-per-core placement (e.g. a flight-control partition
      and a mission partition sharing one core, an estimator partition on a
      second core) and the multi-core mapping wired into the Renode model.
    tags: [gust, os, scheduler, partition-switch, temporal, spatial, arinc653, safety, gale63]
    links:
      - type: derives-from
        target: SYSREQ-BYOOS-001
      - type: related-to
        target: REQ-OS-ISO-001
      - type: related-to
        target: REQ-OS-EXEC-001
      - type: related-to
        target: DD-OS-BUILD-001

  - id: VER-OS-SWITCH-001
    type: sw-verification
    title: "Verus/Kani on the outer switch (un-maskable window-end preemption, ordered region-swap) + multi-partition Renode demo"
    method: formal-verification
    status: verified
    release: v0.6.0
    description: >
      Verus and Kani proofs over the outer switch core establish: (1)
      window-end preemption fires unconditionally at the planned major-frame
      boundary regardless of what the currently-running partition's inner
      scheduler does — inner code has no code path that can mask, defer, or
      extend its allotted window; (2) the per-partition region-swap
      (REQ-OS-ISO-001's region-program FSM) is always fully applied BEFORE
      the entering partition's first instruction executes, i.e. the switch
      is temporally ordered spatial-isolation-then-resume with no window in
      which the wrong memory map is live. End-to-end: a multi-partition
      demo on the Renode multi-core model exercising at least three
      partitions across the planned major frame, confirming each partition
      only ever executes within its own window and its own memory map.
      Schedulability of the inner tasks under this outer supply is closed
      separately by track T3 (REQ-OS-SCHED-001). Kill-criterion: a
      Verus/Kani harness fails, a partition's window is observed to run
      past its planned boundary, or the region-swap is observed applied
      after the entering partition has already resumed.
      DELIVERED (2026-07-16, status implemented): part (1) FULLY — Verus
      1095/0 + Kani 4/4 over the outer switch FSM (src/partition_switch.rs,
      #187): window disjointness/no-skip, un-maskable boundary detection,
      and lemma_resume_implies_region_swap (Resume reachable only through
      ProgramRegions ⇒ region-swap strictly precedes resume). AND part (2)
      CORE — a single-core qemu (lm3s6965evb, real ARMv7-M PMSA MPU)
      demonstrator (benches/gust/src/bin/gust_switch_probe.rs) driving the
      VERIFIED gale::partition_switch::Switcher across a 3-partition major
      frame (windows P0→P1→P2→P0): each partition writes its OWN scratch
      (no fault) and every cross-partition write is DENIED by a real
      MemManage fault (CFSR=0x82 DACCVIOL+MMARVALID, MMFAR == the exact
      neighbour address), the MPU programmed ONLY through the verified
      switch_to_partition, region-swap-before-resume OBSERVED via RBAR
      readback, plus an in-probe non-vacuity control (P0 denied in P1's
      window). Adversarially reviewed 0-critical incl. neuter tests
      (no-op the switch ⇒ oracle FLIPS TO FAIL, confirmed) — the
      confinement is attributable to the verified switch, not the layout.
      REMAINING for `verified`: the multi-CORE Renode placement demo (a
      second core / estimator partition wired into the Renode model) — this
      adds deployment/integration breadth, NOT a new verification property;
      scoped as a v0.6.x follow-on. Evidence to date is local qemu, not yet
      CI-gated.
      ADDENDUM (2026-07-17, Renode multi-core placement demo): the 2-core
      Renode model is DELIVERED with an honest, spike-bounded scope. A
      committed decision spike (benches/gust/src/bin/mpu_spike_renode.rs,
      Renode 1.16.1 cortex-m3) established that Renode's M3 holds the v7-M
      MPU registers as readable/writable STATE (MPU_TYPE.DREGION == 8,
      RBAR/RASR read back exactly what the verified core wrote) but does
      NOT enforce them — a store into an ungranted region falls through
      with no MemManage (spike RESULT=0xBADF0011). The Renode demo
      (renode-test/gust_switch_2core.{repl,robot}, CI target
      gust-switch-2core-renode in gust-renode.yml) therefore demonstrates:
      (a) the 3-partition major frame advancing P0(flight) -> P1(mission)
      -> P2(payload) -> wrap under the VERIFIED Switcher on core 0
      (off-boundary ticks never preempt, boundary ticks always do); (b)
      region-swap-before-resume OBSERVED at every switch — seam order
      save < swap < resume plus RBAR readback of REAL register state
      confirming the incoming partition's scratch region already
      programmed at resume (asserted per switch, exact base addresses);
      (c) multi-CORE placement — an estimator partition pinned to core 1
      (gust_estimator_part.rs) running concurrently under its own map
      programmed via the verified switch_to_partition, per-core private
      flash/SRAM/NVIC/UART in the .repl; (d) spatial-map correctness at
      the VERIFIED-QUERY level per window (covers_addr own-yes/
      neighbour-no — a table query, NOT a hardware fault). Map-ENFORCEMENT
      evidence (real MemManage cross-partition denials, CFSR=0x82, exact
      MMFAR) remains the qemu demonstrator above — Renode's M3 cannot
      contribute it. Content-gated line-by-line on each core's own UART
      (robot), green locally on Renode 1.16.1 via renode-test.
      VERIFIED (2026-07-17): flipped implemented→verified — every normative
      ask of REQ-OS-SWITCH-001 now has a green mechanical oracle: temporal
      un-maskability + ordered swap-before-resume are Verus/Kani-PROVEN
      (partition_switch.rs); spatial map-ENFORCEMENT is qemu-demonstrated on
      the real v7-M MPU with non-vacuity neuter tests (gust_switch_probe);
      and the MULTI-CORE mapping is now wired into the Renode model
      (gust-switch-2core-renode) with ≥3 partitions across the frame. The
      one composition step — multi-core enforcement = the SAME verified
      per-core switch_to_partition replicated, cores share no MPU surface —
      is sound and stated, not demonstrated in a single artifact; true
      multi-core-hardware-MPU-enforcement on silicon is the v1.0 strengthening
      (§1.1 per-target). All kill-criteria pass on both platforms. This flip
      is gated on this PR's Renode CI target going green (the multi-core
      oracle); it does not stand on a red gate.
    tags: [gust, os, scheduler, partition-switch, verus, kani, renode, verified]
    links:
      - type: verifies
        target: REQ-OS-SWITCH-001

  # ==========================================================================
  # v0.7.0 — Value-domain Health Monitor + failsafe state machine
  # ==========================================================================

  - id: REQ-OS-HM-001
    type: sw-req
    title: "Value-domain Health Monitor + failsafe state machine (erroneous-but-timely detection)"
    status: verified
    release: v0.7.0
    description: >
      The Health Monitor SHALL detect the dominant real-world loss mode —
      output that is ERRONEOUS BUT TIMELY, not merely late or absent — via
      explicit value-domain detectors: data freshness/staleness checks,
      plausibility and innovation gating against a physical/estimator
      model, cross-sensor voting, and estimator-divergence detection. This
      SHALL be paired with an explicit failsafe state machine covering, at
      minimum: loss of the remote-control link, loss of the telemetry/
      datalink, loss of GPS or estimator convergence, geofence breach, and
      low-battery/power-budget exhaustion, each mapping onto the existing
      independent cross-core monitor tier (the F100 Health-Monitor tier
      already demonstrated as a hardware-independent backstop). The
      escalation ladder from a single detector trip to the terminal
      failsafe action SHALL be provably terminating (no detector
      combination can leave the system oscillating between states without
      reaching a defined terminal action). The design SHALL state a
      diagnostic-coverage figure against a named fault model, not merely
      assert coverage qualitatively.
    tags: [gust, os, health-monitor, failsafe, value-domain, safety, gale63]
    links:
      - type: derives-from
        target: SYSREQ-BYOOS-001
      - type: related-to
        target: REQ-OS-SWITCH-001
      - type: related-to
        target: DD-OS-BUILD-001

  - id: VER-OS-HM-001
    type: sw-verification
    title: "Verus/Kani on the HM/failsafe FSM + per-trigger fault-injection + diagnostic-coverage figure"
    method: formal-verification
    status: verified
    release: v0.7.0
    description: >
      Verus and Kani proofs over the Health-Monitor/failsafe state machine
      establish that the escalation ladder is total (every reachable state
      has a defined transition for every detector event) and terminating
      (no cycle exists that avoids the terminal failsafe action once its
      trigger condition holds). End-to-end: a fault-injection demo exercises
      each named failsafe trigger (RC-loss, datalink-loss, GPS/estimator-
      loss, geofence, low-battery) independently and confirms the system
      reaches the correct terminal state within the modelled detection
      latency, plus a stated diagnostic-coverage figure computed against
      the named fault model in REQ-OS-HM-001. Kill-criterion: a Verus/Kani
      harness fails, an injected fault does not reach its mapped failsafe
      state, or the escalation ladder is observed to cycle without
      reaching a terminal action.
      DELIVERED (2026-07-17): part (1) FULLY — Verus H1-H5 + Kani
      h1_escalation_terminates..h7_replenish_requires_quiet plus
      h8_vote_2of3_characterized (src/health_monitor.rs) prove the
      escalation ladder total and
      terminating (an always-faulting input reaches CrossCoreTrip in
      <= MAX_RESTARTS+2 steps from any well-formed Normal), no-silent-clear
      on restart, the two failsafe states absorbing (PartitionFailsafe only
      escalates on a liveness fault; CrossCoreTrip is terminal for
      software), cause-preservation, and the long-run cooldown-bounded
      restart rate (chattering/intermittent faults cannot restart
      indefinitely). AND part (2) — the per-cause fault-injection
      demonstrator (benches/gust/src/bin/gust_hm_probe.rs, qemu
      lm3s6965evb): all 6 named causes from REQ-OS-HM-001 (RC-loss ->
      HeartbeatLoss, datalink-loss -> Stale, GPS/estimator-loss ->
      Diverged, geofence breach -> Implausible, low-battery -> BudgetOverrun,
      sensor-disagreement -> VoteMismatch)
      independently drive the REAL Hm FSM to their correct terminal state
      (2 CrossCoreTrip via the liveness-class detectors, 4 PartitionFailsafe
      via the value-domain detectors, by design per H3 -- value faults are
      absorbed, only liveness faults cross-trip) within the proven step
      bound (MAX_RESTARTS+1=4 / MAX_RESTARTS+2=5 on_fault calls), with an
      explicit no-silent-clear check per cause, a non-vacuity check (a
      healthy observation clears every gate — including the TMR vote over
      three agreeing replicas, a Normal Hm stays Normal, a
      Degraded Hm genuinely restarts to Normal), and a standalone
      CrossCoreTrip absorbing check over all 7 Fault kinds. Plus the stated
      diagnostic-coverage figure (docs/gust/hm-diagnostic-coverage.md):
      6/6 named mission-loss causes covered by a mapped detector with a
      proven terminal-state path; 6/7 detector classes directly exercised
      by a named cause (DeadlineMiss proven identically but not primary for
      any of the 6). Honest scope: qemu logic demonstrator, not silicon;
      the DC figure is model-coverage against the named fault list, NOT a
