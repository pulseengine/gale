artifacts:

  - id: SYSREQ-ARCH-MODES-001
    type: system-req
    title: gale shall be one verified core usable as primitives, as a library OS and as an OS, on several hosts
    status: approved
    description: "gale shall provide one formally verified core that is usable in three modes: primitives (verified decision functions inside a host kernel), library OS (gust running on a host OS) and OS (gust on bare metal). Only the port and the trusted base shall change between modes. Hosts in scope: bare metal, Zephyr, FreeRTOS, Linux and macOS. The host OS and the hardware (architecture, processor, SoC, board) shall be independent axes. Every mode keeps gale's own semantics. Decided 2026-11-08; see docs/architecture/three-modes-two-axes.md."
    tags: [architecture, modes, library-os, ports]
    fields:
      priority: must
      req-type: functional
      verification-criteria: The same core and gust sources build and pass their matched-pair isolation test on at least two hosts (bare metal Cortex-M and POSIX), differing only in the host port, the arch port and the target data.
    links:
      - type: derives-from
        target: STKH-BYOOS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-HOSTPORT-001
    type: sw-req
    title: Each host is reached through one host-port contract, outside the verified code
    status: approved
    description: "gust shall reach its host only through a host-port contract with these capabilities: boot, exec (run a partition until it yields or is preempted; save and resume it), time (now, resolution, arm a deadline), events (interrupt or host event into gale), protect (grant and revoke a region), io, and fatal. Each host (bare metal, Zephyr, FreeRTOS, POSIX) is one implementation under ports/host/, selected at compile time. The contract lives outside the verified code, so the verified core keeps its rule of no trait objects and no closures."
    tags: [architecture, ports, host-seam]
    fields:
      priority: must
      req-type: interface
      verification-criteria: "Step 2: the duplicated bare-metal shim (MMIO accessors in 19 binaries, UART tx in 13, mpu_write in 9, semihosting exit in 48) moves into ports/host/baremetal and ports/arch/armv7m. The .text sections of all native gust binaries are compared before and after, and every difference is zero or explained; the Renode cycle gates keep their recorded values. Step 3: a second (POSIX) implementation runs gust_two_tenant on Linux and macOS."
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-ARCHPORT-001
    type: sw-req
    title: Architecture is code under ports/arch; processor, SoC and board are AADL data, never code
    status: approved
    description: "CPU-architecture behaviour (context switch, memory-protection unit or MMU) shall live in an arch port under ports/arch/ (armv7m first; armv8m and riscv32 later). Processor, SoC and board facts shall be data only: the AADL target model and what is generated from it (constants, linker script, gust:hal worlds). Adding a processor, SoC or board shall need no code change outside the generated files and a build selector."
    tags: [architecture, ports, arch-seam, hardware-model]
    fields:
      priority: must
      req-type: interface
      verification-criteria: The armv7m arch port is extracted with every native gust binary's .text unchanged or the difference explained. A new board is added by AADL plus regeneration alone, with no hand edit outside the generated tree and the build selector.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-PLATFORM-DECL-001
    type: sw-req
    title: Every port declares what it trusts and protects, and the declaration is checked
    status: approved
    description: "Each host port shall declare its trusted host kernel (none for bare metal), its protection level (none, fault-containment or authority-containment) and whether its timing results count as device evidence (bare metal: yes; hosted ports: never). The declaration shall be published in the trusted-base JSON (REQ-HONESTY-TCB-001) as a per-target platform block. A gate shall check the declared protection level against a matched-pair test on that port: with protection on, a write by tenant A into B's memory is caught and the health monitor reaches the same verdict as on the reference platform; with protection off, the write lands."
    tags: [architecture, ports, trusted-base, honesty, evidence]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: The gate fails when a port declares a protection level its matched pair does not show, and when a hosted port's timing result is filed as device evidence.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
      - type: constrained-by
        target: REQ-HONESTY-TCB-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-HWTRUTH-001
    type: sw-req
    title: AADL is authoritative for hardware facts; on a host with its own board support a gate cross-checks it
    status: approved
    description: For every hardware fact gale relies on (memory map, peripheral bases, interrupt numbers, reset flags), the AADL target model shall be the source of truth. On a host that has its own board support (Zephyr devicetree, FreeRTOS vendor configuration), a gate shall compare the AADL facts with the host's and fail on any disagreement. gale shall neither generate the host's configuration nor defer to it.
    tags: [architecture, hardware-model, aadl, cross-check]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: For each RTOS host port, the cross-check gate is red on an injected disagreement between the AADL model and the host description (negative control), and green on the shipped targets.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: FIND-ARCH-AXES-001
    type: finding
    title: gale is already host-free at its core; the OS, the host seam and a host run exist but are unnamed
    status: active
    description: "Measured 2026-11-08: (1) 54 of the 55 files in src/ are host-free decision logic; only systick.rs touches the CPU. (2) The OS (gust: partition switch, health monitor, scheduler, 29 driver/provider/app crates, the gust:hal, gust:os and gust:sched WIT seams) lives under benches/gust/, referenced from 9 of 29 workflows and 8 rivet artifact files. (3) Bare-metal gust runs on a small trusted native shim whose capabilities are the host seam, unnamed. (4) gustos-hostrun already runs the fused gust:os component on a host engine, with a fake register file as its only residual import. (5) Hardware is already split by the AADL target model (cores, parts, boards), and that split was silicon-validated on two families. Consequence: the repo still describes gale as Zephyr primitives, but it is one verified core used in three modes, with host and hardware as independent axes. It extends the earlier drop-in-or-build-your-own finding (which informs this one) with the host and hardware axes."
    tags: [architecture, reframe, modes, library-os]
    fields:
      action-required: true
      relevance: high
      source: repo survey 2026-11-08; owner option dialogue 2026-11-08
    links:
      - type: generates
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:17Z
