artifacts:

  - id: SYSREQ-ARCH-MODES-001
    type: system-req
    title: gale shall be one verified core usable as primitives, as a library OS and as an OS, on several hosts
    status: approved
    description: "gale shall provide one formally verified core that is usable in three modes: primitives (verified decision functions inside a host kernel), library OS (gust running on a host OS) and OS (gust on bare metal). Only the port and the trusted base shall change between modes. Hosts in scope: bare metal, Zephyr, FreeRTOS, Linux and macOS. The host OS and the hardware (architecture, processor, SoC, board) shall be independent axes. Every mode keeps gale's own semantics. Decided 2026-11-08; see docs/architecture/three-modes-two-axes.md."
    tags: [architecture, modes, library-os, ports]
    fields:
      priority: must
      req-type: functional
      verification-criteria: The same core and gust sources build and pass their matched-pair isolation test on at least two hosts (bare metal Cortex-M and POSIX), differing only in the host port, the arch port and the target data.
    links:
      - type: derives-from
        target: STKH-BYOOS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-HOSTPORT-001
    type: sw-req
    title: Each host is reached through one host-port contract, outside the verified code
    status: approved
    description: "gust shall reach its host only through a host-port contract with these capabilities: boot, exec (run a partition until it yields or is preempted; save and resume it), time (now, resolution, arm a deadline), events (interrupt or host event into gale), protect (grant and revoke a region), io, and fatal. Each host (bare metal, Zephyr, FreeRTOS, POSIX) is one implementation under ports/host/, selected at compile time. The contract lives outside the verified code, so the verified core keeps its rule of no trait objects and no closures."
    tags: [architecture, ports, host-seam]
    fields:
      priority: must
      req-type: interface
      verification-criteria: "Step 2: the duplicated bare-metal shim (MMIO accessors in 19 binaries, UART tx in 13, mpu_write in 9, semihosting exit in 48) moves into ports/host/baremetal and ports/arch/armv7m. The .text sections of all native gust binaries are compared before and after, and every difference is zero or explained; the Renode cycle gates keep their recorded values. Step 3: a second (POSIX) implementation runs gust_two_tenant on Linux and macOS."
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-ARCHPORT-001
    type: sw-req
    title: Architecture is code under ports/arch; processor, SoC and board are AADL data, never code
    status: approved
    description: "CPU-architecture behaviour (context switch, memory-protection unit or MMU) shall live in an arch port under ports/arch/ (armv7m first; armv8m and riscv32 later). Processor, SoC and board facts shall be data only: the AADL target model and what is generated from it (constants, linker script, gust:hal worlds). Adding a processor, SoC or board shall need no code change outside the generated files and a build selector."
    tags: [architecture, ports, arch-seam, hardware-model]
    fields:
      priority: must
      req-type: interface
      verification-criteria: The armv7m arch port is extracted with every native gust binary's .text unchanged or the difference explained. A new board is added by AADL plus regeneration alone, with no hand edit outside the generated tree and the build selector.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-PLATFORM-DECL-001
    type: sw-req
    title: Every port declares what it trusts and protects, and the declaration is checked
    status: approved
    description: "Each host port shall declare its trusted host kernel (none for bare metal), its protection level (none, fault-containment or authority-containment) and whether its timing results count as device evidence (bare metal: yes; hosted ports: never). The declaration shall be published in the trusted-base JSON (REQ-HONESTY-TCB-001) as a per-target platform block. A gate shall check the declared protection level against a matched-pair test on that port: with protection on, a write by tenant A into B's memory is caught and the health monitor reaches the same verdict as on the reference platform; with protection off, the write lands."
    tags: [architecture, ports, trusted-base, honesty, evidence]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: The gate fails when a port declares a protection level its matched pair does not show, and when a hosted port's timing result is filed as device evidence.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
      - type: constrained-by
        target: REQ-HONESTY-TCB-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: REQ-ARCH-HWTRUTH-001
    type: sw-req
    title: AADL is authoritative for hardware facts; on a host with its own board support a gate cross-checks it
    status: approved
    description: For every hardware fact gale relies on (memory map, peripheral bases, interrupt numbers, reset flags), the AADL target model shall be the source of truth. On a host that has its own board support (Zephyr devicetree, FreeRTOS vendor configuration), a gate shall compare the AADL facts with the host's and fail on any disagreement. gale shall neither generate the host's configuration nor defer to it.
    tags: [architecture, hardware-model, aadl, cross-check]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: For each RTOS host port, the cross-check gate is red on an injected disagreement between the AADL model and the host description (negative control), and green on the shipped targets.
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:01Z

  - id: FIND-ARCH-AXES-001
    type: finding
    title: gale is already host-free at its core; the OS, the host seam and a host run exist but are unnamed
    status: active
    description: "Measured 2026-11-08: (1) 54 of the 55 files in src/ are host-free decision logic; only systick.rs touches the CPU. (2) The OS (gust: partition switch, health monitor, scheduler, 29 driver/provider/app crates, the gust:hal, gust:os and gust:sched WIT seams) lives under os/gust/, referenced from 9 of 29 workflows and 8 rivet artifact files. (3) Bare-metal gust runs on a small trusted native shim whose capabilities are the host seam, unnamed. (4) gustos-hostrun already runs the fused gust:os component on a host engine, with a fake register file as its only residual import. (5) Hardware is already split by the AADL target model (cores, parts, boards), and that split was silicon-validated on two families. Consequence: the repo still describes gale as Zephyr primitives, but it is one verified core used in three modes, with host and hardware as independent axes. It extends the earlier drop-in-or-build-your-own finding (which informs this one) with the host and hardware axes."
    tags: [architecture, reframe, modes, library-os]
    fields:
      action-required: true
      relevance: high
      source: repo survey 2026-11-08; owner option dialogue 2026-11-08
    links:
      - type: generates
        target: SYSREQ-ARCH-MODES-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-08T10:30:17Z

  - id: FIND-ARCH-NORTHSTAR-001
    type: finding
    title: "gale's architecture order follows synth's support levels and the bench: ARMv6-M, then RV32, then ARMv7E-M, ARMv8-M deferred"
    status: active
    description: "Owner option dialogue 2026-11-18 set gale's order to M0+ then RV32 then M7 then M33, ARMv8-M deferred with no TrustZone in v1, and asked synth for a declared RV32IMC profile. synth's plan is epic synth#1741, where its RQ-91-SUPPORTLEVELS defines L3 experimental, L2 execution-tested (CI-wired wasmtime differential plus loud-decline tripwires) and L1 verified (Rocq proofs, required differential, required WCET gate, acceptance rung); WCET is strict at L1, so M7, R5, AArch64 and x86-64 stop at L2. State on 2026-11-18: ARMv7-M is L1 in synth and silicon-verified in gale on five boards (VER-SILICON-MATRIX-001); ARMv6-M has an accepted register contract (synth#1301, notice 20261118T091556-9870f8) with lanes building; RV32IMAC is L2; ARMv7E-M has a spec-execution leg; ARMv8-M is an unknown target triple in synth. gale has one arch port (ports/arch/armv7m), and CTX-1 still scopes the deployment context to ARM Cortex-M with an MPU. Two open issues say the cross-arch gates cannot change verdict (gale#506, gale#389)."
    tags: [architecture, north-star, synth, multi-arch]
    fields:
      action-required: true
      relevance: high
      source: synth roadmap message 2026-11-18; owner option dialogue 2026-11-18; rivet survey of origin/main
    links:
      - type: generates
        target: REQ-ARCH-ARMV6M-001
      - type: generates
        target: REQ-ARCH-ARMV7EM-001
      - type: generates
        target: REQ-ARCH-ARMV8M-001
      - type: related-to
        target: REQ-OS-TARGET-RV32-001
      - type: related-to
        target: CTX-1
      - type: related-to
        target: VER-SILICON-MATRIX-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-18T10:30:00Z

  - id: REQ-ARCH-ARMV6M-001
    type: sw-req
    title: "A dissolved object runs on ARMv6-M silicon (G031K8) under the accepted R9-R11 register contract"
    status: proposed
    release: v0.12.0
    description: "SHALL: wdg-thin, dissolved by synth for ARMv6-M at support level L2 or better (synth#1741, synth#1301), runs on the NUCLEO-G031K8 and joins the dissolved-IWDG two-boot row of the silicon matrix. The register contract is the ARMv7-M one, unchanged: R11 memory-0 base, R10 memory-0 size, R9 globals base (owner agreed 2026-11-18, notice 20261118T091556-9870f8). gale's obligation is its boot shims: on ARMv6-M they set R9-R11 through a low register (movs r0,#0; mov r11,r0), because mov.w r11,#0 has no ARMv6-M encoding. The arch port is ports/arch/armv6m per REQ-ARCH-ARCHPORT-001. NOT IN SCOPE: isolation and the criticality arms, excluded by hardware because ARMv6-M PMSA has no AP encodings that distinguish privileged from unprivileged access. Today the G031K8 runs native Rust only and gust_wdg_silicon is refused for target-g031k8 by compile_error!."
    tags: [architecture, armv6m, north-star, silicon, synth]
    fields:
      priority: should
      req-type: functional
      verification-criteria: "cargo xtask silicon matrix reports PASS for the dissolved wdg-thin two-boot reset on g031k8, the verdict taken from the firmware's own OK line. Planted bad input: a shim that writes r11 with the ARMv7-M encoding fails to assemble or is rejected by synth verify-embedder's ARMv6-M leg. The compile_error! for target-g031k8 is removed in the same change."
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
      - type: related-to
        target: REQ-ARCH-ARCHPORT-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-18T10:30:00Z

  - id: REQ-ARCH-ARMV7EM-001
    type: sw-req
    title: "gust runs on the ARMv7E-M deployment target (Pixhawk 6X-RT, i.MX RT1176 Cortex-M7) from a generated target model"
    status: proposed
    release: v0.14.0
    description: "SHALL: an i.MX RT1176 target model generated per REQ-TARGET-MODEL-001, and one dissolved driver written against the part's real registers, observed acting on the Pixhawk 6X-RT. synth caps ARMv7E-M at support level L2 because WCET declines on the M7 (synth#1741, TP-004), so gale SHALL NOT cite a WCET bound for this target; timing evidence is high-water-mark only. The M4 coprocessor and the secure element are out of scope for this requirement."
    tags: [architecture, armv7em, cortex-m7, north-star, synth]
    fields:
      priority: should
      req-type: functional
      verification-criteria: "cargo xtask silicon matrix reports PASS for the driver on the 6X-RT, and the target-model drift gate is green for the new model. Planted bad input: a hand-written peripheral address in the driver fails the target-model gate (REQ-TARGET-MODEL-002)."
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
      - type: related-to
        target: REQ-ARCH-ARCHPORT-001
      - type: related-to
        target: REQ-TARGET-MODEL-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-18T10:30:00Z

  - id: REQ-ARCH-ARMV8M-001
    type: sw-req
    title: "ARMv8-M (Cortex-M33) is deferred: no bench board, and no TrustZone secure/non-secure split in v1"
    status: proposed
    release: "-"
    description: "Owner decision 2026-11-18: gale has no ARMv8-M board, so it asks synth for no M33 lane yet and needs no TrustZone in v1. The only coverage is the Renode target SWARCH-TGT-003 (STM32L552), which cannot stand in for the memory-protection check because Renode's MPU model is more permissive than silicon. Re-plan when a board is on the bench; non-TrustZone first, matching synth's TP-005 order."
    tags: [architecture, armv8m, deferred, north-star]
    fields:
      priority: should
      req-type: functional
      verification-criteria: "Kill-criterion: any gale release claims M33 or TrustZone support while this requirement is deferred."
    links:
      - type: derives-from
        target: SYSREQ-ARCH-MODES-001
      - type: related-to
        target: REQ-ARCH-ARCHPORT-001
      - type: related-to
        target: SWARCH-TGT-003
    provenance:
