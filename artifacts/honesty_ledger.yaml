  - id: REQ-HONESTY-KANI-COVERAGE-001
    type: sw-req
    title: Every crate with a Kani harness is run by a CI cargo kani invocation that can fail
    status: proposed
    release: v0.11.0
    description: >
      Found 2026-11-19: formal-verification.yml and nightly.yml ran `cargo kani`
      only at the repository root and in ffi/, so the harnesses in the driver
      crates (14 crates, 101 #[kani::proof] harnesses at e85b7620) were checked
      by no CI job, and "Kani-proven" in their docs was a local result. SHALL:
      every package with a #[kani::proof] harness in code is run by at least one
      CI `cargo kani` invocation that can fail its job. An invocation counts
      only in an ALLOWLISTED shape (anything else is void): workflows read by
      a strict YAML reader (anchors, tags, duplicate keys, continued scalars
      and any line break other than LF/CRLF are refused); step keys only
      name, id, if, run, working-directory, timeout-minutes; every `if:` on
      the path (job and step) absent or exactly the path-guard form, with a
      guard job whose keys, env names and script template are allowlisted (no
      `if:`, `needs:`, `container:`, `defaults:` or `concurrency:` on it, and
      only checkout steps before the template step); job keys and
      job/workflow env names allowlisted; a script that is exactly one
      `cargo kani` line of allowlisted literal flags, optionally after one
      `set -o pipefail` line and optionally ending `| tee <path>`; a trigger
      that the gate reads as running for main (a schedule whose crons parse
      and fire every year, or push/pull_request with a branches list naming
      main and no `!` pattern -- read from the workflow text, not observed),
      and for a path-guarded invocation a push-to-main or schedule trigger,
      since on a pull_request the guard may skip it every time; no matrix
      `exclude:` when the directory comes from the matrix. A crate whose
      harnesses all sit outside its compiled roots fails even with a step.
      `cargo xtask check kani-coverage` fails otherwise. The job that runs the driver harnesses is
      not a required context; making it one is the owner's decision.
    tags: [honesty, kani, ci, gate, v0.11.0]
    fields:
      priority: must
      req-type: constraint
      verification-criteria: "`cargo xtask check kani-coverage --self-test` passes (a crate dropped from the job, a new crate with no job, a crate with no harness in a compiled root, root tests/ harnesses without --tests, and each form outside the allowlist above -- at step and job level where both exist, including the reviews' planted bypasses: `continue-on-error` in any spelling, `if: true` / `if: false` / an undeclared guard output on the job, `env: BASH_ENV`, `shell:`, `builtin`/`eval` `set +e`, sourcing a script, `&&`/`;`/`||`, `set -- -o pipefail`, a pipe without pipefail, `|&`, `--harness`/`-p`, a wide-dash `-   run:` step, a CR-hidden key, a guard job with env/defaults/container/needs, `branches: [main, '!main']`, `schedule: []` -- are each caught); `cargo xtask check kani-coverage` passes on the branch and fails on e85b7620 (14 driver crates uncovered)."false\"`, `if: false && true`, `continue-on-error: ${{ true }}`/`True`/`true # comment`, `set +e`, `set +o pipefail`, `trap ... ERR`, `shell: bash {0}`, `cargo kani &`, folded `run: >-`, `echo cargo kani`, `--harness`, `-p`, `pushd` -- are each caught); `cargo xtask check kani-coverage` passes on the branch and fails on e85b7620 (14 driver crates uncovered)."
    links:
      - type: derives-from
        target: SYSREQ-COV-001
      - type: related-to
        target: REQ-OS-TRITRACK-001
      - type: related-to
        target: REQ-HONESTY-TCB-001

