  - id: VER-HONESTY-LEDGER-GATE-001
    type: sw-verification
    title: The trust-ledger gate counts assumption spellings per file against an equality ledger, and its planted inputs fail
    status: proposed
    release: v0.11.0
    description: >
      Implements the oracle planned as VER-HONESTY-LEDGER-001 (plan branch). `cargo xtask check trust-ledger`
      counts, per tracked .rs/.v/.lean file, kani::assume, #[kani::unwind(N)]
      with its bound, Verus external_body / assume_specification / bare assume
      and admit, Rocq Admitted / admit / Axiom / Parameter, and Lean sorry /
      admit / axiom, and holds them equal to tools/xtask/trust-ledger.ledger
      (mode = equality; `mode = shrink-only` with `baseline = <sha>` is the one
      switch, set in the first commit after the release tag). Each row names the artifact that justifies
      it and the gate checks that artifact exists. Self-test: an added
      kani::assume, a lowered unwind bound, an added Admitted. and an unrecorded
      shrink each fail; a reformat and a comment-only edit do not. Seeded
      counts at e85b7620: 422 kani::assume in 22 files, 74 kani::unwind in 14,
      135 external_body in 12, 2 assume_specification in 1, 74 Rocq Admitted in
      3, 0 Lean sorry; 14 "-impredicative-set" flags in 3 Bazel files (class
      rocq:impredicative-set); 496 #[kani::proof] attributes in source (a
      spelling count; 471 are compiled). Also counted, all 0 today:
      kani::any_where, `axiom fn`, Rocq top-level Variable/Hypothesis and Admit
      Obligations, Lean sorryAx, and the cfg_attr forms of kani::proof,
      kani::unwind and external_body. Shrink-only mode reads the ledger at the
      baseline commit (one a v* tag points at, an ancestor of HEAD) as the
      ceiling (the newest v* release by version, not counting a tag on HEAD),
      plus `admit` rows (one per item, exactly the growth, a #NNN or
      owner/repo#NNN issue and a reason; stale, oversized, duplicate or
      malformed admits fail, and so does an admit naming another baseline
      than the current one or already present in the ledger at it; the gate checks the row is recorded, not that
      anyone reviewed or approved it), and returning to equality
      keeps it; duplicate mode or
      baseline lines are rejected; an ambiguous unwind change fails. NOT SHOWN:
      how much each assumption narrows; the forms the gate prints as unseen
      (aliases among them).
    tags: [honesty, ledger, kani, gate, v0.11.0]
    fields:
      method: automated-test
    links:
      - type: verifies
        target: REQ-HONESTY-LEDGER-001
      - type: related-to
        target: REQ-HONESTY-TCB-001
